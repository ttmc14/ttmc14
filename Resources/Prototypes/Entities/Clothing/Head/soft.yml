- type: entity
  parent: [ ClothingHeadBaseButcherable, BaseFoldable ]
  id: ClothingHeadHeadHatBaseFlippable
  abstract: true
  components:
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon_flipped
      map: ["foldedLayer"]
      visible: false

- type: entity
  parent: ClothingHeadHeadHatBaseFlippable
  id: ClothingHeadHeadHatBaseFlipped
  suffix: flipped
  abstract: true
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: flipped
  - type: Item
    heldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
      visible: false
    - state: icon_flipped
      map: ["foldedLayer"]
      visible: true

- type: entity
  parent: ClothingHeadHeadHatBaseFlippable
  id: ClothingHeadHatPurplesoft
  name: purple cap
  description: A purple baseball cap.
  components:
  - type: Sprite
    sprite: Clothing/Head/Soft/purplesoft.rsi
  - type: Clothing
    sprite: Clothing/Head/Soft/purplesoft.rsi
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - HamsterWearable
    - WhitelistChameleon

- type: entity
  parent: [ ClothingHeadHeadHatBaseFlipped, ClothingHeadHatPurplesoft ]
