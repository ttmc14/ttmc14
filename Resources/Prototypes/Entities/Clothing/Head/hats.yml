- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatBowlerHat
  name: bowler hat
  description: A stylish bowler hat.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/bowler_hat.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/bowler_hat.rsi

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatChef
  name: chef's hat
  description: A hat used by chefs to keep their hair out of your food. Judging by the food in the mess, they don't work.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/chefhat.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/chefhat.rsi
  - type: Storage
    grid:
    - 0,0,0,0
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: PilotedClothing
    pilotWhitelist:
      tags:
        - ChefPilot
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - HamsterWearable
    - WhitelistChameleon

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatFedoraBrown
  name: brown fedora
  description: A brown fedora.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/brownfedora.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/brownfedora.rsi
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - HamsterWearable
    - WhitelistChameleon

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatStrawHat
  name: straw hat
  description: A fancy hat for hot days! Not recommended to wear near fires.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/straw_hat.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/straw_hat.rsi
  - type: Construction
    graph: StrawHat
    node: strawhat
  - type: Tag
    tags:
    - HamsterWearable
  - type: Flammable
    fireSpread: true
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 1
  - type: Damageable
    damageModifierSet: Wood
  - type: Appearance
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
            Ash:
              min: 1
              max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
