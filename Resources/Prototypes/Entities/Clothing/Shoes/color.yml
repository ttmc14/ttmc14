- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesColorWhite
  name: white shoes
  description: Don't take them off at your office Christmas party.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/color.rsi
    layers:
    - state: icon
      color: "#EAE8E8" #Deliberately NOT pure white
    - state: soles-icon
  - type: Item
    inhandVisuals: #We don't want the sole icons. Since this is white, it's just going to look weird (white on white doesn't really contrast.)
      left:
      - state: inhand-left
        color: "#EAE8E8"
      right:
      - state: inhand-right
        color: "#EAE8E8"
  - type: Clothing
    sprite: Clothing/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        color: "#EAE8E8"
      - state: contrastedsoles-equipped-FEET

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesColorRed
  name: red shoes
  description: Stylish red shoes.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/color.rsi
    layers:
    - state: icon
      color: "#940000"
    - state: soles-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#940000"
      - state: soles-inhand-left
      right:
      - state: inhand-right
        color: "#940000"
      - state: soles-inhand-right
  - type: Clothing
    sprite: Clothing/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        color: "#940000"
      - state: soles-equipped-FEET
