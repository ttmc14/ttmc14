- type: entity
  id: ToolboxEmergencyFilled
  name: emergency toolbox
  parent: ToolboxEmergency
  suffix: Filled
  components:
  - type: StorageFill
    contents:
      - id: CrowbarRed
      - id: RadioHandheld
      - id: WelderMini
      - id: FireExtinguisherMini
      # Random lighting item orGroup
      - id: FlashlightLantern
        orGroup: LightingItem
      - id: Flare
        orGroup: LightingItem
      - id: GlowstickBase
        orGroup: LightingItem
      # Low-chance items
      - id: FoodSnackChocolate
        prob: 0.15
      - id: HarmonicaInstrument
        prob: 0.15

- type: entity
  id: ToolboxElectricalFilled
  name: electrical toolbox
  suffix: Filled
  parent: ToolboxElectrical
  components:
  - type: StorageFill
    contents:
      - id: Screwdriver
      - id: CrowbarOrange
      - id: Wirecutter
      - id: CableApcStack10
      - id: CableMVStack10
      - id: trayScanner
        prob: 0.9
      - id: CableHVStack10
        orGroup: GlovesOrWires

- type: entity
  id: ToolboxMechanicalFilled
  name: mechanical toolbox
  suffix: Filled
  parent: ToolboxMechanical
  components:
  - type: StorageFill
    contents:
      - id: CrowbarOrange
      - id: Wrench
      - id: Welder
      - id: Wirecutter
      - id: Screwdriver
        prob: 0.5
      - id: FlashlightLantern
        prob: 0.7
      - id: ClothingHeadHatHardhatBlue
        prob: 0.5
