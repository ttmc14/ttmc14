- type: constructionGraph
  parent: RMC
  id: MCBarricadeMetalGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity
    edges:
    - to: mcnodeMetal
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 4
        doAfter: 2

  - node: mcnodeMetal
    entity: MCBarricadeMetal
    edges:
    - to: start
      completed:
      - !type:ConditionalAction
        condition:
          !type:MinHealth
          threshold: 1
          byProportion: true
        action:
          !type:SpawnPrototype
          prototype: MCSheetMetal1
          amount: 4
        else:
          !type:ConditionalAction
          condition:
            !type:MinHealth
            threshold: 0.78
            byProportion: true
          action:
            !type:SpawnPrototype
            prototype: MCSheetMetal1
            amount: 3
          else:
            !type:ConditionalAction
            condition:
              !type:MinHealth
              threshold: 0.56
              byProportion: true
            action:
              !type:SpawnPrototype
              prototype: MCSheetMetal1
              amount: 2
      - !type:ConditionalAction
        condition:
          !type:IsBarbed
        action:
          !type:SpawnPrototype
          prototype: MCBarbedWire1
          amount: 1
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Prying
        doAfter: 2
