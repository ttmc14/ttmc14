- type: constructionGraph
  parent: RMC
  id: MCWindowColony
  start: start
  graph:
  - node: start
    edges:
    - to: window
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: MCMetal
        amount: 2
        doAfter: 3

  - node: windowFrameColony
    entity: MCWindowFrameColony
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MCSheetMetal1
        amount: 2
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored {}
      steps:
      - tool: Anchoring
        doAfter: 2
        duplicateConditions: All

    - to: windowColony
      completed:
      - !type:SnapToGrid
        southRotation: true
      - !type:SpawnPrototype
        prototype: MCWindowColony
      - !type:DeleteEntity {}
      conditions:
      - !type:EntityAnchored {}
      steps:
      - material: MCGlass
        amount: 2
        doAfter: 2

  - node: windowColony
    entity: MCWindowColony
    edges:
    - to: windowFrameColony
      completed:
      - !type:SnapToGrid
        southRotation: true
      - !type:SpawnPrototype
        prototype: MCSheetGlass1
        amount: 2
      - !type:SpawnPrototype
        prototype: MCWindowFrameColony
      - !type:DeleteEntity {}
      conditions:
      - !type:EntityAnchored {}
      steps:
      - tool: Screwing
      - tool: Prying
      - tool: Screwing
