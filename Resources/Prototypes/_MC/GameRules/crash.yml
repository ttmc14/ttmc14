- type: entity
  parent: BaseGameRule
  id: MCCrash
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 1
  - type: MCRuleCrashShuttle
    time: 600
    pointWhitelist:
      tags:
      - MCMarkerCrash
  - type: MCRuleXenoMarinesSpawn
  - type: MCRuleSpawnNukeDiskGenerators
  - type: MCRuleRecalculatePower
  - type: MCRuleRefreshIFF
  # xeno
  - type: MCRuleXenoMap
  - type: MCRuleXenoAutoSpawnBalance
  - type: MCRuleXenoSetupHive
    configuration:
      general:
        allowCollapse: false
        allowHarvestLarvaPoints: false
        allowGenerateLarvaPoint: false
        additionalSlots:
          3: 0 # Why -1, why?
      evolution:
        withoutRuler: true
        requiredCasteCount:
          MCXenoQueen: 6
          MCXenoKing: 12
    psypoints:
      Strategic: 0
      Tactical: 0
    autoSpawnBalance: true
  # round end
  - type: MCRuleEndRound
    resultTextPrefix: mc-crash-
  - type: MCRuleEndRoundHiveCollapse
  - type: MCRuleEndRoundMarinesDead
  - type: MCRuleEndRoundNukeExploded
  - type: MCRuleEndRoundShuttleEvacuation
