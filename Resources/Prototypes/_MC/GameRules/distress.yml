- type: entity
  id: MCDistressSignal
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20
  - type: MCRuleXenoMarinesSpawn
  - type: MCRuleSpawnNukeDiskGenerators
  - type: MCRuleRecalculatePower
  - type: MCRuleRefreshIFF
  # xeno
  - type: MCRuleXenoMap
  - type: MCRuleXenoSetupHive
    configuration:
      general:
        allowCollapse: true
        allowHarvestLarvaPoints: true
        allowGenerateLarvaPoint: true
      evolution:
        withoutRuler: false
        requiredCasteCount:
          MCXenoQueen: 6
          MCXenoKing: 12
    psypoints:
      Strategic: 800
      Tactical: 400
  # round end
  - type: MCRuleEndRound
    resultTextPrefix: mc-warfare-
  - type: MCRuleEndRoundHiveCollapse
  - type: MCRuleEndRoundMarinesDead
  - type: MCRuleEndRoundNukeExploded
  - type: MCRuleEndRoundShuttleEvacuation
