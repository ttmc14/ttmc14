- type: entity
  id: MCWarfare
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 2
  - type: MCRuleWarfare
    larvaPointsByJob:
      MCFC: 6
      MCTransportOfficer: 1.5
      MCCMO: 1
      MCDoctor: 1
      MCResearcher: 1
  - type: MCRuleCrashShuttle
    time: 600
    pointWhitelist:
      components:
      - DropshipDestination
  - type: MCRuleXenoMarinesSpawn
  - type: MCRuleRecalculatePower
  - type: MCRuleRefreshIFF
  # xeno
  - type: MCRuleXenoMap
  - type: MCRuleXenoSetupHive
    configuration:
      general:
        allowCollapse: true
        collapseTime:
          Silo: 300
        allowHarvestLarvaPoints: false
        allowGenerateLarvaPoint: false
      evolution:
        withoutRuler: true
        requiredCasteCount:
          MCXenoQueen: 6
          MCXenoKing: 12
    psypoints:
      Strategic: 800
      Tactical: 400
  # round end
  - type: MCRuleEndRound
    resultTextPrefix: mc-warfare-
  - type: MCRuleEndRoundHiveCollapse
  - type: MCRuleEndRoundShuttleEvacuation
