- type: entity
  id: MCWarfare
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 1
  - type: MCRuleCrashShuttle
    time: 600
    pointWhitelist:
      components:
      - DropshipDestination
  - type: MCRuleXenoMarinesSpawn
  - type: MCRuleRecalculatePower
  - type: MCRuleRefreshIFF
  # xeno
  - type: MCRuleXenoMap
  - type: MCRuleXenoSetupHive
    configuration:
      general:
        allowCollapse: true
        allowHarvestLarvaPoints: true
        allowGenerateLarvaPoint: true
      evolution:
        withoutRuler: true
        requiredCasteCount:
          MCXenoQueen: 6
          MCXenoKing: 12
    psypoints:
      Strategic: 800
      Tactical: 400
  # round end
  - type: MCRuleEndRound
    resultTextPrefix: mc-warfare-
  - type: MCRuleEndRoundHiveCollapse
  - type: MCRuleEndRoundMarinesDead
  - type: MCRuleEndRoundShuttleEvacuation
