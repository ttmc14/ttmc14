- type: entity
  parent: MCEffect
  id: MCEffectXenoPsyCrushOrb
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Sprite
    sprite: _MC/Effects/orb.rsi
    layers:
    - state: charge
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.MCXenoPsyCrushOrbVisuals.State:
        enum.MCXenoPsyCrushOrbVisuals.Layer:
          Idle: { state: base }
          Charging: { state: charge }
          CrushHard: { state: hard }
          CrushSmooth: { state: smooth }
  - type: MCTimedDespawnDisappearanceVisuals
    lifetime: 0.4

- type: entity
  parent: MCEffect
  id: MCEffectXenoPsyCrushWarning
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Sprite
    sprite: _MC/Effects/warning.rsi
    state: crush
  - type: TimedDespawn
    lifetime: 10
  - type: MCTimedDespawnDisappearanceVisuals
    lifetime: 0.4
