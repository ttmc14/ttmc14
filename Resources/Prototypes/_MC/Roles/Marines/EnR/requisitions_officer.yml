- type: job
  parent: MCJob
  id: MCRO
  name: mc-job-name-ro
  description: mc-job-description-ro
  playTimeTracker: MCRO
  startingGear: MCRO
  dummyStartingGear: MCRO
  icon: MCRO
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-cse
  ranks:
    MCChiefPettyOfficer: []
    MCWarrantOfficer:
    - !type:RoleTimeRequirement
      role: MCRO
      time: 600 # 10 hours
    MCChiefWarrantOfficer:
    - !type:RoleTimeRequirement
      role: MCRO
      time: 1500 # 25 hours
    MCEnsign:
    - !type:RoleTimeRequirement
      role: MCRO
      time: 60000 # 1000 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: Skills
      skills:
        MCSkillEngineer: 4
        MCSkillConstruction: 4
        MCSkillPolice: 2
        MCSkillVehicles: 4
        MCSkillLeadership: 3
        MCSkillSmartGun: -4
        MCSkillFirearms: 1
        MCSkillFireman: 1
    - type: SquadArmorWearer
    - type: JobPrefix
      prefix: mc-job-prefix-ro
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: requisition
    - type: MCASRSCost
      cost: 150

- type: playTimeTracker
  id: MCRO
  isHumanoid: true

- type: startingGear
  id: MCRO
  equipment:
    id: MCIdCardRO

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointRO
  name: squad corpsman spawn point
  components:
  - type: SpawnPoint
    job_id: MCRO
  - type: Sprite
    state: ro
