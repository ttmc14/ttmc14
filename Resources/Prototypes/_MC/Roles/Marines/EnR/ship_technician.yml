- type: job
  parent: MCJob
  id: MCST
  name: mc-job-name-st
  description: mc-job-description-st
  playTimeTracker: MCST
  startingGear: MCST
  dummyStartingGear: MCST
  icon: MCST
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-cse
  ranks:
    MCPettyOfficerThirdClass: []
    MCPettyOfficerSecondClass:
    - !type:RoleTimeRequirement
      role: MCST
      time: 600 # 10 hours
    MCPettyOfficerFirstClass:
    - !type:RoleTimeRequirement
      role: MCST
      time: 3000 # 50 hours
    MCChiefPettyOfficer:
    - !type:RoleTimeRequirement
      role: MCST
      time: 6000 # 100 hours
    MCSeniorChiefPettyOfficer:
    - !type:RoleTimeRequirement
      role: MCST
      time: 18000 # 300 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        MCSkillEngineer: 4
        MCSkillConstruction: 4
        MCSkillPolice: 2
        MCSkillVehicles: 4
        MCSkillLeadership: 3
        MCSkillSmartGun: -4
        MCSkillFirearms: 1
        MCSkillFireman: 1
    - type: SquadArmorWearer
    - type: JobPrefix
      prefix: mc-job-prefix-st
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: st
    - type: MCASRSCost
      cost: 150

- type: playTimeTracker
  id: MCST
  isHumanoid: true

- type: startingGear
  id: MCST
  equipment:
    id: MCIdCardST

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointST
  name: squad corpsman spawn point
  components:
  - type: SpawnPoint
    job_id: MCST
  - type: Sprite
    state: se
