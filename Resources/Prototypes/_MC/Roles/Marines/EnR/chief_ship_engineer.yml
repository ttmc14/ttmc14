- type: job
  parent: MCJob
  id: MCCSE
  name: mc-job-name-cse
  description: mc-job-description-cse
  playTimeTracker: MCCSE
  startingGear: MCCSE
  dummyStartingGear: MCCSE
  icon: MCCSE
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-captain
  ranks:
    MCEnsign: []
    MCLieutenantJuniorGrade:
    - !type:RoleTimeRequirement
      role: MCCSE
      time: 600 # 10 hours
    MCLieutenant:
    - !type:RoleTimeRequirement
      role: MCCSE
      time: 1500 # 25 hours
    MCLieutenantCommander:
    - !type:RoleTimeRequirement
      role: MCCSE
      time: 3000 # 50 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandAccent
    - type: MCSendOrders
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: Skills
      skills:
        MCSkillEngineer: 4
        MCSkillConstruction: 4
        MCSkillPolice: 2
        MCSkillVehicles: 4
        MCSkillLeadership: 3
        MCSkillSmartGun: -4
        MCSkillFirearms: 1
        MCSkillFireman: 1
    - type: SquadArmorWearer
    - type: JobPrefix
      prefix: mc-job-prefix-cse
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: cse
    - type: MCASRSCost
      cost: 150

- type: playTimeTracker
  id: MCCSE
  isHumanoid: true

- type: startingGear
  id: MCCSE
  equipment:
    id: MCIdCardCSE

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointCSE
  name: squad corpsman spawn point
  components:
  - type: SpawnPoint
    job_id: MCCSE
  - type: Sprite
    state: cse
