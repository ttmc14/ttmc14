- type: job
  parent: MCJob
  id: MCFC
  name: mc-job-name-fc
  description: mc-job-description-fc
  playTimeTracker: MCFC
  startingGear: MCFC
  dummyStartingGear: MCFC
  icon: MCFC
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-captain
  accessGroups: [ MCFC ]
  ranks:
    MCLieutenant: []
    MCMajor:
    - !type:RoleTimeRequirement
      role: MCFC
      time: 1500 # 25 hours
    MCLieutenantColonel:
    - !type:RoleTimeRequirement
      role: MCFC
      time: 6000 # 100 hours
    MCColonel:
    - !type:RoleTimeRequirement
      role: MCFC
      time: 18000 # 300 hours
    MCGeneral:
    - !type:RoleTimeRequirement
      role: MCFC
      time: 60000 # 1000 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: CMVendorUser
      points: 45
    - type: CommandAccent
    - type: MCSendOrders
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: Skills
      skills:
        MCSkillEngineer: 3
        MCSkillConstruction: 2
        MCSkillMedical: 2
        MCSkillSurgery: 1
        MCSkillPolice: 2
        MCSkillPowerLoader: 2
        MCSkillLeadership: 4
        MCSkillCqc: 1
        MCSkillJtac: 2
        MCSkillSmartGun: 0
        MCSkillFirearms: 1
        MCSkillFireman: 1
    - type: JobPrefix
      prefix: mc-job-prefix-fc
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: fieldcommander
    - type: MCASRSCost
      cost: 1000

- type: playTimeTracker
  id: MCFC
  isHumanoid: true

- type: startingGear
  id: MCFC
  equipment:
    id: MCDogtagFC
    shoes: MCBootsBlackFilled
    jumpsuit: MCJumpsuitMarineFieldCommander
    back: MCSatchelMarineStandard
    belt: MCHolsterOfficerValiRapierFull
    ears: MCHeadsetCommand

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointFC
  name: field commander spawn point
  components:
  - type: SpawnPoint
    job_id: MCFC
  - type: Sprite
    state: fc
