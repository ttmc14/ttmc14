- type: job
  parent: MCJob
  id: MCCaptain
  name: mc-job-name-captain
  description: mc-job-description-captain
  playTimeTracker: MCCaptain
  startingGear: MCCaptain
  dummyStartingGear: MCCaptain
  icon: MCCaptain
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-sl
  accessGroups: [ MCCaptain ]
  ranks:
    MCCaptain: []
    MCCommodore:
    - !type:RoleTimeRequirement
      role: MCCaptain
      time: 600 # 10 hours
    MCRearAdmiral:
    - !type:RoleTimeRequirement
      role: MCCaptain
      time: 1500 # 25 hours
    MCViceAdmiral:
    - !type:RoleTimeRequirement
      role: MCCaptain
      time: 6000 # 100 hours
    MCAdmiral:
    - !type:RoleTimeRequirement
      role: MCCaptain
      time: 18000 # 300 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: CommandAccent
    - type: MCSendOrders
    - type: Skills
      skills:
        MCSkillEngineer: 3
        MCSkillCqc: 1
        MCSkillConstruction: 3
        MCSkillMedical: 3
        MCSkillSurgery: 1
        MCSkillPolice: 2
        MCSkillPowerLoader: 4
        MCSkillLeadership: 4
        MCSkillJtac: 2
        MCSkillSmartGun: 0
        MCSkillFirearms: 2
        MCSkillFireman: 1
    - type: CMVendorUser
      points: 100
    - type: JobPrefix
      prefix: mc-job-prefix-captain
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: captain
    - type: MCASRSCost
      cost: 1000

- type: playTimeTracker
  id: MCCaptain
  isHumanoid: true

- type: startingGear
  id: MCCaptain
  equipment:
    id: MCIdCardCaptain
    shoes: MCBootsBlackFilled
    jumpsuit: MCJumpsuitMarineCaptain
    belt: MCHolsterOfficerValiRapierFull
    ears: MCHeadsetCommand

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointCaptain
  name: captain spawn point
  components:
  - type: SpawnPoint
    job_id: MCCaptain
  - type: Sprite
    state: cap
