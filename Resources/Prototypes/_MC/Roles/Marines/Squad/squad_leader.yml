- type: job
  parent: MCJobSquad
  id: MCSquadLeader
  name: mc-job-name-squad-leader
  description: mc-job-description-squad-leader
  playTimeTracker: MCSquadLeader
  startingGear: MCSquadLeader
  dummyStartingGear: MCSquadLeader
  icon: MCSquadLeader
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-co
  accessGroups: [ MCSquadLeader ]
  ranks:
    MCSergeantFirstClass: []
    MCGunnerySergeant:
    - !type:RoleTimeRequirement
      role: MCSquadLeader
      time: 600 # 25 hours
    MCFirstSergeant:
    - !type:RoleTimeRequirement
      role: MCSquadLeader
      time: 6000 # 100 hours
    MCMasterGunnerySergeant:
    - !type:RoleTimeRequirement
      role: MCSquadLeader
      time: 18000 # 300 hours
    MCCommandSergeantMajor:
    - !type:RoleTimeRequirement
      role: MCSquadLeader
      time: 60000 # 1000 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: CMVendorUser
      points: 45
    - type: Skills
      skills:
        MCSkillEngineer: 2
        MCSkillConstruction: 2
        MCSkillCqc: 1
        MCSkillLeadership: 3
        MCSkillMedical: 1
        MCSkillSurgery: 1
        MCSkillSmartGun: 0
        MCSkillFirearms: 1
        MCSkillJtac: 1
        MCSkillFireman: 1
    - type: SquadArmorWearer
    - type: MCSendOrders
    - type: JobPrefix
      prefix: mc-job-prefix-squad-leader
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/squad_marine_icons.rsi
        state: leader
    - type: MCASRSCost
      cost: 100

- type: playTimeTracker
  id: MCSquadLeader
  isHumanoid: true

- type: startingGear
  id: MCSquadLeader
  equipment:
    id: MCDogtagSquadLeader
    back: MCSatchelMarineStandard

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointSquadLeader
  name: squad leader spawn point
  components:
  - type: SpawnPoint
    job_id: MCSquadLeader
  - type: Sprite
    state: sl

- type: entity
  parent: MCSpawnPointSquadLeader
  id: MCSpawnPointSquadLeaderAlpha
  suffix: Alpha
  components:
  - type: SquadSpawner
    squad: SquadAlpha
    role: MCSquadLeader

- type: entity
  parent: MCSpawnPointSquadLeader
  id: MCSpawnPointSquadLeaderBravo
  suffix: Bravo
  components:
  - type: SquadSpawner
    squad: SquadBravo
    role: MCSquadLeader

- type: entity
  parent: MCSpawnPointSquadLeader
  id: MCSpawnPointSquadLeaderCharlie
  suffix: Charlie
  components:
  - type: SquadSpawner
    squad: SquadCharlie
    role: MCSquadLeader

- type: entity
  parent: MCSpawnPointSquadLeader
  id: MCSpawnPointSquadLeaderDelta
  suffix: Delta
  components:
  - type: SquadSpawner
    squad: SquadDelta
    role: MCSquadLeader
