- type: job
  parent: MCJob
  id: MCCMO
  name: mc-job-name-cmo
  description: mc-job-description-cmo
  playTimeTracker: MCCMO
  startingGear: MCCMO
  dummyStartingGear: MCCMO
  icon: MCCMO
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-sl
  accessGroups: [ MCCMO ]
  ranks:
    MCSeniorPhysician: []
    MCMHeadPhysician:
    - !type:RoleTimeRequirement
      role: MCCMO
      time: 600 # 10 hours
    MCMedicalSupervisor:
    - !type:RoleTimeRequirement
      role: MCCMO
      time: 1500 # 25 hours
    MCMedicalDirector:
    - !type:RoleTimeRequirement
      role: MCCMO
      time: 6000 # 100 hours
    MCChiefMedicalOfficer:
    - !type:RoleTimeRequirement
      role: MCCMO
      time: 18000 # 300 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: MarineOrders
      skill: MCSkillLeadership
    - type: CMVendorUser
      points: 75
    - type: Skills
      skills:
        MCSkillCqc: -1
        MCSkillMeleeWeapons: -1
        MCSkillMedical: 5
        MCSkillSurgery: 5
        MCSkillPolice: 2
        MCSkillLeadership: 2
        MCSkillSmartGun: -4
        MCSkillFirearms: 0
        MCSkillFireman: 1
    - type: JobPrefix
      prefix: mc-job-prefix-cmo
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: chief_medical
    - type: MCASRSCost
      cost: 150

- type: playTimeTracker
  id: MCCMO
  isHumanoid: true

- type: startingGear
  id: MCCMO
  equipment:
    id: MCIdCardCMO
    head: CMHeadCapCMO
    gloves: MCClothingHandsLatex
    ears: MCHeadsetCommand
    back: MCSatchelMarineStandard
    eyes: MCGlassesHudHealth
    shoes: MCShoesWhite
    mask: MCMaskSterile
    jumpsuit: MCJumpsuitMedicalScrubsBlue
    outerClothing: MCLabcoatCMOOpened
    belt: MCBeltMedicalFilledMedical
    pocket1: MCPouchMedkitFilled
    pocket2: MCPouchSurgeryFilled
  inhand:
  - MCMedicalTweezers
  - MCBottleLemolineDoctor

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointCMO
  name: cmo spawn point
  components:
  - type: SpawnPoint
    job_id: MCCMO
  - type: Sprite
    state: cmo
