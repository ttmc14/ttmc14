- type: job
  parent: MCJob
  id: MCResearcher
  name: mc-job-name-researcher
  description: mc-job-description-researcher
  playTimeTracker: MCResearcher
  startingGear: MCResearcher
  dummyStartingGear: MCResearcher
  icon: MCResearcher
  joinNotifyCrew: false
  supervisors: mc-job-supervisors-captain
  accessGroups: [ MCResearcher ]
  ranks:
    MCResearchAssistant: []
    MCResearcher:
    - !type:RoleTimeRequirement
      role: MCResearcher
      time: 1500 # 25 hours
    MCLecturer:
    - !type:RoleTimeRequirement
      role: MCResearcher
      time: 1500 # 25 hours
    MCAssociateProfessor:
    - !type:RoleTimeRequirement
      role: MCResearcher
      time: 6000 # 100 hours
    MCProfessor:
    - !type:RoleTimeRequirement
      role: MCResearcher
      time: 18000 # 300 hours
  roleWeight: 1
  special:
  - !type:AddComponentSpecial
    components:
    - type: CMVendorUser
      points: 45
    - type: Skills
      skills:
        MCSkillCqc: -1
        MCSkillMeleeWeapons: -1
        MCSkillMedical: 4
        MCSkillSurgery: 3
        MCSkillSmartGun: -4
        MCSkillFireman: 1
    - type: JobPrefix
      prefix: mc-job-prefix-researcher
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_MC/Interface/job_icons.rsi
        state: researcher
    - type: MCASRSCost
      cost: 150

- type: playTimeTracker
  id: MCResearcher
  isHumanoid: true

- type: startingGear
  id: MCResearcher
  equipment:
    id: MCIdCardResearcher
    gloves: MCClothingHandsLatex
    ears: MCHeadsetResearch
    back: MCSatchelMarineStandard
    eyes: MCGlassesHudHealth
    shoes: MCLaceup
    mask: MCMaskSterile
    jumpsuit: MCJumpsuitMarineResearcher
    outerClothing: MCLabcoatResearcherVest
    belt: MCBeltMedicalFilledResearcher
    pocket1: MCPouchMedkitFilled
    pocket2: MCPouchSurgeryFilled
  inhand:
  - MCMedicalTweezers
  - MCBottleLemolineDoctor

- type: entity
  parent: MCSpawnPointJob
  id: MCSpawnPointResearcher
  name: researcher spawn point
  components:
  - type: SpawnPoint
    job_id: MCResearcher
  - type: Sprite
    state: research
