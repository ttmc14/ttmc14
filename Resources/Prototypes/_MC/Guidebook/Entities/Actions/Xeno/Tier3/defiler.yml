- type: entity
  parent: MCGuidebookActionXeno
  id: MCGuidebookActionXenoSelectReagent
  name: Select Reagent
  description: Selects which reagent to use for reagent slash and noxious gas. Hemodile slows targets down, multiplied by each other xeno-based toxin. Transvitox converts burns to toxin, and causes additional toxin damage when they take brute damage, both effects multiplied by other xeno-based toxins. Ozelomelyn purges all medicines from their system rapidly and causes minor toxin damage. Acid is transparent but causes major burn damage.
  components:
  - type: Sprite
    sprite: _MC/Interface/Xeno/toxins.rsi
    state: icon

- type: entity
  parent: MCGuidebookActionXenoSelectReagent
  id: MCGuidebookActionXenoSelectReagentAcid
  name: ""
  components:
  - type: Sprite
    state: acid

- type: entity
  parent: MCGuidebookActionXenoSelectReagentAcid
  id: MCGuidebookActionXenoSelectReagentHemodile
  name: ""
  components:
  - type: Sprite
    state: hemodile

- type: entity
  parent: MCGuidebookActionXenoSelectReagentAcid
  id: MCGuidebookActionXenoSelectReagentNeurotoxin
  name: ""
  components:
  - type: Sprite
    state: neurotoxin

- type: entity
  parent: MCGuidebookActionXenoSelectReagentAcid
  id: MCGuidebookActionXenoSelectReagentOzelomelyn
  name: ""
  components:
  - type: Sprite
    state: ozelomelyn

- type: entity
  parent: MCGuidebookActionXenoSelectReagentAcid
  id: MCGuidebookActionXenoSelectReagentSanguinal
  name: ""
  components:
  - type: Sprite
    state: sanguinal

- type: entity
  parent: MCGuidebookActionXenoSelectReagentAcid
  id: MCGuidebookActionXenoSelectReagentTransvitox
  name: ""
  components:
  - type: Sprite
    state: transvitox

- type: entity
  parent: MCGuidebookActionXeno
  id: MCGuidebookActionXenoReagentSlash
  name: Reagent Slash (100)
  description: For a short duration the next 3 slashes made will inject a small amount of selected toxin.
  components:
  - type: Sprite
    sprite: _MC/Interface/Actions/Xeno/defiler.rsi
    state: reagent_slash

- type: entity
  parent: MCGuidebookActionXeno
  id: MCGuidebookActionXenoEmitNeurogas
  name: Emit Noxious Gas (200)
  description: Channel for 3 seconds to emit a cloud of noxious smoke, based on selected reagent, that follows the Defiler. You must remain stationary while channeling; moving will cancel the ability but will still cost plasma.
  components:
  - type: Sprite
    sprite: _MC/Interface/Actions/Xeno/defiler.rsi
    state: emit_neurogas

- type: entity
  parent: MCGuidebookActionXeno
  id: MCGuidebookActionXenoDefile
  name: Defile (100)
  description: Channel to inject an adjacent target with an accelerant that violently reacts with xeno toxins, releasing gas and dealing heavy tox damage in proportion to the amount in their system.
  components:
  - type: Sprite
    sprite: _MC/Interface/Actions/Xeno/defiler.rsi
    state: defiler_sting
