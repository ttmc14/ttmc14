- type: entity
  parent: ClothingMaskPullableBase
  id: MCBaseMask
  abstract: true
  components:
  - type: HideLayerClothing
    layers:
      Snout: Mask
    hideOnToggle: true

- type: entity
  parent: MCBaseMask
  id: MCMaskSterile
  name: sterile mask
  description: A sterile mask designed to help prevent the spread of diseases.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Mask/sterile.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Mask/sterile.rsi
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - SterileMask
    - MCSterileMask

- type: Tag
  id: MCSterileMask

- type: entity
  parent: MCBaseMask
  id: MCRebreather
  name: Rebreather
  description: A face-covering mask that can be connected to an air supply. Filters harmful gases from the air.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Masks/rebreather.rsi
    layers:
    - state: base
  - type: Clothing
    sprite: _MC/Clothing/Masks/rebreather.rsi
    slots:
    - Mask
    - Suitstorage
  - type: Item
    size: Small
  - type: Tag
    tags:
    - MCGasmask

- type: Tag
  id: MCRebreather

