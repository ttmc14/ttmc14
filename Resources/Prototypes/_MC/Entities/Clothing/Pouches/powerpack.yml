- type: entity
  parent: MCPouchBase
  id: MCPouchPowerpack
  name: te powerpack
  description: A recently developed mass produced side pouch which charges any TE technological achievement.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _MC/Clothing/Pouches/powerpack.rsi
    layers:
    - state: base
    - state: o4
      map: [ "power" ]
      shader: unshaded
  - type: MCBattery
    charge: 24000
    maxCharge: 24000
  - type: MCBatteryVisuals
    prefix: o
    levels: 4
  - type: MCPowerpack

- type: entity
  parent: MCPouchPowerpack
  id: MCPouchPowerpackEmpty
  suffix: Empty
  components:
  - type: MCBattery
    charge: 0
