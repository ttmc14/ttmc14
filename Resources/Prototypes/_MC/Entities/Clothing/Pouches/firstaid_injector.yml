- type: entity
  parent:
  - MCPouchStorage
  - MCPouchVisualizerOpen
  id: MCPouchMedicalInjector
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector.rsi
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,13,3 # 14 slots
    whitelist:
      tags:
      - MCAutoInjector
  - type: FixedItemSizeStorage

- type: entity
  parent: MCPouchStorage
  id: MCPouchMedicalInjectorICC
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors. This one looks to be made out of a synthetic tan fabric.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector_icc.rsi
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,13,3 # 14 slots
    whitelist:
      tags:
      - MCAutoInjector
  - type: FixedItemSizeStorage

- type: entity
  parent: MCPouchMedicalInjectorICC
  id: MCPouchMedicalInjectorSOM
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors. This one looks to be made out of traditional SOM leather.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector_som.rsi

- type: entity
  parent: MCPouchMedicalInjector
  id: MCPouchMedicalInjectorBaseFull
  suffix: First aid, Full
  components:
  - type: StorageFill
    contents:
    - id: MCAutoInjectorBicaridine
      amount: 3
    - id: MCAutoInjectorKelotane
      amount: 3
    - id: MCAutoInjectorTramadol
      amount: 2
    - id: MCAutoInjectorTricordrazine
      amount: 2
    - id: MCAutoInjectorDylovene
      amount: 1
    - id: MCAutoInjectorInaprovaline
      amount: 1
    - id: MCAutoInjectorSynaptizine
      amount: 1
    - id: MCAutoInjectorRussianRed
      amount: 1

- type: entity
  parent: MCPouchMedicalInjector
  id: MCPouchMedicalInjectorMedicFull
  suffix: Medic, Full
  components:
  - type: StorageFill
    contents:
    - id: MCAutoInjectorCombatAdv
      amount: 8
    - id: MCAutoInjectorDexalinPlus
      amount: 2
    - id: MCAutoInjectorQuickClot
      amount: 2
    # TODO: replace with peridaxon
    - id: MCAutoInjectorSynaptizine
      amount: 2
