- type: entity
  parent: MCPouchStorage
  id: MCPouchShotgunShell
  name: shotgun shell pouch
  description: A pouch specialized for holding shotgun ammo.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/shotshells.rsi
    layers:
    - state: open
    - state: open_1
      visible: false
    - state: open_2
      visible: false
    - state: open_3
      visible: false
    - state: base
      visible: false
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,1 # 5 slots
    whitelist:
      tags:
      - MCHandful
  - type: FixedItemSizeStorage
  - type: ItemMapper
    mapLayers:
      open_1:
        minCount: 1
        whitelist:
          tags:
          - MCHandful
      open_2:
        minCount: 2
        whitelist:
          tags:
          - MCHandful
      open_3:
        minCount: 4
        whitelist:
          tags:
          - MCHandful
      base:
        minCount: 5
        whitelist:
          tags:
          - MCHandful
