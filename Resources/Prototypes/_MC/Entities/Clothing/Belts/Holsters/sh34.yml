- type: entity
  parent:
  - MCClothingBelt
  - RMCScabbardBase
  id: MCClothingBeltSH34
  name: M276 pattern SH-34 shotgun holster rig
  description: A purpose built belt-holster assembly that holds a SH-34 shotgun and one shell box or 2 handfuls.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Belt/Holsters/sh34.rsi
  - type: Clothing
    sprite: _MC/Clothing/Belt/Holsters/sh34.rsi
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,9,3 # 10 slots
    whitelist:
      tags:
      - MCHandful
  - type: FixedItemSizeStorage
  - type: ItemSlots
    slots:
      item:
        name: Weapon
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        whitelist:
          tags:
          - MCWeaponShotgunSH34
  - type: ItemMapper
    mapLayers:
      icon-full:
        whitelist:
          tags:
          - MCWeaponShotgunSH34
  - type: CMHolster
  - type: RMCMagneticItemReceiver

- type: entity
  parent: MCClothingBeltSH34
  id: MCClothingBeltSH34Filled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      item:
        name: Weapon
        startingItem: MCWeaponShotgunSH34
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/gun_rifle_draw.ogg
        whitelist:
          tags:
          - MCWeaponShotgunSH34
  - type: StorageFill
    contents:
    - id: MCCartridgeShotgunBuckshot
      amount: 10
