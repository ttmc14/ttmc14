- type: entity
  parent: MCClothingBelt
  id: MCClothingBeltSH34
  name: M276 pattern SH-34 shotgun holster rig
  description: A purpose built belt-holster assembly that holds a SH-34 shotgun and one shell box or 2 handfuls.
  components:
  - type: Tag
    tags:
    - MCClothingBeltSH34
  - type: Sprite
    sprite: _MC/Clothing/Belt/Holsters/sh34.rsi
    layers:
    - state: icon
    - state: icon-full
      map: [ "enum.CMHolsterLayers.Fill" ]
  - type: Clothing
    sprite: _MC/Clothing/Belt/Holsters/sh34.rsi
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,5,1 # 3 slots
    whitelist:
      tags:
      - MCWeaponShotgunSH34
      - MCHandful
      - MCBoxShotgunShells
  - type: FixedItemSizeStorage
  - type: LimitedStorage
    limits:
    - popup: mc-storage-limit-one-gun
      whitelist:
        tags:
        - MCWeaponShotgunSH34
    - popup: mc-storage-limit-max-ammo
      count: 2
      whitelist:
        tags:
        - MCHandful
        - MCBoxShotgunShells
  - type: CMHolster
    whitelist:
      tags:
      - MCWeaponShotgunSH34
  - type: RMCMagneticItemReceiver

- type: Tag
  id: MCClothingBeltSH34

- type: entity
  parent: MCClothingBeltSH34
  id: MCClothingBeltSH34Filled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: MCWeaponShotgunSH34
    - id: MCBoxShotgunBuckshot
    - id: MCBoxShotgunBuckshot
