- type: entity
  parent: MCWallInvincibleBase
  id: MCWallInvincible
  suffix: Invincible
  name: Heavy Reinforced Wall
  description: A huge chunk of reinforced metal used to seperate rooms.
  components:
  - type: Sprite
    sprite: _MC/Structures/Walls/reinforced.rsi
    state: rwall-0
  - type: Icon
    sprite: _MC/Structures/Walls/reinforced.rsi
    state: wall-invincible
  - type: IconSmooth
    key: mcWalls
    base: rwall-
    mode: MCCardinalFlagsExtended
  - type: Appearance
  - type: Bullethole
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: MCWall
  id: MCWallReinforced
  Suffix: Reinforced
  components:
  - type: Sprite
    sprite: _MC/Structures/Walls/reinforced.rsi
    state: wall-reinforced
  - type: Icon
    sprite: _MC/Structures/Walls/reinforced.rsi
    state: wall-reinforced
  - type: ReceiverXenoClaws
    maxHealth: 3000
  - type: IconSmooth
    key: mcWalls
    additionalKeys:
    - windows
    - doors
    base: rwall-
    mode: MCCardinalFlagsExtended
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: mcgirder
        - !type:DoActsBehavior
          acts: ["Breakage"]
  - type: Construction
    graph: MCGirder
    node: mcreinforcedWall

- type: entity
  parent: MCWall
  name: Wall
  id: MCWallRegular
  suffix: Regular
  components:
  - type: Sprite
    sprite: _MC/Structures/Walls/regular.rsi
    state: metal-0
  - type: Icon
    sprite: _MC/Structures/Walls/regular.rsi
    state: metal-0
  - type: IconSmooth
    key: mcWalls
    additionalKeys:
    - windows
    - doors
    base: metal-
    mode: MCCardinalFlagsExtended
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: mcgirder
        - !type:DoActsBehavior
          acts: ["Breakage"]
  - type: Construction
    graph: MCGirder
    node: mcwall

- type: entity
  parent: CMWindowWhiteColonyReinforced
  id: MCWindow
  components:
  - type: IconSmooth
    key: mcWalls

- type: entity
  parent: RMCWindowHangar
  id: MCWindowReinforced
  components:
  - type: IconSmooth
    key: mcWalls
