- type: entity
  parent: MCStructure
  id: MCNuclearBomb
  name: nuclear fission explosive
  description: You probably shouldn't stick around to see if this is armed.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/nuclear_bomb.rsi
    layers:
    - state: base
      map: ["display"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MCNukeVisuals.State:
        display:
          base: { state: base }
          'off': { state: off }
          'on': { state: on }
          explode: { state: explode }
  - type: Damageable
    damageContainer: Inorganic
  - type: Godmode
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: MCNuke
  - type: Explosive
    explosionType: MC
    totalIntensity: 100000
    intensitySlope: 5
    maxIntensity: 100
  # UI
  - type: ActivatableUI
    blockSpectators: true
    key: enum.MCNukeUi.Key
  - type: UserInterface
    interfaces:
      enum.MCNukeUi.Key:
        type: MCNukeBui
  - type: ItemSlots
    slots:
      disk_red:
        name: mc-nuke-disk-red
        whitelist:
          tags:
          - MCDiskNukeRed
      disk_blue:
        name: mc-nuke-disk-blue
        whitelist:
          tags:
          - MCDiskNukeBlue
      disk_green:
        name: mc-nuke-disk-green
        whitelist:
          tags:
          - MCDiskNukeGreen
  - type: ContainerContainer
    containers:
      disk_red: !type:ContainerSlot
      disk_blue: !type:ContainerSlot
      disk_green: !type:ContainerSlot
  - type: MarineMapTracked
  - type: XenoMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/nuke.rsi
      state: nuke_off
  - type: MCTacticalMapIconSwitcher
    icons:
      on:
        sprite: /Textures/_MC/Interface/MapIcons/nuke.rsi
        state: nuke_on
  - type: WarpPoint
    location: Nuke

- type: entity
  parent: MCNuclearBomb
  id: MCNuclearBombFilled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      disk_red:
        name: mc-nuke-disk-red
        startingItem: MCDiskNukeRed
        whitelist:
          tags:
          - MCDiskNukeRed
      disk_blue:
        name: mc-nuke-disk-blue
        startingItem: MCDiskNukeBlue
        whitelist:
          tags:
          - MCDiskNukeBlue
      disk_green:
        name: mc-nuke-disk-green
        startingItem: MCDiskNukeGreen
        whitelist:
          tags:
          - MCDiskNukeGreen
