- type: entity
  parent: MCMachineVending
  id: MCMachineVendingNexusMarine
  name: NEXUS automated marine's equipment rack
  description: An automated equipment rack hooked up to a colossal storage of basic cat-herding devices.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/vending.rsi
    layers:
    - state: squadleader-off
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: squadleader-deny
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: CMAutomatedVendor
    jobs: [ MCSquadMarine ]
    sections:
    - name: mc-section-nexus-implanter
      entries:
      - id: MCImplantSkillMeleeSimple
        points: 25
        name: mc-section-nexus-implanter-melee-only-one
      - id: MCImplantSkillMedical
        points: 20
        recommended: true
      - id: MCImplantSkillEngineering
        points: 20
        recommended: true
    - name: mc-section-nexus-auto-injectors
      entries:
      - id: MCAutoInjectorCombatAdv
        points: 5
        recommended: true
      - id: MCAutoInjectorSynaptizine
        points: 5
    - name: mc-section-nexus-ammo
      entries:
      - id: MCMagazineRifleAR12AP
        points: 4
      - id: MCMagazineSR127Flak
        points: 4
    - name: mc-section-nexus-grenades
      entries:
      - id: MCGrenadeHedp
        points: 2
        recommended: true
      - id: MCGrenadeHidp
        points: 2
        recommended: true
      - id: MCGrenadePGas
        points: 2
        recommended: true
    - name: mc-section-nexus-vehicles
      entries:
      - id: MCVehicleRiddenMotorbike
        points: 30
      - id: MCReagentContainerJerrycan
        points: 15

- type: entity
  id: MCVendorBundleEssentialMarine
  name: Essential Marine Set
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _MC/Objects/Medical/firstaids.rsi
    state: advfirstaid
  - type: CMVendorBundle
    bundle: []
