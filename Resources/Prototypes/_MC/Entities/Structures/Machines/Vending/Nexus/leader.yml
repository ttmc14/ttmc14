- type: entity
  parent: MCMachineVending
  id: MCMachineVendingNexusSquadLeader
  name: NEXUS automated squad leader's equipment rack
  description: An automated equipment rack hooked up to a colossal storage of basic cat-herding devices.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/vending.rsi
    layers:
    - state: squadleader-off
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: squadleader-deny
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: CMAutomatedVendor
    jobs: [ MCSquadLeader ]
    sections:
    - name: Essentials
      choices:
        MCEssentials: 1
      entries:
      - id: MCVendorBundleEssentialSquadLeader
    - name: Implanter
      entries:
      - id: MCImplantSkillMelee
        points: 15
      - id: MCImplantSkillMedical
        points: 15
      - id: MCImplantSkillEngineering
        points: 15
      - id: MCImplantSkillLeadership
        points: 20
    - name: RL-160
      entries:
      - id: MCBackpackMarineRL160Full
        name: RL-160 Recoilless rifle kit
        points: 15
      - id: MCRocketShell
        points: 2
      - id: MCRocketShellLight
        points: 2
      - id: MCRocketShellHeat
        points: 2
      - id: MCRocketShellSmoke
        points: 1
      - id: MCRocketShellCloak
        points: 1
      - id: MCRocketShellTanglefoot
        points: 2
    # Injectors
    - name: Auto Injector
      entries:
      - id: MCAutoInjectorCombatAdv
        points: 2
      - id: MCAutoInjectorSynaptizine
        points: 2

- type: entity
  id: MCVendorBundleEssentialSquadLeader
  name: Essential squad leader Set
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _MC/Objects/Items/beacon.rsi
    state: motion_1
  - type: CMVendorBundle
    bundle:
    - RMCExplosivePlastic
    - MCBeaconSupply
    - MCBeaconSupply
    - MCBeaconOrbital
    - MCWhistle
    # /obj/item/compass,
    - MCRangefinder
    # /obj/item/pinpointer,
    - MCGlassesHudHealth
