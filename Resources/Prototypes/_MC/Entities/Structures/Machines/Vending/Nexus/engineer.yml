      # EX-62 Genghis incendiary charge
      # Detonation pack
      - id: RMCExplosivePlastic
        points: 2
      # Large M20 mine box
      # M20 mine box
      # M21 APRDS "Minelayer"
    - name: mc-section-nexus-flamer
