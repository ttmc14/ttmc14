- type: entity
  parent: MCMachineVending
  id: MCMachineVendingNexusEngineer
  name: NEXUS automated engineering equipment rack
  description: An automated equipment rack hooked up to a colossal storage of engineering-related goods.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/vending.rsi
    layers:
    - state: engineer-off
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: engineer-deny
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: CMAutomatedVendor
    jobs: [ MCSquadEngineer ]
    sections:
    - name: mc-section-nexus-essentials
      choices:
        MCEssentials: 1
      entries:
      - id: MCVendorBundleEssentialEngineer
    - name: mc-section-nexus-implanter
      entries:
      - id: MCImplantSkillMeleeSimple
        points: 25
        name: mc-section-nexus-implanter-melee-only-one
      - id: MCImplantSkillMedical
        points: 15
      - id: MCImplantSkillEngineering
        points: 15
        recommended: true
        name: mc-section-nexus-implanter-engineering-only-one
    - name: mc-section-nexus-materials
      entries:
      - id: MCSheetMetal10
        points: 2
        recommended: true
        name: mc-section-nexus-materials-metal-10
      - id: MCSheetPlasteel10
        points: 4
        recommended: true
        name: mc-section-nexus-materials-plasteel-10
      - id: CMSandbagEmpty25
        points: 5
        recommended: true
        name: mc-section-nexus-materials-sandbags-25
      # TL-182 deployable shield 3 points
      # Deployable floodlight 2 points
      - id: MCRazorburnGrenadeLarge
        name: Razorburn Canister
        points: 7
      - id: MCRazorburnGrenade
        name: Razorburn grenade
        points: 3
    - name: mc-section-nexus-engineer-sentries
