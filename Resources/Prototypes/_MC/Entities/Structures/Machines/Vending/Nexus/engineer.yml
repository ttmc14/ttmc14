- type: entity
  parent: MCMachineVending
  id: MCMachineVendingNexusEngineer
  name: NEXUS automated engineering equipment rack
  description: An automated equipment rack hooked up to a colossal storage of engineering-related goods.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/vending.rsi
    layers:
    - state: engineer-off
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: engineer-deny
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: CMAutomatedVendor
    jobs: [ MCSquadEngineer ]
    sections:
    - name: Essentials
      choices:
        MCEssentials: 1
      entries:
      - id: MCVendorBundleEssentialEngineer
    - name: Implanter
      entries:
      - id: MCImplantSkillMelee
        points: 25
    - name: Materials
      entries:
      - id: MCSheetMetal10
        name: Metal x10
        points: 2
        recommended: true
      - id: MCSheetPlasteel10
        name: Plasteel x10
        points: 4
        recommended: true
      - id: CMSandbagEmpty25
        name: sandbags x25
        points: 5
        recommended: true
      # TL-182 deployable shield 3 points
      # Deployable floodlight 2 points
      # Pack of Razorburn grenades 11 points
      - id: MCRazorburnGrenadeLarge
        name: Razorburn Canister
        points: 7
      - id: MCRazorburnGrenade
        name: Razorburn grenade
        points: 3
    - name: Tools
      entries:
      # Plasma cutter
      - id: RMCWelderIndustrial
        points: 5
      # Hand-held cell charger
      # Large recharger powercell
      # Recharger powercell
      - id: RMCWeldingGoggles
        points: 2
      - id: RMCVisorWelding
        points: 2
    - name: Power cells
      entries:
      - id: MCPowerCellHigh
        points: 1
      - id: MCPowerCellSuper
        points: 5
      - id: MCPowerCellHyper
        points: 8
    - name: Explosives
      entries:
      # EX-62 Genghis incendiary charge
      # Detonation pack
      - id: RMCExplosivePlastic
        points: 2
      # Large M20 mine box
      # M20 mine box
      # M21 APRDS "Minelayer"
    - name: Sentries
      entries:
      - id: MCCaseSentryST571
        points: 35
      - id: MCCaseSentrySHT573
        points: 45
      - id: MCCaseSentrySST574
        points: 45
      - id: MCCaseSentrySMT580
        points: 45
      - id: MCCaseSentryFlamer
        points: 45
      - id: RMCTesla
        points: 30
      # Build-A-Sentry Attachment
    - name: Flamer
      entries:
      - id: MCTankFlamerGreen
        points: 4
      - id: MCTankFlamer
        points: 2
      - id: MCBeaconSupply
        points: 5
    - name: Mining
      entries: []
      # Mining well overclock upgrade 5 points
      # Mining well reinforcement upgrade 5 points
      # Mining well automation upgrade 5 points
    - name: Vehicle
      entries: []
      # Iguana Unmanned Vehicle
      # Skink Unmanned Vehicle
    - name: Artillery
      entries:
      - id: MCCrateMortarKit
        points: 45
      - id: MCRangefinder
        points: 2
      # AI remote targeting module
      - id: MCMortarShellHE
        points: 1
      - id: MCMortarShellIncendiary
        points: 1
      - id: MCMortarShellTanglefoot
        points: 1
      - id: MCMortarShellSmoke
        points: 1
      - id: MCMortarShellFlare
        points: 1

