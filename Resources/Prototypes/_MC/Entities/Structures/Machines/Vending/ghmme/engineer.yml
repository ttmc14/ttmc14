- type: entity
  parent: MCMachineVendingGhmme
  id: MCMachineVendingGhmmeEngineer
  name: GHMME Automated Engineer Closet
  description: An automated closet hooked up to a colossal storage unit of standard-issue uniform and armor.
  components:
  - type: CMAutomatedVendor
    jobs: [ MCSquadEngineer ]
    sections:
    - name: Standard Equipment
      choices:
        MCStandardEquipment: 1
      entries:
      - id: MCVendorBundleStandardKitEngineer
      - id: MCVendorBundleEssentialJaegerKitEngineer
    - name: Glasses
      choices:
        MCGlasses: 1
      entries:
      - id: RMCWeldingGoggles
    - name: Backpack
      choices:
        MCBackpack: 1
      entries:
      - id: MCSatchelMarineTechnician
        recommended: true
      - id: MCBackpackMarineTechnician
      # Machete scabbard
      # Welderpack
      # Radio Pack
      # Dispenser
      - id: MCBackMortarFull
      - id: MCBackFlamethrowerFull
    - name: Webbing
      choices:
        MCWebbing: 1
      entries:
      - id: MCWebbingBrownVest
        recommended: true
      - id: MCWebbingBrown
      - id: MCWebbingHolster
    - name: Belt
      choices:
        MCBelt: 1
      entries:
      - id: MCClothingBeltToolsFill
      - id: MCClothingBeltUtility
    - name: Pouches
      choices:
        MCPouch: 2
      entries:
      - id: MCPouchShotgunShell
      - id: MCPouchMagazineLarge
      - id: MCPouchToolsFill
        name: Tool pouch (tools included)
      - id: MCPouchGrenadeFill
        name: Grenade pouch (grenades included)
      - id: MCPouchConstructionFill
        name: Construction pouch (materials included)
      - id: MCPouchPistolMagazineLarge
      - id: MCPouchMedkitSquadBaseFill
        name: Medical pouch (chems included)
      - id: MCPouchMedicalInjectorBaseFull
        name: Auto-injector's medical pouch (chems included)

# Kits
- type: entity
  id: MCVendorBundleStandardKitEngineer
  name: Standard Kit
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _MC/Clothing/Shoes/Boots/black.rsi
    state: icon
  - type: CMVendorBundle
    bundle:
    - MCVendorHeadsetSquadEngineer
    - MCHandsMarineInsulated
    - MCJumpsuitMarineSquadEngineer
    - MCBootsBlackFilled
