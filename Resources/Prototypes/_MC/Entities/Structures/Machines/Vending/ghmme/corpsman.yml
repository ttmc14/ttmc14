- type: entity
  parent: MCMachineVendingGhmme
  id: MCMachineVendingGhmmeCorpsman
  name: GHMME Automated Corpsman Closet
  description: An automated closet hooked up to a colossal storage unit of standard-issue uniform and armor.
  components:
  - type: CMAutomatedVendor
    jobs: [ MCSquadCorpsman ]
    sections:
    # Headset
    - name: Standard Equipment
      choices:
        MCStandardEquipment: 1
      entries:
      - id: MCVendorHeadsetSquadMedicKit
    # Paint
    - name: Paint
      choices:
        MCPaint: 1
      entries:
      - id: MCCustomizationPaint
    # Jumpsuit
    - name: Jumpsuit
      choices:
        MCJumpsuit: 1
      entries:
      - id: MCJumpsuitMarineJaeger
      - id: MCJumpsuitMarineSquadMedic
    # Boots
    - name: Boots
      choices:
        MCBoots: 1
      entries:
      - id: MCBootsBlackFilled
      - id: MCBootsBrownFilled
    # Gloves
    - name: Gloves
      choices:
        MCGloves: 1
      entries:
      - id: MCClothingHandsMarineCombat
      - id: MCClothingHandsMarineCombatBlack
      - id: MCClothingHandsMarineCombatFingerless
      - id: MCClothingHandsLatex
    # Other ...
    - name: Backpack
      choices:
        MCBackpack: 1
      entries:
      - id: MCSatchelMarineCorpsman
        recommended: true
      - id: MCBackpackMarineCorpsman
      # Corspman Backpack
    - name: Webbing
      choices:
        MCWebbing: 1
      entries:
      - id: MCWebbingBrownVest
        recommended: true
      - id: MCWebbingWhiteVest
      - id: MCWebbingBrown
      - id: MCWebbingHolster
    - name: Belt
      choices:
        MCBelt: 1
      entries:
      - id: MCBeltMedicBagFull
      - id: MCBeltMedicalMedFull
      - id: MCBeltMedicalHyposprayCorpsmanFull
    - name: Pouches
      choices:
        MCPouch: 2
      entries:
      - id: MCPouchMedicalInjectorMedicFull
      - id: MCPouchMedkitCorpsmanFill
        name: Medkit pouch
        recommended: true
      - id: MCPouchConstructionFill
        name: Construction pouch (materials included)
