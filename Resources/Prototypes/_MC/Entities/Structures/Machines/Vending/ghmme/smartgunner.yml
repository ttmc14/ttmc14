- type: entity
  parent: MCMachineVendingGhmme
  id: MCMachineVendingGhmmeSmartgunner
  name: GHMME Automated Smartgunner Closet
  description: An automated closet hooked up to a colossal storage unit of standard-issue uniform and armor.
  components:
  - type: CMAutomatedVendor
    jobs: [ MCSquadSmartgunner ]
    sections:
    # Headset
    - name: Standard Equipment
      choices:
        MCStandardEquipment: 1
      entries:
      - id: MCVendorHeadsetSquadKit
    # Paint
    - name: Paint
      choices:
        MCPaint: 1
      entries:
      - id: MCCustomizationPaint
    # Jumpsuit
    - name: Jumpsuit
      choices:
        MCJumpsuit: 1
      entries:
      - id: MCJumpsuitMarineJaeger
      - id: MCJumpsuitMarineSquad
    # Boots
    - name: Boots
      choices:
        MCBoots: 1
      entries:
      - id: MCBootsBlackFilled
      - id: MCBootsBrownFilled
    # Gloves
    - name: Gloves
      choices:
        MCGloves: 1
      entries:
      - id: MCClothingHandsMarineCombat
      - id: MCClothingHandsMarineCombatBlack
      - id: MCClothingHandsMarineCombatFingerless
    # Other ...
    - name: Backpack
      choices:
        MCBackpack: 1
      entries:
      - id: MCBackpackMarineStandard
      - id: MCSatchelMarineStandard
    - name: Webbing
      choices:
        MCWebbing: 1
      entries:
      - id: MCWebbingBlackVest
        recommended: true
      - id: MCWebbingBrown
      - id: MCWebbingHolster
    - name: Belt
      choices:
        MCBelt: 1
      entries:
      - id: MCClothingBeltUtility
    - name: Pouches
      choices:
        MCPouch: 2
      entries:
      - id: MCPouchShotgunShell
      - id: MCPouchMagazineLarge
      - id: MCPouchToolsFill
        name: Tool pouch (tools included)
      - id: MCPouchGrenadeFill
        name: Grenade pouch (grenades included)
      - id: MCPouchConstructionFill
        name: Construction pouch (materials included)
      - id: MCPouchPistolMagazineLarge
      - id: MCPouchMedkitSquadBaseFilled
        name: Medical pouch (chems included)
      - id: MCPouchMedicalInjectorBaseFull
        name: Auto-injector's medical pouch (chems included)
