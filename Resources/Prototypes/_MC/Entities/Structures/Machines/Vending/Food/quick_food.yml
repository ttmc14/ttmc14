      - id: CMDrinkCanBobdaCherry
      - id: CMDrinkCanBobdaLime
      - id: CMDrinkCanBobdaGrape
      - id: CMDrinkCanBobdaBlue
      - id: CMDrinkCanBobdaPeach
      - id: CMDrinkCanBobdaCranberry
      - id: CMDrinkCanBobdaVanilla
