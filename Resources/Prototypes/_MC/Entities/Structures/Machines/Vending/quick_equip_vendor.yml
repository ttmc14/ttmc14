- type: entity
  parent: MCMachineVending
  id: MCMachineVendingQuickEquip
  name: Kwik-E-Quip vendor
  description: An advanced vendor to instantly arm soldiers with specific sets of equipment, allowing for immediate combat deployment. Mutually exclusive with the GHMME.
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/vending.rsi
    layers:
    - state: specialist-off
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: specialist
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: MCVendorQuickEquip
    vendors:
    # Other
    - MCMachineVendingQuickFood
    # Nexus
    # - MCMachineVendingNexusMarine
    - MCMachineVendingNexusCorpsman
    - MCMachineVendingNexusEngineer
    - MCMachineVendingNexusSmartgunner
    - MCMachineVendingNexusLeader
    - MCMachineVendingNexusCommander
    - MCMachineVendingNexusMedical
    # Ghmme
    - MCMachineVendingGhmmeMarine
    - MCMachineVendingGhmmeCorpsman
    - MCMachineVendingGhmmeEngineer
    - MCMachineVendingGhmmeSmartgunner
    - MCMachineVendingGhmmeLeader
    - MCMachineVendingGhmmeCommander
    # Surplus
    - MCMachineVendingSurplusArmor
    - MCMachineVendingSurplusClothing
    # Weapons
    - MCMachineVendingWeapon
    - MCMachineVendingWeaponCrash
    # Engineer
    - MCMachineVendingEngi
    - MCMachineVendingYouTool
    # Medical
    - MCMachineVendingNanotrasenMed
    - MCMachineVendingMarineMed
    - MCMachineVendingMarineMedBlood
  - type: UserInterface
    interfaces:
      enum.MCVendorQuickEquipUI.Key:
        type: MCVendorQuickEquipBui
  - type: ActivatableUI
    key: enum.MCVendorQuickEquipUI.Key
