  id: MCDispenserChemicalAdvanced
  name: advanced chemical dispenser
  description: Creates and dispenses chemicals.
  abstract: true
  components:
  - type: Sprite
    sprite: _MC/Structures/Machines/Science/chem_dispenser_advanced.rsi
    layers:
    - state: base
    - state: screen-on
    snapCardinals: true
  - type: RMCChemicalDispenser
    reagents:
    - MCBicaridine
    - MCKelotane
