- type: entity
  parent: MCBarricade
  id: MCBarricadeMetalFolding
  name: folding metal barricade
  description: A folding metal barricade weaker than the non-folding counterpart. Able to be opened and closed at a moment's notice. Repair with a welder.
  components:
  # Armor
  - type: MCArmor
    soft:
      melee: 0
      bullet: 30
      laser: 30
      energy: 30
      bomb: 0
      bio: 100
      fire: 80
      acid: 40
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: folding_metal
      map: [ "enum.DoorVisualLayers.Base" ]
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: RMCRepairable
    skill: MCSkillEngineer
    heal: 200
    delay: 10
    fuelUsed: 2
  #  repairableDamageLimit: 300 - !!MC-TODO: At TGMC You can heal cades with Metal at 1 hand, and blowtorch at second.!!
  # - type: NailgunRepairable
    # cm13 max_health%: 0.3, 0.45
    # repairMetal: 120
    # repairPlasteel: 180
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 225
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCSheetMetal1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: folding_metal_closed_wire, visible: false }
          WiredClosed: { state: folding_metal_wire, visible: true }
          WiredOpen: { state: folding_metal_closed_wire, visible: true }
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: InteractionOutline
  - type: Door
    openSpriteState: folding_metal_closed
    closedSpriteState: folding_metal
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    # Allow you to close barricades while people are standing on them or multiple are wrenched in the same tile
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Barbed
    thornsDamage:
      types:
        MCBrute: 10
  - type: Construction
    graph: MCBarricadeMetalDoorGraph
    node: mcnodeBarricadeMetalDoor
  - type: InteractedBlacklist
    anchoredOnly: true
    blacklist:
      components:
      - Xeno
  - type: UseDelay
    delay: 0.3
  - type: Climbable
  - type: RMCOpenOnlyWhenUnanchored

- type: entity
  parent: MCBarricadeMetalFolding
  id: MCBarricadeMetalFoldingBarbed
  suffix: barbed
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DoorVisualLayers.Base" ]
      state: folding_metal
    - map: [ "barbWired"]
      state: folding_metal_wire
    - map: [ "acided" ]
  - type: Barbed
    isBarbed: true
