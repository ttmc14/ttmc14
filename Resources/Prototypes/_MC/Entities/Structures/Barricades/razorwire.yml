- type: stack
  id: MCRazorwire
  icon:
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
    state: barbedwire_assembly
  spawn: MCRazorwire
  maxCount: 10

# TODO: Xeno acid smoke x2 damage
- type: entity
  id: MCRazorwire
  name: razorwire obstacle
  description: A bundle of barbed wire supported by metal rods. Used to deny access to areas under (literal) pain of entanglement and injury. A classic fortification since the 1900s.
  suffix: Full (10)
  parent: MCItem
  components:
  # Visuals
  - type: Tag
    tags:
    - Structure
  - type: Icon
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
    state: barbedwire_assembly
  - type: Sprite
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
    layers:
    - map:
      - base
      state: barbedwire_assembly
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MCDeployLayers.Layer:
        base:
          Item:
            state: barbedwire_assembly
          Deployed:
            state: barbedwire_x
  - type: DamageVisuals
    thresholds:
    - 25
    - 50
    - 75
    - 100
    trackAllDamage: true
    damageOverlay:
      sprite: _MC/Structures/Barricades/Razorwire/barbedwire_cracks.rsi
  - type: Construction
    graph: MCRazorwireGraph
    node: razorwire
  # Deployment
  - type: Item
    size: Normal
  - type: MCDeploy
    deployFixture: razorwire
    deployTime: 2.5
    deployedPrototype: MCRazorwire1
    undeployAllowed: false
  # Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      razorwire:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 20
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - BarricadeImpassable
        # - BulletImpassable
        hard: false
  - type: CollisionWake
    enabled: false
  # Durability
  - type: Damageable
    damageContainer: MCStructural
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCRodMetal:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts:
        - Destruction
  # Interaction
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  # Gameplay
  - type: DamageOnAttacked
    damage:
      types:
        MCBrute: 40
  - type: DamageOnCollide #TODO: MC component for charge
    canRehit: true
    paralyze: 2
    damage:
      types:
        MCBrute: 40
    chainDamage:
      types:
        MCBrute: 40
    whitelist:
      components:
      - MCXenoChargeActive # If crusher have toggled charge, he will stunned & damaged - THIS IS "КОСТЫЛЬ"
  - type: MeleeSound
    soundTypes:
      MCBrute:
        path: /Audio/_RMC14/Items/barbed_wire_movement.ogg
  # Fire
  - type: Flammable
    maximumFireStacks: 0.5
    fireSpread: false
    damage:
      types:
        MCBurn: 2.5
  # Armor
  - type: MCArmor
    soft:
      melee: 0
      bullet: 45
      laser: 45
      energy: 45
      bomb: 35
      bio: 100
      fire: 80
      acid: 0
  - type: Stack
    stackType: MCRazorwire
    count: 10

- type: entity
  parent: MCRazorwire
  id: MCRazorwire1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: MCRazorwire
  id: MCRazorwire5
  suffix: 5
  components:
  - type: Stack
    count: 5

- type: entity
  parent: MCRazorwire
  id: MCRazorwire10
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: MCRazorwire1
  id: MCRazorwireDeployed
  suffix: Deployed
  components:
  - type: MCDeploy
    state: Deployed
