# Plasteel Barricade Tree
- type: entity
  parent: MCBarricade
  id: MCBarricadePlasteel
  name: plasteel barricade
  description: A sturdy and easily assembled barricade made of reinforced plasteel plates, the pinnacle of strongpoints. Use a blowtorch to repair.
  components:
  - type: Climbable
  - type: Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/_RMC14/Structures/metalhit.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: plasteel
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: plasteel_wire, visible: false }
          WiredClosed: { state: plasteel_wire, visible: true }
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: RMCRepairable
    heal: 200
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
    repairableDamageLimit: 675
  - type: NailgunRepairable
    repairPlasteel: 400
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCSheetPlasteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 25
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10
  - type: MCArmor
    soft:
      melee: 0
      bullet: 45
      laser: 45
      energy: 45
      bomb: 30
      bio: 100
      fire: 100
      acid: 55
  - type: Construction
    graph: BarricadePlasteelGraph
    node: nodePlasteel
  - type: RMCConstructionUpgradeTarget
    upgrades:
    - MCPlasteelExplosiveUpgrade
    - MCPlasteelBiohazardUpgrade
    - MCPlasteelBruteUpgrade
  - type: Tag
    tags:
    - MCPlasteelBarricade

- type: Tag
  id: MCPlasteelBarricade

# Metal Barricade Upgrades
