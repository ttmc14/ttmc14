      layers:
      - state: plasteel
      - state: burn_upgrade
      - map: [ "acided" ]
    - type: MCArmor
      soft:
        melee: 10
        bullet: 30
        laser: 30
        energy: 30
        bomb: 40
        bio: 100
        fire: 80
        acid: 80
    - type: DamageVisuals
      thresholds: [4, 8, 12]
      damageDivisor: 25
      trackAllDamage: true
      damageOverlay:
        sprite: _RMC14/Structures/Walls/Barricades/burn_barricade_cracks.rsi
