- type: entity
  parent: MCBarricade
  id: MCBarricadeMetal
  name: metal barricade
  description: A sturdy and easily assembled barricade made of metal plates, often used for quick fortifications. Use a blowtorch to repair.
  components:
  # Armor
  - type: MCArmor
    soft:
      melee: 0
      bullet: 30
      laser: 30
      energy: 30
      bomb: 0
      bio: 0
      fire: 80
      acid: 40
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: RMCRepairable
    skill: MCSkillEngineer
    heal: 60
    delay: 10
    fuelUsed: 2
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 375 # TODO: wire bonus separate (+50), also skill bonus (+75)
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCSheetMetal1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [ 4, 8, 12 ]
    damageDivisor: 10
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/metal_barricade_cracks.rsi
  - type: Barbed
    thornsDamage:
      types:
        MCBrute: 15
  - type: Construction
    graph: MCBarricadeMetalGraph
    node: mcnodeMetal
  - type: RMCConstructionUpgradeTarget
    skill: MCSkillConstruction
    upgrades:
    - MCExplosiveUpgrade
    - MCBiohazardUpgrade
    - MCBruteUpgrade
  - type: Tag
    tags:
    - MCMetalBarricade

- type: Tag
  id: MCMetalBarricade

