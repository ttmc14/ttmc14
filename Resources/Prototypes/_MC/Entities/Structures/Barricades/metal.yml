- type: entity
  parent: MCBarricade
  id: MCBarricadeMetal
  name: metal barricade
  description: A sturdy and easily assembled barricade made of metal plates, often used for quick fortifications. Use a blowtorch to repair.
  components:
  # Armor
  - type: MCArmor
    soft:
      melee: 10
      bullet: 30
      laser: 30
      energy: 30
      bomb: 20
      bio: 100
      fire: 80
      acid: 40
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: RMCRepairable
    heal: 60
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
    repairableDamageLimit: 340
  - type: NailgunRepairable
    # cm13 max_health%: 0.3, 0.45
    repairMetal: 135
    repairPlasteel: 200
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [ 4, 8, 12 ]
    damageDivisor: 25
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/metal_barricade_cracks.rsi
  - type: Barbed
    thornsDamage:
      types:
        MCBrute: 10
  - type: Construction
    graph: BarricadeMetalGraph
    node: nodeMetal
  - type: RMCConstructionUpgradeTarget
    upgrades:
    - MCExplosiveUpgrade
    - MCBiohazardUpgrade
    - MCBruteUpgrade
  - type: Tag
    tags:
    - MCMetalBarricade

- type: Tag
  id: MCMetalBarricade

