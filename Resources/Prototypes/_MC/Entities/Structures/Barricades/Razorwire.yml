- type: entity
  abstract: true
  parent: MCItem
  id: MCRazorwirePremade
  name: razorwire
  description: A bundle of barbed wire supported by metal rods. Used to deny access to areas under (literal) pain of entanglement and injury. A classic fortification since the 1900s.
  components:
  - type: MCDeploy
  - type: Item
    size: Normal
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      sentry:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 20
        layer:
        - MidImpassable
        - BulletImpassable
        mask:
        - MidImpassable
        - BulletImpassable
        hard: false
  - type: CollisionWake
    enabled: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Sentries/sentry.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - map: [ "base" ]
      state: handled
  - type: Icon
    sprite: _RMC14/Objects/Weapons/Sentries/sentry.rsi
    state: normal_uac_sentry_handheld
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCBarbedWire1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: RMCRepairable
    heal: 20
    skill: MCSkillConstruction
    delay: 2
    fuelUsed: 2
  - type: GenericVisualizer
    visuals:
      enum.MCDeployLayers.Layer:
        base:
          Item:
            state: barbedwire_assembly
          Deployed:
            state: barbedwire_x
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        MCBurn: 2.5
  - type: DamageOnAttacked
    damage:
      types:
        MCBrute: 20
  - type: MeleeSound
    soundTypes:
      MCBrute:
        path:
          "/Audio/_RMC14/Items/barbed_wire_movement.ogg"

- type: entity
  parent: MCRazorwirePremade
  id: MCRazorwireX
  name: Razorwire Obstacle
  suffix: Handled
  description: A bundle of barbed wire supported by metal rods. Used to deny access to areas under (literal) pain of entanglement and injury. A classic fortification since the 1900s.
  components:
  - type: Icon
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
    state: barbedwire_assembly
  - type: Sprite
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
  - type: MCDeploy
    deployTime: 4
  - type: MCArmor
    soft:
      melee: 0
      bullet: 45
      laser: 45
      energy: 45
      bomb: 75
      bio: 100
      fire: 80
      acid: 0
  - type: DamageVisuals
    thresholds: [ 25, 50, 75, 100 ]
    trackAllDamage: true
    damageOverlay:
      sprite: _MC/Structures/Barricades/Razorwire/barbedwire_Cracks.rsi
      states:
        0: DamageOverlay_0
        25: DamageOverlay_25
        50: DamageOverlay_50
        75: DamageOverlay_75
        100: DamageOverlay_100

