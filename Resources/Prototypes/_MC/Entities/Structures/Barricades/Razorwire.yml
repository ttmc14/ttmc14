# TODO: Xeno acid smoke x2 damage
- type: entity
  parent: MCItem
  id: MCRazorwire
  name: razorwire obstacle
  description: A bundle of barbed wire supported by metal rods. Used to deny access to areas under (literal) pain of entanglement and injury. A classic fortification since the 1900s.
  components:
  # Visuals
  - type: Icon
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
    state: barbedwire_assembly
  - type: Sprite
    sprite: _MC/Structures/Barricades/Razorwire/barbedwire.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MCDeployLayers.Layer:
        base:
          Item:
            state: barbedwire_assembly
          Deployed:
            state: barbedwire_x
  - type: DamageVisuals
    thresholds: [ 25, 50, 75, 100 ]
    trackAllDamage: true
    damageOverlay:
      sprite: _MC/Structures/Barricades/Razorwire/barbedwire_Cracks.rsi
      states:
        0: DamageOverlay_0
        25: DamageOverlay_25
        50: DamageOverlay_50
        75: DamageOverlay_75
        100: DamageOverlay_100
  # Deployment
  - type: Item
    size: Normal
  - type: MCDeploy
    deployTime: 2.5
    deployFixture: razorwire
  # Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      razorwire:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 20
        layer:
        - MidImpassable
        - BulletImpassable
        mask:
        - MidImpassable
        - BulletImpassable
        hard: false
  - type: CollisionWake
    enabled: false
  # Durability
  - type: Damageable
    damageContainer: MCStructural
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCBarbedWire1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Interaction
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  # Gameplay
  - type: DamageOnAttacked
    damage:
      types:
        MCBrute: 40
  - type: MeleeSound
    soundTypes:
      MCBrute:
        path: "/Audio/_RMC14/Items/barbed_wire_movement.ogg"
  # Fire
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        MCBurn: 2.5
  # Armor
  - type: MCArmor
    soft:
      melee: 0
      bullet: 45
      laser: 45
      energy: 45
      bomb: 35
      bio: 100
      fire: 80
      acid: 0

- type: entity
  parent: MCRazorwire
  id: MCRazorwireDeployed
  suffix: Deployed
  components:
  - type: MCDeploy
    state: Deployed
