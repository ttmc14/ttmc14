- type: entity
  parent: MCBarricade
  id: MCBarricadePlasteel
  name: plasteel barricade
  description: A sturdy and easily assembled barricade made of reinforced plasteel plates, the pinnacle of strongpoints. Use a blowtorch to repair.
  components:
  - type: Tag
    tags:
    - MCPlasteelBarricade
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: plasteel
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: plasteel_wire, visible: false }
          WiredClosed: { state: plasteel_wire, visible: true }
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: RMCRepairable
    skill: MCSkillEngineer
    heal: 200
    delay: 10
    fuelUsed: 2
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 550 # TODO: wire bonus separate (+50), also skill bonus (+100)
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MCSheetPlasteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [ 4, 8, 12 ]
    damageDivisor: 25
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
  - type: Barbed
    thornsDamage:
      types:
        Slash: 15
  - type: MCArmor
    soft:
      melee: 0
      bullet: 30
      laser: 30
      energy: 30
      bomb: 0
      bio: 0
      fire: 80
      acid: 50
  - type: Construction
    graph: MCBarricadePlasteelGraph
    node: mcnodePlasteel
  - type: RMCConstructionUpgradeTarget
    skill: MCSkillConstruction
    upgrades:
    - MCPlasteelExplosiveUpgrade
    - MCPlasteelBiohazardUpgrade
    - MCPlasteelBruteUpgrade

- type: Tag
  id: MCPlasteelBarricade

