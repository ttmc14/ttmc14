- type: entity
  parent: MCbarbedwireobstacle
  id: MCRazorwireObstacle
  name: RazorwireObstacle
  description: A bundle of barbed wire supported by metal rods...
  components:
  - type: MCArmor
    soft:
      melee: 40
      bullet: 0
      laser: 0
      energy: 0
      bomb: 0
      bio: 50
      fire: 80
      acid: 80
  - type: Sprite
    sprite: _MC/structures/barricades/barbedwire.rsi
    layers:
    -state: barbedwire_x
    -map: [ "acided" ]
