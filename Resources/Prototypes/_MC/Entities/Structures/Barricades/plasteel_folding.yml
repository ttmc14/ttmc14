- type: entity
  parent: MCBarricade
  id: MCBarricadePlasteelFolding
  name: folding plasteel barricade
  description: A tough folding plasteel barricade stronger than its metal counterpart. Can be closed and opened at a moment's notice. Repair with a welder.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: folding_plasteel
      map: [ "enum.DoorVisualLayers.Base" ]
    - map: [ "acided" ]
    drawdepth: WallTops
  - type: RMCRepairable
    heal: 200
    skill: RMCSkillConstruction
    delay: 10
    fuelUsed: 2
    repairableDamageLimit: 600
  - type: NailgunRepairable
    # cm13 max_health%: 0.3
    repairPlasteel: 240
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetPlasteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: folding_plasteel_closed_wire, visible: false }
          WiredClosed: { state: folding_plasteel_wire, visible: true }
          WiredOpen: { state: folding_plasteel_closed_wire, visible: true }
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: Door
    openSpriteState: folding_plasteel_closed
    closedSpriteState: folding_plasteel
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    # Allow you to close barricades while people are standing on them or multiple are wrenched in the same tile
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Barbed
    thornsDamage:
      types:
        MCBrute: 10
  - type: Construction
    graph: BarricadePlasteelDoorGraph
    node: nodeBarricadePlasteelDoor
  - type: InteractedBlacklist
    anchoredOnly: true
    blacklist:
      components:
      - Xeno

- type: entity
  parent: MCBarricadePlasteelFolding
  id: MCBarricadePlasteelFoldingBarbed
  suffix: barbed
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DoorVisualLayers.Base" ]
      state: folding_plasteel
    - map: [ "barbWired" ]
      state: folding_plasteel_wire
    - map: [ "acided" ]
  - type: Barbed
    isBarbed: true
