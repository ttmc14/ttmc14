- type: entity
  parent: RMCBaseWindowFrame
  id: MCWindowFrameGray
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags
  - type: Construction
    graph: MCWindowGray
    node: windowFrameGray

- type: entity
  parent: CMBaseWindow
  id: MCWindowGray
  name: window
  description: A glass window inside a wall frame.
  components:
  - type: Sprite
    sprite: _MC/Structures/Windows/gwindow.rsi
    state: ship_gray_window-invincible
  - type: Icon
    sprite: _MC/Structures/Windows/gwindow.rsi
    state: ship_gray_window-0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: ship_gray_window-
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              CMShardGlass:
                min: 1
                max: 1
          - !type:ChangeConstructionNodeBehavior
            node: MCWindowGrayReinforced
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: CMShardGlass
    sound:
      collection: WindowShatter
  - type: Construction
    graph: MCWindowGrayReinforced
    node: MCwindowFrameGrayReinforced

- type: entity
  parent: MCWindowGray
  id: MCWindowGrayReinforced
  name: reinforced window
  description: A glass window. Light refracts incorrectly when looking through. It looks rather strong. Might take a few good hits to shatter it.
  components:
  - type: Sprite
    sprite: _MC/Structures/Windows/gwindow.rsi
    state: ship_gray_window-invincible
  - type: Icon
    sprite: _MC/Structures/Windows/gwindow.rsi
    state: ship_gray_window-0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    - mcWalls
    base: ship_gray_window-
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              CMShardGlass:
                min: 1
                max: 1
              CMRodMetal:
                min: 1
                max: 1
          - !type:ChangeConstructionNodeBehavior
            node: MCWindowFrameGrayReinforced
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: MCWindowFrameGray
    sound:
      collection: WindowShatter


- type: entity
  parent: RMCBaseWindowFrame
  id: MCWindowFrameGrayReinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags
  - type: Construction
    graph: MCWindowGrayReinforced
    node: MCwindowFrameGrayReinforced
