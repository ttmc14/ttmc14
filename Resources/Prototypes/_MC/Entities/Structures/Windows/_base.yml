- type: entity
  parent: MCStructure
  id: MCWindowIndestructible
  abstract: true
  components:
  - type: Tag
    tags: [ MCXenoIgnoreBanish ]
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Walls
  - type: PlacementReplacement
    key: walls
  - type: Airtight
  - type: Physics
    bodyType: Static
  - type: InteractionPopup
    interactDelay: 10
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: rmc-window-knock-others
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
      params:
        variation: 0.125
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
        density: 1000
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: RMCMesonsNonviewable

- type: entity
  parent: MCWindowIndestructible
  id: MCWindowIndestructibleSmooth
  abstract: true
  components:
  - type: Sprite
    state: base-0
  - type: Icon
    state: base-0
  - type: IconSmooth
    key: windows
    additionalKeys: [ doors ]
    base: base-
    mode: MCCardinalFlagsExtended

- type: entity
  parent: MCWindowIndestructible
  id: MCWindow
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  abstract: true
  components:
  - type: Tag
    tags: []
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: StructuralMarine
  - type: Corrodible
    isCorrodible: true

- type: entity
  parent: MCWindow
  id: MCWindowSmooth
  abstract: true
  components:
  - type: Sprite
    state: base-0
  - type: Icon
    state: base-0
  - type: IconSmooth
    key: windows
    additionalKeys: [ doors, frames ]
    base: base-
    mode: MCCardinalFlagsExtended

# Frame
- type: entity
  parent: MCStructure
  id: MCWindowFrame
  name: window frame
  description: A big hole in the wall that used to sport a large window. Can be vaulted through.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  abstract: true
  components:
  - type: Tag
    tags:
    - Structure
    - MCWindowFrame
  - type: Transform
    anchored: true
  - type: Sprite
    state: base-0
    drawdepth: Walls
  - type: Icon
    state: base-0
  - type: IconSmooth
    key: frames
    additionalKeys: [ doors, windows ]
    base: base-
    mode: MCCardinalFlagsExtended
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:SpawnEntitiesBehavior
            spawn:
              MCSheetMetal1:
                min: 2
                max: 2
  - type: InteractionOutline
  - type: Clickable
  - type: Climbable
  - type: RMCWallExplosionDeletable
  - type: DestroyedByExplosionType
  - type: DamageMultiplierFlags
    flags: Breaching
  - type: MinimapColor
    color: "#8d2294ad"
  - type: ReceiverXenoClaws
    maxHealth: 600
    hitsToDestroy: 3
  - type: XenoLeapDestroyOnPass
    spawnPrototype: MCSheetMetal1
    amount: 2
  - type: RequireProjectileTarget
  - type: XenoToggleChargingDamage
    stageLoss: 2
    sound: /Audio/_RMC14/Structures/metalhit.ogg
    damage:
      types:
        MCBrute: 80
  - type: XenoCrusherChargable
  - type: RMCMesonsNonviewable
