- type: entity
  parent: MCWindowColonyReinforced
  id: MCWindowCellReinforced
  name: reinforced cell window
  description: A reinforced cell window. The inside is reinforced with a few tempered matrix rods along the base. It looks rather strong. Might take a few good hits to shatter it.
  components:
  - type: Sprite
    sprite: _MC/Structures/Windows/cell_reinforced.rsi
  - type: Icon
    sprite: _MC/Structures/Windows/cell_reinforced.rsi
  - type: Construction
    graph: MCWindowCellReinforced
    node: window
  - type: DestroyOnXenoPierceScissor
    spawnPrototype: MCWindowFrameCellReinforced
    sound:
      collection: WindowShatter

