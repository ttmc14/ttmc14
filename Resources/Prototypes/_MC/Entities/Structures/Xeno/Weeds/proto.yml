    soft:
      melee: 80
      bullet: 0
      laser: 0
      energy: 80
      bomb: 80
      bio: 200
      fire: 200
      acid: 200
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: XenoWeeds
    spawns: MCXenoWeedsProto
