- type: entity
  parent: MCXenoStructure
  id: MCXenoStructureSilo
  name: resin silo
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/silo.rsi
    state: icon
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/structure.rsi
      state: silo
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49" # 3x3
        density: 200
        mask:
        - ItemMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CollisionWake
    enabled: false
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: XenoWeedsSpreading
  - type: XenoWeeds
    range: 3
    spawns: MCXenoWeeds
    healOnStopSpreading:
      types:
        MCBrute: -7.5
        MCBurn: -7.5
  # Pheromones
  - type: MCXenoSilo
  - type: MCXenoStructureSpawner
    mobsPerPlayer: 0.075
    respawnMultiplier: 2
  - type: MCXenoPheromonesPassive
    entries:
    - pheromones: Recovery
      range: 30
      multiplier: 4
    - pheromones: Warding
      range: 30
      multiplier: 4
    - pheromones: Frenzy
      range: 30
      multiplier: 4

