- type: entity
  id: MCXenoStructure
  categories: [ MCContent ]
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Appearance
  # - type: GuideHelp
  #   guides:
  #   - RMCGuideHiveStructures
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageContainer: StructuralXeno
    damageModifierSet: Resin
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: XenoConstruct
  - type: XenoFriendly
  - type: XenoAnnounceStructureDestruction
  - type: RequireProjectileTarget
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        MCBurn: 3.8
  - type: Corrodible
    isCorrodible: false
  - type: CollisionWake
    enabled: false
  - type: MCAIPathfindingIgnore

- type: entity
  parent: MCXenoStructure
  id: MCXenoStructureSilo
  name: resin silo
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/silo.rsi
    state: icon
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/structure.rsi
      state: silo
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49" # 3x3
        density: 200
        mask:
        - ItemMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CollisionWake
    enabled: false
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: XenoWeedsSpreading
  - type: XenoWeeds
    range: 3
    spawns: MCXenoWeeds
    healOnStopSpreading:
      types:
        MCBrute: -7.5
        MCBurn: -7.5
  # Pheromones
  - type: MCXenoSilo
  - type: MCXenoStructureSpawner
    mobsPerPlayer: 0.075
    respawnMultiplier: 2
  - type: MCXenoPheromonesPassive
    entries:
    - pheromones: Recovery
      range: 30
      multiplier: 4
    - pheromones: Warding
      range: 30
      multiplier: 4
    - pheromones: Frenzy
      range: 30
      multiplier: 4

- type: entity
  parent: MCXenoStructure
  id: MCXenoStructureSpawner
  name: spawner
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  suffix: T0
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/spawner.rsi
    state: base
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/structure.rsi
      state: spawner
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49" # 3x3
        density: 200
        mask:
        - ItemMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CollisionWake
    enabled: false
  - type: XenoStructureMapTracked
  - type: MCXenoStructureSpawner
    mobsPerPlayer: 0.15
    respawnMultiplier: 1
  - type: TacticalMapTracked

- type: entity
  parent: MCXenoStructureSpawner
  id: MCXenoStructureSpawnerTier1
  name: spawner
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  suffix: T1
  components:
  - type: MCXenoStructureSpawner
    entry:
    - MCXenoDefenderAI
    - MCXenoDroneAI
    - MCXenoRunnerAI
