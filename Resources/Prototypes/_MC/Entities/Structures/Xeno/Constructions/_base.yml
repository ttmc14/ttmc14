- type: entity
  id: MCXenoStructure
  categories: [ MCContent ]
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Appearance
  # - type: GuideHelp
  #   guides:
  #   - RMCGuideHiveStructures
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageContainer: StructuralXeno
    damageModifierSet: Resin
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: XenoConstruct
  - type: XenoFriendly
  - type: XenoAnnounceStructureDestruction
  - type: RequireProjectileTarget
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        MCBurn: 3.8
  - type: Corrodible
    isCorrodible: false
  - type: CollisionWake
    enabled: false
  - type: MCAIPathfindingIgnore

- type: entity
  parent: MCXenoStructure
  id: MCXenoStructureSpawner
  name: spawner
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  suffix: T0
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/spawner.rsi
    state: base
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/structure.rsi
      state: spawner
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49" # 3x3
        density: 200
        mask:
        - ItemMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CollisionWake
    enabled: false
  - type: XenoStructureMapTracked
  - type: MCXenoStructureSpawner
    mobsPerPlayer: 0.15
    respawnMultiplier: 1
  - type: TacticalMapTracked

- type: entity
  parent: MCXenoStructureSpawner
  id: MCXenoStructureSpawnerTier1
  name: spawner
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  suffix: T1
  components:
  - type: MCXenoStructureSpawner
    entry:
    - MCXenoDefenderAI
    - MCXenoDroneAI
    - MCXenoRunnerAI

- type: entity
  parent: MCXenoStructureSpawner
  id: MCXenoStructureSpawnerUltraT0
  name: spawner
  description: A slimy, oozy resin bed filled with foul-looking egg-like ...things.
  suffix: PVE Ultra T0
  components:
   - type: MCXenoStructureSpawner
     mobsPerPlayer: 2
     respawnMultiplier: 0
