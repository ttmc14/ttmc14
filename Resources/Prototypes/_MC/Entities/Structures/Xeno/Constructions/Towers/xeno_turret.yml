- type: entity
  parent: MCXenoStructure
  id: MCXenoTurretTowerpremade
  name: acid turret
  description: A menacing looking construct of resin, it seems to be alive. It fires acid against intruders.
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    enabled: true
    radius: 1
    energy: 2
    color: "#02b005"
  - type: Clickable
  - type: InteractionOutline
  - type: Actions
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      sentry:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 20
        layer:
        - MidImpassable
        - BulletImpassable
        mask:
        - MidImpassable
        - BulletImpassable
        hard: false
  - type: CollisionWake
    enabled: false
  - type: Appearance
  - type: CombatMode
    toggleMouseRotator: false
  - type: Gun
    fireRate: 0.5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: BallisticAmmoProvider
    proto: MCXenoProjectileMedium
  - type: HTN
    rootTask:
      task: RMCSentryCompound
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
      VisionRadius: !type:Single "7.0"
      AggroVisionRadius: !type:Single "7.0"
  - type: MouseRotator
    angleTolerance: 5
    rotationSpeed: 180
    simple4DirMode: false
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: Damageable
    damageContainer: Inorganic
  - type: MCIntegrity
    thresholds:
      Destruction: 600
  - type: MCIntegrityDestructible
  - type: HealthExaminable
    locPrefix: sentry
    examinableTypes:
    - MCBrute
    - MCBurn
  - type: ShortExamine
  - type: InteractedBlacklist
    blacklist:
      components:
      - Marine
  - type: RequireProjectileTarget
  - type: RMCWeaponAccuracy
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        MCBurn: 2.5

# Acid Turret

- type: entity
  parent: MCXenoTurretTowerpremade
  id: MCXenoTurretTowerAcid
  name: Acid turret
  description: A menacing looking construct of resin, it seems to be alive. It fires acid against intruders.
  components:
   - type: Sprite
     sprite: _MC/Structures/Xeno/turrets.rsi
     state: acid
   - type: Icon
     sprite: _MC/Structures/Xeno/turrets.rsi
     state: acid
   - type: Destructible
     thresholds:
     - trigger: !type:DamageTrigger
         damage: 600
       behaviors:
       - !type:DoActsBehavior
         acts: [ "Destruction" ]

# Sticky Resin Turret

- type: entity
  parent: MCXenoTurretTowerpremade
  id: MCXenoTurretTowerSticky
  name: Sticky resin turret
  description: A menacing looking construct of resin, it seems to be alive. It fires resin against intruders.
  components:
   - type: Sprite
     sprite: _MC/Structures/Xeno/turrets.rsi
     state: resin
   - type: Icon
     sprite: _MC/Structures/Xeno/turrets.rsi
     state: resin
   - type: BallisticAmmoProvider
     proto: MCXenoProjectileStickyResin
   - type: PointLight
     enabled: true
     radius: 1
     energy: 2
     color: "#840080"
   - type: Destructible
     thresholds:
     - trigger: !type:DamageTrigger
         damage: 600
       behaviors:
       - !type:DoActsBehavior
         acts: [ "Destruction" ]

