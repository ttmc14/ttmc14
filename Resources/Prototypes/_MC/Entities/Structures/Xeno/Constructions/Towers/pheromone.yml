- type: entity
  parent: MCXenoStructure
  id: MCXenoPheromoneTower
  name: pheromone tower
  description: A resin formation that looks like a small pillar. A faint, weird smell can be perceived from it.
  abstract: true
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/Towers/pheromone_t1.rsi
    layers:
    - map: [ "base" ]
      state: frenzy
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MCXenoStructurePheromoneTowerLayers.Layer:
        base:
          Recovery: { state: recovery }
          Warding: { state: warding }
          Frenzy: { state: frenzy }
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: XenoPheromones
    pheromones: Frenzy
    pheromonesMultiplier: 5
    pheromonesRange: 32
  - type: XenoPheromonesObject
  - type: XenoActivePheromones
  - type: PointLight
    enabled: true
    radius: 2
    energy: 2
    color: "#ff3b3b"
  - type: XenoStructureMapTracked
  - type: TacticalMapTracked
  - type: MCXenoStructurePheromoneTower
    selected: Frenzy
  - type: UserInterface
    interfaces:
      enum.MCXenoStructurePheromoneTowerSelectUI.Key:
        type: MCXenoStructurePheromoneTowerBui

- type: entity
  parent: MCXenoPheromoneTower
  id: MCXenoPheromoneTowerTier1
  suffix: Tier 1, Frenzy
  components:
  - type: Sprite
    sprite: _MC/Structures/Xeno/Towers/pheromone_t1.rsi
  - type: PointLight
    radius: 2
    energy: 2
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/structure.rsi
      state: tower_pheromone_tier_1

