- type: constructionGraph
  parent: MC
  id: MCWindowCellReinforced
  start: start
  graph:
  - node: start # not currently buildable
  - node: frame
    entity: MCWindowFrameCellReinforced
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MCSheetMetal1
        amount: 2
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored {}
      steps:
      - tool: Anchoring
        doAfter: 2
        duplicateConditions: All
    - to: window
      completed:
      - !type:SnapToGrid
        southRotation: true
      conditions:
      - !type:EntityAnchored {}
      steps:
      - material: MCGlassReinforced
        amount: 2
        doAfter: 2
  - node: window
    entity: MCWindowCellReinforced
    edges:
    - to: frame
      completed:
      - !type:SnapToGrid
        southRotation: true
      - !type:SpawnPrototype
        prototype: MCGlassReinforced1
        amount: 2
      conditions:
      - !type:EntityAnchored {}
      steps:
      - tool: Screwing
      - tool: Prying
      - tool: Screwing

