# Leader
- type: entity
  id: MCVendorHeadsetSquadLeader
  categories: [ HideSpawnMenu ]
  components:
  - type: CMVendorMapToSquad
    map:
      SquadAlpha: MCHeadsetAlphaLeader
      SquadBravo: MCHeadsetBravoLeader
      SquadCharlie: MCHeadsetCharlieLeader
      SquadDelta: MCHeadsetDeltaLeader

- type: entity
  id: MCVendorHeadsetSquadLeaderKit
  name: headset
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _MC/Clothing/radio.rsi
    state: marine_generic
  - type: CMVendorBundle
    bundle:
    - MCVendorHeadsetSquadLeader

