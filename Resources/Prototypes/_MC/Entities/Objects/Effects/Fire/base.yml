- type: entity
  id: MCFirePreMade
  abstract: true
  categories: [ MCContent ]
  components:
  - type: Tag
    tags:
    - MCDamageFir
    - HideContextMenu
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        mask:
        - MobMask
        hard: false
  - type: Sprite
    sprite: _MC/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - map: [ "base" ]
      state: oldred_3
  - type: Clickable
  - type: InteractionOutline
  - type: PointLight
    radius: 5
    color: "#bf6d02"
  - type: EffectVisuals
  - type: RMCIgniteOnCollide
    maxStacks: 20
    tileDamage:
      types:
        MCBurn: 0.5
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        MCBurn: 45
  - type: TileFire
    id: MCFire
    extinguishInstantly: true
    sprayExtinguishMultiplier: 3
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: oldred_1 }
          Two: { state: oldred_2 }
          Three: { state: oldred_3 }
  - type: IgnorePredictionHit
  - type: RMCScorchEffectOnSpawn
    decalTag: burnt
    tileLimit: 3
  - type: BlockWeeds

- type: entity
  parent: MCFirePreMade
  id: MCFire
  name: fire
