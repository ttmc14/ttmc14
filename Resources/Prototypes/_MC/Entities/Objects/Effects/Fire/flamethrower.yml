# SX - Slowing - Slows 66% of xeno speed
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerSX
  suffix: TTMC, SX
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    color: "#a8e3c7"
    layers:
    - map: [ "base" ]
      state: dynamic_4
  - type: PointLight
    color: "#a8ec7"
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        MCBurn: 21
  - type: RMCIgniteOnCollide
    maxStacks: 45
    intensity: 21
    duration: 8
    tileDamage:
      types:
        MCBurn: 0.1
  - type: TileFire
    id: MCFireFlamethrowerSX
    duration: 12
    extinguishInstantly: false
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.333
    sprintSpeedModifier: 0.333
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: dynamic_1 }
          Two: { state: dynamic_2 }
          Three: { state: dynamic_3 }
          Four: { state: dynamic_4 }

# CX - Cluster - Despawn to more tiles
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerCX
  suffix: TTMC, CX
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    color: "#faa048"
    layers:
    - map: [ "base" ]
      state: dynamic_4
  - type: PointLight
    color: "#faa048"
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        MCBurn: 38
  - type: RMCIgniteOnCollide
    maxStacks: 10
    intensity: 38
    duration: 1
    tileDamage:
      types:
        MCBurn: 0.35
  - type: TileFire
    id: MCFireFlamethrowerCX
    duration: 1
    extinguishInstantly: false
  - type: TimedDespawn # TTMC - Дабы наверняка
    lifetime: 1
  - type: TriggerOnSpawn
  - type: TileFireOnTrigger
    range: 1
    spawn: MCFireFlamethrowerCXCluster
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: dynamic_4 }
          Two: { state: dynamic_4 }
          Three: { state: dynamic_4 }
          Four: { state: dynamic_4 }

