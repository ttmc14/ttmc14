# Metal

- type: material
  id: MCSteel
  stackEntity: MCSheetMetal
  icon: { sprite: _RMC14/Objects/Materials/Sheets/metal.rsi, state: metal }
  price: 0.05

- type: stack
  id: MCSteel
  icon: { sprite: /Textures/_RMC14/Objects/Materials/Sheets/metal.rsi, state: metal }
  spawn: MCSheetMetal
  maxCount: 50

- type: entity
  abstract: true
  parent: SheetMetalBase
  id: MCSheetMetalBase
  suffix: MC
  components:
    - type: Stack
      count: 50
    - type: Sprite
      sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    - type: Item
      size: Normal
      sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    - type: Appearance

- type: entity
  parent: MCSheetMetalBase
  id: MCSheetMetal
  name: MC-materials-metal
  description: Sheets made out of metal. They have been dubbed Metal Sheets.
  suffix: Filled
  components:
    - type: RMCConstructionItem
      buildable:
      - MCBarbedWireBuild
      - MCMetalBarricadeBuild
      - MCMetalBarricadeFoldingBuild
      - RMCHandrailBuild
      # - RMCDividerConstruction
      # APC frame
      # Fire alarm frame
      - RMCDividerConstruction
      - RMCFloorTileBuild
      - RMCMetalRodBuild
      - RMCWallGirderBuild
      - RMCWindowFrameBuild
      # Airlock assembly
      # large airlock assembly
      - RMCDividerConstruction
      - RMCBedBuild
      - RMCChairBuild
      - RMCComfyChairList
      - RMCSquadChairList
      - RMCOfficeChairList
      # stool
      - RMCDividerConstruction
      # computer frame
      - RMCMachineFrameBuild
      - RMCDividerConstruction
      # metal baseball bat
      - RMCDividerConstruction
    - type: RMCConstructionUpgradeItem
      whitelist:
        tags:
        - MCMetalBarricade # mc-changes
        - RMCPlasteelBarricade
    - type: Material
    - type: PhysicalComposition
      materialComposition:
        MCSteel: 100
    - type: Stack
      count: 50
      stackType: MCSteel
      baseLayer: base
      layerStates:
        - metal
        - metal_2
        - metal_3
        - metal_4
    - type: Sprite
      layers:
        - state: metal_4
          map: ["base"]
    - type: UserInterface
      interfaces:
        enum.RMCConstructionUiKey.Key:
          type: RMCConstructionBui

- type: entity
  parent: MCSheetMetal
  id: MCSheetMetal10
  suffix: "10"
  components:
    - type: Sprite
      state: metal_2
    - type: Stack
      stackType: MCSteel
      count: 10

- type: entity
  parent: MCSheetMetal
  id: MCSheetMetal20
  suffix: "20"
  components:
    - type: Sprite
      state: metal_3
    - type: Stack
      stackType: MCSteel
      count: 20

- type: entity
