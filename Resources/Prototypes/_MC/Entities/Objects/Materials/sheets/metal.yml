- type: stack
  id: MCMetal
  icon:
    sprite: /Textures/_RMC14/Objects/Materials/Sheets/metal.rsi
    state: metal
  spawn: MCSheetMetal
  maxCount: 50

- type: entity
  parent: MCItem
  id: MCSheetMetal
  name: metal
  description: Sheets made out of metal. They have been dubbed Metal Sheets.
  suffix: Full (50)
  components:
  - type: Tag
    tags:
    - Sheet
    - Metal
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    layers:
    - state: metal_4
      map: [ "base" ]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    size: Normal
  - type: RMCConstructionItem
    buildable:
    # Materials
    - MCBarbedWireBuild
    - MCRazorwireBuild
    - MCRodMetalBuild
    # Barricades
    - MCMetalBarricadeBuild
    - MCMetalBarricadeFoldingBuild
    # Structures
    - MCGirderBuild
    - MCWindowFrameBuild
  - type: RMCConstructionUpgradeItem
    whitelist:
      tags:
      - MCMetalBarricade
  - type: Stack
    count: 50
    stackType: MCMetal
    baseLayer: base
    layerStates:
    - metal
    - metal_2
    - metal_3
    - metal_4
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

