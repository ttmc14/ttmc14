  id: MCSheetMetal30
  suffix: "30"
  components:
    - type: Sprite
      state: metal_3
    - type: Stack
      stackType: MCSteel
      count: 30

- type: entity
  parent: MCSheetMetal
  id: MCSheetMetal40
  suffix: "40"
  components:
    - type: Sprite
      state: metal_3
    - type: Stack
      stackType: MCSteel
      count: 40

- type: entity
  parent: MCSheetMetal
  id: MCSheetMetal50
  suffix: "50"
  components:
    - type: Sprite
      state: metal_4
    - type: Stack
      stackType: MCSteel
      count: 50

- type: entity
