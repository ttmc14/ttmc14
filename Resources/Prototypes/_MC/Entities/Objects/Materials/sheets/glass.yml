# Glass

- type: material
  id: MCGlass
  stackEntity: MCheetGlass
  name: MC-materials-glass
  icon: { sprite: _RMC14/Objects/Materials/Sheets/glass.rsi, state: glass }
  color: "#a8ccd7"
  price: 0.075

- type: stack
  id: MCGlass
  name: MC-materials-glass
  icon: { sprite: /Textures/_RMC14/Objects/Materials/Sheets/glass.rsi, state: glass }
  spawn: MCSheetGlass
  maxCount: 50

- type: entity
  parent: BaseItem
  id: MCSheetGlassBase
  suffix: MC
  abstract: true
  components:
  - type: Material
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SolutionContainerManager
    solutions:
      glass:
        canReact: false
  - type: Stack
    count: 50
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
  - type: Appearance
  - type: Tag
    tags:
    - Sheet
    - RMCGlass

- type: entity
  parent: MCSheetGlassBase
  id: MCSheetGlass
  name: MC-materials-glass
  description: Glass is a non-crystalline solid, made out of silicate, the primary constituent of sand. It is valued for its transparency, albeit it is not too resistant to damage.
  suffix: Filled
  components:
  - type: RMCConstructionItem
    buildable:
      - RMCWindowDirectionalBuild
      # Full window
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      MCGlass: 100
  - type: Stack
    stackType: MCGlass
    count: 50
    baseLayer: base
    layerStates:
      - glass
      - glass_2
      - glass_3
      - glass_4
  - type: Construction
    graph: MCGlass
    node: SheetGlass
  - type: Sprite
    layers:
      - state: glass_4
        map: ["base"]
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

- type: entity
  parent: MCSheetGlass
  id: MCSheetGlass10
  suffix: "10"
  components:
   - type: Sprite
     state: glass_2
   - type: Stack
     stackType: MCGlass
     count: 10

- type: entity
  parent: MCSheetGlass
  id: MCSheetGlass25
  suffix: "25"
  components:
   - type: Sprite
     state: glass_2
   - type: Stack
     stackType: MCGlass
     count: 25

- type: entity
  parent: MCSheetGlass
  id: MCSheetGlass30
  suffix: "30"
  components:
  - type: Sprite
    state: glass_3
  - type: Stack
    stackType: MCGlass
    count: 30

- type: entity
  parent: MCSheetGlass
  id: MCSheetGlass1
  suffix: Single
  components:
  - type: Sprite
    state: glass
  - type: Stack
    stackType: MCGlass
    count: 1


# Glass Reinforced

- type: material
