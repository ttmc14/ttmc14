- type: stack
  id: MCGlass
  icon:
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
    state: glass
  spawn: MCSheetGlass
  maxCount: 50

- type: entity
  parent: MCItem
  id: MCSheetGlass
  name: glass
  description: Sheets made out of glass. Fragile but useful for construction.
  suffix: Full (50)
  components:
  - type: Tag
    tags:
    - Sheet
    - RMCGlass
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
    layers:
    - state: glass_4
      map: [ "base" ]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
    size: Normal
  - type: Stack
    count: 50
    stackType: MCGlass
    baseLayer: base
    layerStates:
    - glass
    - glass_2
    - glass_3
    - glass_4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RMCConstructionItem
    buildable:
    - RMCWindowDirectionalBuild
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

- type: entity
  parent: MCSheetGlass
  id: MCSheetGlass1
  suffix: 1
  components:
  - type: Stack
