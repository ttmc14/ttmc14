- type: stack
  id: MCPlasteel
  icon:
    sprite: /Textures/_RMC14/Objects/Materials/Sheets/plasteel.rsi
    state: plasteel
  spawn: MCSheetPlasteel
  maxCount: 50

- type: entity
  parent: MCSheetMetal
  id: MCSheetPlasteel
  name: plasteel sheet
  description: Plasteel is an expensive, durable material made from combining platinum, steel, and advanced polymers to create a metal that is corrosion-resistant, highly durable, and lightweight. The only reason this isn't used more often is because of how damn costly it is."
  suffix: Full (50)
  components:
  - type: RMCConstructionItem
    buildable:
    - MCPlasteelBarricadeFoldableBuild
    - MCPlasteelBarricadeBuild
    - MCRodPlasteelBuild
  - type: Stack
    count: 50
    stackType: MCPlasteel
    baseLayer: base
    layerStates:
    - plasteel
    - plasteel_2
    - plasteel_3
    - plasteel_4
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
    layers:
    - state: plasteel_4
      map: [ "base" ]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
    heldPrefix: plasteel
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUiKey.Key:
        type: RMCConstructionBui

