- type: stack
  id: MCGlassPhoronReinforced
  icon:
    sprite: _RMC14/Objects/Materials/Sheets/phoron_reinf_glass.rsi
    state: phoronrglass
  spawn: MCSheetGlassPhoronReinforced
  maxCount: 50

- type: entity
  parent: MCItem
  id: MCSheetGlassPhoronReinforced
  name: reinforced phoron glass
  description: Extremely durable reinforced phoron glass. Highly resistant to damage and heat.
  suffix: Full (50)
  components:
  - type: Tag
    tags:
    - Sheet
    - RMCGlass
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/phoron_reinf_glass.rsi
    layers:
    - state: phoronrglass_4
      map: [ "base" ]
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/phoron_reinf_glass.rsi
    size: Normal
    heldPrefix: phoronrglass
  - type: Stack
    count: 50
    stackType: MCGlassPhoronReinforced
    baseLayer: base
    layerStates:
    - phoronrglass
    - phoronrglass_2
    - phoronrglass_3
    - phoronrglass_4
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger: !type:DamageTrigger
        damage: 180
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

