- type: entity
  parent: MCBaseMeleeWeapon
  id: MCWeaponGun
  abstract: true
  categories: [ MCContent ]
  components:
  - type: MCWeaponZLevelsShoot
  - type: RMCSelectiveFire
    # Scatter
    scatterWielded: 4
    scatterUnwielded: 12
    # scatterIncrease: 0
    # scatterDecay: 0
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 0
    # Burst
    burstScatterMult: 1
    burstFireRateMultiplier: 1
    modifiers:
      Burst:
        fireDelay: 0
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: null
      FullAuto:
        fireDelay: 0
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: null
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 1
  - type: RMCWeaponDamageFalloff
  - type: Gun
    meleeCooldownOnShoot: false
    resetOnHandSelected: false
    burstCooldown: 0
  - type: GunIFF
    enabled: false
  - type: UsableWhileDevoured
    canUnequip: true
  - type: Clothing
    quickEquip: false
  - type: UseDelay
    delay: 0
  - type: WieldDelay
  - type: AltFireMelee
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        MCBrute: 5
    soundHit:
      collection: GenericHit
  - type: EmitSoundOnPickup
    sound:
      collection: RMCEquipGun
  - type: EmitSoundOnLand
    sound:
      collection: RMCRustleGun
  - type: Appearance
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/pistol_mouse.rsi
      state: all
  - type: InteractionActivateOnClick

- type: entity
  id: MCWeaponMagazineVisuals
  categories: [ MCContent ]
  abstract: true
  components:
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

- type: entity
  id: MCAttachableHolder
  categories: [ MCContent ]
  abstract: true
  components:
  - type: AttachableHolder
  - type: ItemSizeChange
  - type: ActivatableUI
    verbText: rmc-verb-strip-attachables
    verbOnly: true
    key: enum.AttachmentUI.StripKey
  - type: UserInterface
    interfaces:
      enum.AttachmentUI.StripKey:
        type: AttachmentStripBui
      enum.AttachmentUI.ChooseSlotKey:
        type: AttachmentChooseSlotBui

- type: Tag
  id: MCMagazineShotgun

- type: Tag
  id: MCMagazineHandful
