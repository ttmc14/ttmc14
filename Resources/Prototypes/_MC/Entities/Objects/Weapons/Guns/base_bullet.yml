- type: entity
  parent: BaseBullet
  id: MCBullet
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: Sprite
    noRot: false
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: BulletholeGenerator
  - type: RMCBullet
  - type: RMCProjectileAccuracy
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 14
    soundHit:
      path: /Audio/_RMC14/Bullets/bullet_impact1.ogg
  - type: CauseEmoteOnProjectileHit
    emote: Hiss
    rareEmote: XenoRoar
    whitelist:
      components:
      - Xeno
