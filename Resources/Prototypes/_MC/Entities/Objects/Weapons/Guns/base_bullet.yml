- type: entity
  id: MCShootable
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: Reflective
  - type: Clickable
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        MCBrute: 14
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: TimedDespawn
    lifetime: 10
  - type: LagCompensation
  - type: CauseEmoteOnProjectileHit
    emote: Hiss
    rareEmote: XenoRoar
    whitelist:
      components:
      - Xeno

- type: entity
  parent: MCShootable
  id: MCBullet
  abstract: true
  components:
  - type: Sprite
    noRot: false
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: BulletholeGenerator
  - type: RMCBullet
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 9999
      falloff: 9999
  - type: Projectile
    soundHit:
      path: /Audio/_RMC14/Bullets/bullet_impact1.ogg

- type: entity
  parent: MCShootable
  id: MCLaser
  components:
  - type: Tag
    tags: [ MCDamageLaser ]
  - type: Projectile
    impactEffect: null
  - type: TimedDespawn
    lifetime: 0.01
