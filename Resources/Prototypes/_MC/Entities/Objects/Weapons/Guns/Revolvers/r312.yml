- type: entity
  parent: MCWeaponRevolver
  id: MCWeaponRevolverR312
  name: R-312 'Albedo' Revolver
  description: Futuristic style revolver with railgun system, using to fire EMB (experimental medical bullets). Just first make sure that you chambered EMB, but not .500 White Express.
  components:
  - type: Tag
    tags:
    - MCWeaponSidearm
    - MCWeaponRevolver
    - MCWeaponRevolverR312
    # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Special/albedo.rsi
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Special/albedo.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Fire/t312.ogg
  # Statistics
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - MCSpeedLoaderR312
      - MCCartridgeRevolverR312
      - MCCartridgeRevolverR312Medical
      - MCCartridgeRevolverR312MedicalAdrenaline
      - MCCartridgeRevolverR312MedicalRussianRed
      - MCCartridgeRevolverR312MedicalMeraderm
      - MCCartridgeRevolverR312MedicalNeuraline
      - MCCartridgeRevolverR312MedicalHyronalin
      - MCCartridgeRevolverR312MedicalCombat
    proto: MCCartridgeRevolverR312
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    baseFireRate: 5
    # Recoil
    recoilWielded: -1
    recoilUnwielded: -1
    # Scatter
    scatterWielded: 0 # -7
    scatterUnwielded: 0 # -5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
    accuracyMultiplierUnwielded: 2
  - type: RMCExtraProjectilesDamageMods
    damageMultiplier: 0.35
  - type: GunRequiresSkills
    skills:
      MCSkillMedical: 2
  - type: AttachableHolder
    slots: {}
  - type: AttachableHolderVisuals
    offsets: {}

- type: Tag
  id: MCWeaponRevolverR312

