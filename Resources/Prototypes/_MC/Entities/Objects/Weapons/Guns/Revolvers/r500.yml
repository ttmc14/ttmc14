  - type: RMCStorageEjectHand
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,9,1 # 10 slots
    whitelist:
      tags:
      - MCCartridgeRevolverR500
  - type: StorageFill
    contents:
    - id: MCCartridgeRevolverR500
      amount: 10
  - type: FixedItemSizeStorage

- type: Tag
  id: MCBoxHandfulR500

- type: stack
