# Bulletes
- type: entity
  parent: MCBullet
  id: MCBulletRevolverR500
  name: .500 White Express revolver bullet
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 100
  - type: CMArmorPiercing
    amount: 60 # xeno 20
  - type: MCStunOnHit
    knockback: 2
