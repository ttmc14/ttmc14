- type: entity
  parent: MCWeaponSMG
  id: MCWeaponSMG45
  name: SMG-45 heavy submachinegun
  description: The SMG-45 is a heavier than usual subgun used by the TerraGov Marine Corps. Best known for carrying a punch within a small package. It's usually carried by troops who want a lightweight firearm to rush with while beating a mean punch, however it struggles at range. It uses .41 AE caseless rounds.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/SMGs/smg45/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/SMGs/smg45/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/SMGs/smg45/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/SMGs/smg45/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_smg45.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - Burst
    - FullAuto
    baseFireRate: 4
    # Scatter and recoil
    recoilWielded: 1
    recoilUnwielded: 0.6
    scatterWielded: 9
    scatterUnwielded: 20
    modifiers:
      Burst:
        fireDelay: 0.2
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineSMG45
        insertSound: /Audio/_MC/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineSMG45
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 10
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: WieldDelay
    baseDelay: 0.5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.15
    accuracyMultiplierUnwielded: 0.85
  # Attachable
  - type: AttachableHolder
    randomAttachmentChance: 0.1
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
           - MCAttachmentExtendedMuzzle
           - MCAttachmentSuppressor
           - MCAttachmentBayonet
           - MCAttachmentRecoilCompensator
          # - TODO: Heavy Barrel
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
      mc-slot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
          - MCAttachmentVerticalGrip
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBurstFireAssembly
          - MCAttachmentMiniFlamethrower
          - MCAttachmentUnderbarrelShotgun
          - MCAttachmentGrenadeLauncher
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.687500, 0.062500
      mc-slot-underbarrel: 0.281250, -0.093750
      mc-slot-stock: -0.531250, 0.031250
      mc-slot-rail: 0.156250, 0.187500

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineSMG45
  name: SMG-45 magazine (.41 AE)
  description: A .41 AE caseless submachinegun magazine.
  components:
  - type: Tag
    tags:
    - MCMagazineSmg
    - MCMagazineSMG45
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeSMG45
    proto: MCCartridgeSMG45
    capacity: 55
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/smg45.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true

- type: Tag
  id: MCMagazineSMG45

- type: entity
  parent: MCMagazineSMG45
  id: MCMagazineSMG45SH
  name: SMG-45 squash-head magazine (.41 AE)
  description: A .41 AE caseless submachinegun magazine that does a minituare explosion upon contact, will shred the armor off of basically anything.
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeSMG45SH
    proto: MCCartridgeSMG45SH
    capacity: 55
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/smg45_sh.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true

