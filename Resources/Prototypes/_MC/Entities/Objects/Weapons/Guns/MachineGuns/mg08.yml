- type: entity
  parent: [ CMBaseWeaponGun, MCItem]
  id: MCMachineGunMG08
  categories: [ HideSpawnMenu ]
  name: HMG-08 heavy machinegun
  description: An absolute monster of a weapon, this is a watercooled heavy machinegun modernized by some crazy armorer with a wheeling kit included. Considering the mish mash of parts for the wheeling kit, you think its from another model of the gun. The pinnacle at holding a chokepoint. Holds 500 rounds of 10x28mm caseless in a box case. IS NOT IFF CAPABLE. Aiming carefully recommended. Can be repaired with a blowtorch once deployed. Alt Right click to unanchor and reanchor it.
  components:
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: MagazineAmmoProvider
    autoEject: true
  - type: RMCAmmoEject
  - type: MagazineVisuals
    magState: mag
    steps: 0
    zeroVisible: true
  - type: Appearance
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Machine/hmg08.rsi
    layers:
    - state: icon
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Machineguns/HMG08/HMG-08_1.ogg
      params:
        volume: -5
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    recoilUnwielded: 1
    scatterWielded: 3
    scatterUnwielded: 3
    baseFireRate: 7
    modifiers:
      FullAuto:
        maxScatterModifier: 0
        useBurstScatterMult: false
        unwieldedScatterMultiplier: 0
        shotsToMaxScatter: 125
  - type: RMCWeaponAccuracy
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineMG08
  - type: GunDamageModifier
    multiplier: 1
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  - type: Scope
    scopePopup: null
    unScopePopup: null
    canUseInsideContainer: true
    canUseNightVision: true
    zoomLevels:
    - zoom: 1
      offset: 7
      doAfter: 0
      allowMovement: true
  - type: Tag
    tags:
    - MCMachineGunMG08
  - type: Overheat

# Magazines
- type: entity
  parent: MCMagazineRifle
  id: MCMagazineMG08
  name: MG-08 Ammunition Box (10x28mm rounds)
  description: A box of 500, 10x28mm caseless rounds for the MG-08 heavy machine gun system.
  components:
  - type: Tag
    tags:
    - MCMagazineMG08
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeHMG10x28mmMg08
    proto: MCCartridgeHMG10x28mmMg08
    capacity: 500
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Machine/hmg08.rsi
    state: mag-0

# Cartridges

- type: entity
  parent: CMBaseCartridgeRifle
  id: MCCartridgeHMG10x28mmMg08
  name: cartridge (10x28mm mg08)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: MCBulletHMG10x28mmMg08
  - type: Tag
    tags:
    - MCCartridgeHMG10x28mmMg08

# Projectiles

- type: entity
  parent: CMBulletBase
  id: MCBulletHMG10x28mmMg08
  name: bullet (10x28mm mg08)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    damage:
      types:
        MCBrute: 25
  - type: CMArmorPiercing
    amount: 5
  - type: MCXenoSunderDamageOnHit
    amount: 0.2
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 14
      falloff: 9999
      ignoreModifiers: true
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 16
      falloff: 10

- type: entity
  parent: [RMCBaseWeaponMount, MCItem]
  id: MC08Mount
  name: HMG-08 heavy machinegun
  description: An absolute monster of a weapon, this is a watercooled heavy machinegun modernized by some crazy armorer with a wheeling kit included. Considering the mish mash of parts for the wheeling kit, you think its from another model of the gun. The pinnacle at holding a chokepoint. Holds 500 rounds of 10x28mm caseless in a box case. IS NOT IFF CAPABLE. Aiming carefully recommended. Can be repaired with a blowtorch once deployed. Alt Right click to unanchor and reanchor it.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Machine/hmg08.rsi
    state: mg08_deployed
    layers:
    - state: mg08_deployed
      map: [ "enum.WeaponMountComponentVisualLayers.Mounted" ]
      visible: false
    - state: mg08_deployed_e
      map: [ "enum.WeaponMountComponentVisualLayers.MountedAmmo" ]
      visible: false
    - state: base
      map: [ "enum.WeaponMountComponentVisualLayers.Folded" ]
      visible: false
    - state: mag-0
      map: [ "enum.WeaponMountComponentVisualLayers.FoldedAmmo" ]
      visible: false
    - state: mg08_overheat
      map: [ "enum.WeaponMountComponentVisualLayers.Overheated" ]
      visible: false
  - type: Strap
    enabled: false
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 230
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: CollisionWake
  - type: WeaponMount
    fixedWeaponPrototype: "MCMachineGunMG08"
    isWeaponSecured: true
    isWeaponLocked: true
    canRotateWithoutTool: true
    mountOnDeploy: true
    mountExclusionAreaSize: 0
    barricadeExclusionAreaSize: 1
    assembleDelay: 2
    deploySound: /Audio/_MC/Weapons/Guns/Machineguns/HMG08/HMG-08_jam.ogg
    undeploySound: null
    acidableWhileUndeployed: true
  - type: Tag
    tags:
    - MCMG08Mount
  - type: Foldable
    folded: true
    isLocked: true
  - type: Corrodible
    isCorrodible: true

# Tags
- type: Tag
  id: MCMagazineMG08

- type: Tag
  id: MCMachineGunMG08

- type: Tag
  id: MCCartridgeHMG10x28mmMg08

- type: Tag
  id: MCMG08Mount
