- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponShotgunSH35
  name: SH-35 pump shotgun
  description: The Terran Armories SH-35 is the shotgun used by the TerraGov Marine Corps. It's used as a close quarters tool when someone wants something more suited for close range than most people, or as an odd sidearm on your back for emergencies. Uses 12 gauge shells.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Shotguns/sh35.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Shotguns/sh35.rsi
  - type: Gun
    shotsPerBurst: 1
  - type: ShootUseDelay
  - type: WieldableSpeedModifiers
    base: 0.816327
  - type: WieldDelay
    delay: 0.35
  - type: RMCSelectiveFire
    recoilWielded: 2
    recoilUnwielded: 5
    scatterWielded: 2
    scatterUnwielded: 4.5
    baseFireRate: 0.6
  - type: BallisticAmmoProvider
    capacity: 8
    whitelist:
      tags:
      - MCCartridgeShotgun
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 1
  - type: PumpAction
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentMuzzleCharger
          # - MCAttachmentRecoilCompensator TODO: Make compensator not making shotgun a sniper rifle
          - MCAttachmentExtendedMuzzle
          - MCAttachmentBayonet
      mc-attachment-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentAngledGrip
          - MCAttachmentVerticalGrip
      mc-attachment-stock:
        locked: true
        startingAttachable: MCAttachmentStockSH35
        whitelist:
          tags:
          - MCAttachmentStockSH35
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRedDotSight
          - MCAttachmentRailFlashlight
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 0.500000, 0.062500
      mc-attachment-underbarrel: 0.187500, -0.125000
      mc-attachment-stock: 0, 0
      mc-attachment-rail: -0.125000, 0.156250
