- type: entity
  parent: MCWeaponShotgunBreechloader
  id: MCWeaponShotgunSH34
  name: SH-34 double barrel shotgun
  description: A double barreled shotgun of archaic, but sturdy design used by the TGMC. Due to reports of barrel bursting, the abiility to fire both barrels has been disabled. Uses 12 gauge shells, but can only hold 2 at a time.
  components:
  - type: Tag
    tags:
    - MCWeaponShotgunSH34
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Shotguns/sh34.rsi
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Shotguns/sh34.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mou53.ogg
    shotsPerBurst: 1
  - type: Appearance
  - type: ShootUseDelay
  - type: WieldDelay
    delay: 0.5
  - type: UseDelay
  - type: GunRequiresWield
  - type: RMCSelectiveFire
    recoilWielded: 3
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 15
    baseFireRate: 3
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.7
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeShotgun
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: RMCAmmoEject
    containerID: ballistic-ammo
    ejectSound:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
    toggleDelay: 1.1
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-attachment-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentAngledGrip
          - MCAttachmentVerticalGrip
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentRedDotSight
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 0.500000, 0.031250
      mc-attachment-underbarrel: 0.312500, -0.062500
      mc-attachment-stock: -0.406250, -0.062500
      mc-attachment-rail: 0.093750, 0.093750

- type: Tag
  id: MCWeaponShotgunSH34
