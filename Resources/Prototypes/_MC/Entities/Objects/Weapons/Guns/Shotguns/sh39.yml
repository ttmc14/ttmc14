- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponShotgunSH39
  name: SH-39 combat shotgun
  description: The Terran Armories SH-39 combat shotgun is a semi automatic shotgun used by breachers and pointmen within the TGMC squads. Uses 12 gauge shells.
  components:
  - type: Sprite
    layers:
    - sprite: _MC/Objects/Weapons/Guns/Shotguns/sh39.rsi
      state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Shotguns/sh39.rsi
  - type: Gun
    shotsPerBurst: 1
  - type: ShootUseDelay
  - type: GunRequiresWield # Until "WieldDelay" and "ShootUseDelay" starts work normaly
  - type: RMCSelectiveFire
    recoilWielded: 2
    recoilUnwielded: 5
    scatterWielded: 4
    scatterUnwielded: 10
    baseFireRate: 0.714 # 1 / 1.4 seconds
    burstScatterMult: 5
  - type: BallisticAmmoProvider
    capacity: 10
    whitelist:
      tags:
      - MCShellShotgun
  - type: WieldDelay
    baseDelay: 0.7
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.05
    accuracyMultiplierUnwielded: 0.85
  - type: RMCExtraProjectilesDamageMods
    damageMultiplier: 0.7
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - MCAttachmentMuzzleCharger
          - MCAttachmentRecoilCompensator
          - MCAttachmentExtendedMuzzle
          - MCAttachmentBayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRedDotSight
          - MCAttachmentRailFlashlight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentAngledGrip
          - MCAttachmentVerticalGrip
      rmc-aslot-stock:
        startingAttachable: MCAttachmentStockSH39
        whitelist:
          tags:
          - MCAttachmentStockSH39
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.5, 0.1
      rmc-aslot-rail: -0.05, 0.15
      rmc-aslot-underbarrel: 0.1, -0.05
      rmc-aslot-stock: -0.6, 0.03125
