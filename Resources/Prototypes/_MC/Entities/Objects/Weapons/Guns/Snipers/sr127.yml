# Bullets
- type: entity
  parent: MCBullet
  id: MCBulletSR127Base
  components:
  - type: RMCProjectileAccuracy
    thresholds:
    - range: 25
      falloff: 999
  - type: CMArmorPiercing
    amount: 50
  - type: MCStunOnHit
    slowdownTime: 2
    maxDistance: 20

- type: entity
  parent: MCBulletSR127Base
  id: MCBulletSR127
  name: high caliber rifle bullet
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 85

- type: entity
  parent: MCBulletSR127Base
  id: MCBulletSR127Incendiary
  name: high caliber incendiary rifle bullet
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 15
        MCBurn: 50
  - type: IgniteOnProjectileHit
    intensity: 50
    duration: 5

- type: entity
  parent: MCBulletSR127Base
  id: MCBulletSR127Flak
  name: high caliber flak rifle bullet
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 65
  - type: MCXenoSunderDamageOnHit
    amount: 15
  - type: MCStunOnHit
    staggerTime: 2
    knockback: 4
    slowdownTime: 3
    maxDistance: 20
  - type: MCProjectileStatusEffectsOnHit
    statusEffects:
    - effectId: MCStatusEffectShatter
      duration: 5
