- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponSniperSR127
  name: SR-127 Bauer bolt action rifle
  description: The Bauer SR-127 is the standard issue bolt action rifle used by the TGMC. Known for its long range accuracy and use by marksmen despite its age and lack of IFF, though careful aim allows fire support from behind. It has an irremoveable scope. Uses 8.6×70mm box magazines.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Snipers/sr127/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Snipers/sr127/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Snipers/sr127/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Snipers/sr127/inhands.rsi
  # Statistics
  - type: Gun
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_dmr37.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    baseFireRate: 0.5
    # Scatter
    scatterWielded: -10
    scatterUnwielded: 20
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineSR127
        insertSound: /Audio/_MC/Weapons/Guns/Reload/m41a_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/m41a_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineSR127
  - type: WieldDelay
    baseDelay: 2.5
  - type: WieldableSpeedModifiers
    base: 0.5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.7
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          - MCAttachmentMuzzleCharger
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentBipod
      mc-slot-rail:
        startingAttachable: MCAttachmentRailScopeSR127
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentRedDotSight
          - MCAttachmentRailScopeSR127
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.906250, 0.125000
      mc-slot-underbarrel: 0.500000, 0.000000
      mc-slot-rail: 0.062500, 0.218750
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.85
    aimFireModifier: 0.85
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/ak47_cocked.ogg

#  Magazines
- type: entity
  parent: MCMagazineRifle
  id: MCMagazineSR127
  name: bolt action sr-127 rifle magazine
  description: A box magazine filled with 8.6x70mm rifle rounds for the SR-127.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineSR127
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeSR127
    proto: MCCartridgeSR127
    capacity: 15
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/sr127.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]

- type: entity
  parent: MCMagazineSR127
  id: MCMagazineSR127Incendiary
  name: bolt action sr-127 rifle incendiary magazine
  description: A box magazine filled with 8.6x70mm rifle flak rounds for the SR-127.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeSR127Incendiary
    proto: MCCartridgeSR127Incendiary
    capacity: 15
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/sr127.rsi

- type: entity
  parent: MCMagazineSR127
  id: MCMagazineSR127Flak
  name: bolt action sr-127 rifle flak magazine
  description: A box magazine filled with 8.6x70mm rifle flak rounds for the SR-127.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeSR127Flak
    proto: MCCartridgeSR127Flak
    capacity: 15
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/sr127_flak.rsi

- type: Tag
  id: MCMagazineSR127

