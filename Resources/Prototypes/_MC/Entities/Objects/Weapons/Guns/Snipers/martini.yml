- type: entity
  parent: MCBullet
  id: MCBulletMartini
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 100
  - type: CMArmorPiercing
    amount: 50
    # base 20
    # xeno additional +30
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCStunOnHit
    maxDistance: 12
    paralyzeTime: 0.5
    slowdownTime: 0.5
    staggerTime: 1
    knockback: 2

- type: entity
  parent: MCBullet
  id: MCBulletMartiniWhite
  components:
  - type: Projectile
