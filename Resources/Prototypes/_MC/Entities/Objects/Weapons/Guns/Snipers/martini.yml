- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponShotgunMartini
  name: Martini Henry lever action rifle
  description: A lever action with room for a single round of .557/440 ball. Perfect for any kind of hunt, be it elephant or xeno with how quick to the draw it is.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/martini/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/martini/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/martini/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_martinihenry.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/sniper_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    baseFireRate: 1
    # Scatter
    scatterWielded: -25
    scatterUnwielded: 20
    # Recoil
    recoilWielded: 2
    recoilUnwielded: 4
  - type: BallisticAmmoProvider
    capacity: 1
    soundInsert:
      path: /Audio/_MC/Weapons/Guns/Reload/martini_reload.ogg
    whitelist:
      tags:
      - MCCartridgeMartini
  - type: ShootUseDelay
  - type: WieldableSpeedModifiers
    base: 1
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 1.2
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Build a sentry kit
          # - TODO: Tactical sensor
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.937500, 0.125000
      mc-slot-underbarrel: 0.343750, -0.031250
      mc-slot-rail: 0.468750, 0.156250
  # Specials
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/martini_cocked.ogg

- type: entity
  parent: RMCBoxShotgunBase
  id: MCBoxMartiniRounds
  name: box of .557/440 rifle rounds
  description: A box filled with rifle bullets.
  components:
  - type: Tag
    tags:
    - MCBoxMartiniRounds
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Boxes/martini.rsi
    layers:
    - state: base-full
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: base-full }
          False: { state: base-empty }
  - type: Item
    size: Small
  - type: RMCStorageEjectHand
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,7,1 # 4 slots
    whitelist:
      tags:
      - MCCartridgeMartini
  - type: StorageFill
    contents:
    - id: MCCartridgeMartini
      amount: 4

- type: entity
  parent: MCBoxMartiniRounds
  id: MCBoxMartiniRoundsWhite
  name: box of .557/440 white rifle rounds
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Boxes/martini_white.rsi
  - type: StorageFill
    contents:
    - id: MCCartridgeMartiniWhite
      amount: 4

- type: Tag
  id: MCBoxMartiniRounds

- type: entity
  parent: CMShellShotgunBase
  id: MCCartridgeMartini
  name: handful of crude heavy sniper bullet (.557/440)
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeMartini
    - MCHandful
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini.rsi
    layers:
    - state: base
      map: [ "base" ]
  - type: CartridgeAmmo
    proto: MCBulletMartini
  - type: Stack
    count: 5
    stackType: MCCartridgeMartini
    baseLayer: base
    layerStates:
    - base-1
    - base-1
    - base-2
    - base-3
    - base-4
    - base-5

- type: Tag
  id: MCCartridgeMartini

- type: entity
  parent: MCCartridgeMartini
  id: MCCartridgeMartiniWhite
  name: handful of crude heavy sniper bullet white (.557/440)
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini_white.rsi
  - type: CartridgeAmmo
