- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponShotgunMosin
  name: Mosin Nagant rifle
  description: A mosin nagant rifle, even just looking at it you can feel the cosmoline already. Commonly known by its slang, \"Moist Nugget\", by downbrained colonists and outlaws.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/mosin/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/mosin/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/mosin/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_mosin.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/sniper_empty.ogg
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: RMCSelectiveFire
    selectedMode: SemiAuto
    baseFireModes:
    - SemiAuto
    baseFireRate: 0.8
    # Scatter
    scatterWielded: -1
    scatterUnwielded: 12
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 4
  - type: BallisticAmmoProvider
    capacity: 5
    soundInsert:
      path: /Audio/_MC/Weapons/Guns/Reload/mosin_reload.ogg
    whitelist:
      tags:
      - MCCartridgeMosin
  - type: ShootUseDelay
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: WieldDelay
    baseDelay: 1.4
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-barrel: 1.0, 0.03
      mc-slot-rail: 0.1, 0.0
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.8
    aimFireModifier: 0.7
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/working_the_bolt.ogg

- type: entity
  parent: CMShellShotgunBase
  id: MCCartridgeMosin
  name: handful of heavy crude sniper bullet (7.62x54mmR)
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeMosin
    - MCHandful
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/mosin.rsi
    layers:
    - state: base
      map: [ "base" ]
  - type: CartridgeAmmo
    proto: MCBulletMosin
  - type: Stack
    count: 5
    stackType: MCCartridgeMosin
    baseLayer: base
    layerStates:
    - base-1
    - base-1
    - base-2
    - base-3
    - base-4
    - base-5

- type: Tag
  id: MCCartridgeMosin

- type: entity
  parent: MCBullet
  id: MCBulletMosin
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 70
  - type: CMArmorPiercing
    amount: 50
    # base 35
    # xeno additional +15
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCProjectileStatusEffectsOnHit
    statusEffects:
    - effectId: MCStatusEffectShatter
      duration: 8

- type: stack
  id: MCCartridgeMosin
  name: handful of heavy crude sniper bullet (7.62x54mmR)
  icon:
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/mosin.rsi
    state: base-1
  spawn: MCCartridgeMosin
  maxCount: 5
