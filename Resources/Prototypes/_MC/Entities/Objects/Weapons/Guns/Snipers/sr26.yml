- type: entity
  parent: [ MCWeaponRifle, MCWeaponMagazineVisuals ]
  id: MCWeaponSniperSR26
  name: SR-26 Kauser-KT automatic sniper rifle
  description: The Kauser-KT SR-26 is the TerraGov Marine Corps's automatic sniper rifle usually married to it's iconic NVG/KTLD scope combo. It is notable for its high rate of fire for its class, and has decent performance in any range. Uses 10x128mm caseless with specialized pressures for IFF fire.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Snipers/sr26.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Snipers/sr26.rsi
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/sniper.ogg
  - type: GunIFF
    enabled: true
  - type: RMCFocusedShooting
  - type: AimedShot
    aimDuration: 1.5
    aimedShotCooldown: 1.5
  - type: TargetingLaser
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    recoilUnwielded: 4
    recoilWielded: 0
    scatterWielded: -5
    scatterUnwielded: 20
    baseFireRate: 0.4
    burstScatterMult: 2
    modifiers:
      FullAuto:
        maxScatterModifier: 10
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 7
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.7
  - type: GunRequiresWield
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineSR26
        insertSound: /Audio/_MC/Weapons/Guns/Reload/sniper_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/sniper_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineSR26
  - type: GunDamageModifier
    multiplier: 1
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  - type: WieldDelay
    baseDelay: 1.7
  - type: AttachableHolder
    slots:
      mc-aslot-barrel:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
      mc-aslot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
          - MCAttachmentVerticalGrip
          - MCAttachmentBipod
      mc-aslot-rail:
        locked: true
        startingAttachable: MCAttachmentRailScopeSR26
        whitelist:
          tags:
          - MCAttachmentRailScopeSR26
  - type: AttachableHolderVisuals
    offsets:
      mc-aslot-barrel: 0.900, 0.0475
      mc-aslot-rail: 0.0675, 0.1875
      mc-aslot-underbarrel: 0.4200, -0.100
  - type: RMCGunChamber
    enabled: false

# Attachments
- type: Tag
  id: MCAttachmentBarrelSR26

- type: entity
  parent: MCAttachmentBaseScope
  id: MCAttachmentRailScopeSR26
  name: antimaterial rifle scope
  description: A rail mounted zoom sight scope specialized for the SR-26 sniper rifle. Allows zoom by activating the attachment.
  components:
  - type: Tag
    tags:
    - MCAttachmentRail
    - MCAttachmentRailScopeSR26
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Attachments/scope.rsi
    state: antimat
  - type: AttachableVisuals
    suffix: ""
  - type: AttachableToggleable
    actionName: Toggle SR-26 rail scope
    actionDesc: Allows zoom by activating the attachment.
    icon:
      sprite: _MC/Objects/Weapons/Guns/Attachments/scope.rsi
      state: antimat_a
  - type: AttachableToggleableSimpleActivate
  - type: Scope
    zoomLevels:
    - zoom: 1.3
      offset: 16
      allowMovement: true
      doAfter: 0
  - type: AttachableSpeedMods
    modifiers:
    - conditions:
        wieldedOnly: true
      walk: -0.1
      sprint: -0.1
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.4
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        wieldedOnly: true
      accuracyAddMult: -0.05
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 1
    medium: 1
    heavy: 1

- type: Tag
  id: MCAttachmentRailScopeSR26

#  Magazines
- type: entity
  parent: MCMagazineRifle
  id: MCMagazineSR26
  name: SR-26 magazine (10x128mm)
  description: A box magazine filled with high preasure 10x128mm biggest rifle rounds for the SR-26.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineSR26
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeSR26
    proto: MCCartridgeSR26
    capacity: 15
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/sr26.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]

- type: entity
