- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponSniperDMR37
  name: DMR-37 SCA designated marksman rifle
  description: The San Cristo Arms DMR-37 is the TerraGov Marine Corps designated marksman rifle. It is rather well-known for it's very consistent target placement at longer than usual range, it however lacks a burst fire mode or an automatic mode. It is mostly used by people who prefer to do more careful shooting than most. Uses 10x27mm caseless caliber.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/dmr37/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/dmr37/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/dmr37/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/dmr37/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_dmr37.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    baseFireRate: 1.5
    # Scatter
    scatterWielded: -4
    scatterUnwielded: 26
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 0
  # Why not? I return auto-eject
  - type: MagazineAmmoProvider
    autoEject: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineDMR37
        insertSound: /Audio/_MC/Weapons/Guns/Reload/m41a_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/m41a_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleDMR37
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: WieldableSpeedModifiers
    base: 0.75
  - type: WieldDelay
    baseDelay: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.15
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-barrel:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          # - TODO: Heavy barrel
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentBurstFireAssembly
          - MCAttachmentMiniFlamethrower
          - MCAttachmentUnderbarrelShotgun
          - MCAttachmentAngledGrip
          - MCAttachmentVerticalGrip
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentGrenadeLauncher
          - MCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-barrel: 1.2, 0.1
      mc-slot-rail: 0.25, 0.12
      mc-slot-underbarrel: 0.6, -0.25
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.5
    aimFireModifier: 0.7

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineDMR37
  description: A 10mm DMR magazine.
  name: DMR-37 magazine (10x27mm)
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleDMR37
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/dmr37.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeDMR37
    proto: MCCartridgeDMR37
    capacity: 20

- type: Tag
  id: MCMagazineRifleDMR37

- type: entity
  parent: MCCartridge
  id: MCCartridgeDMR37
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeDMR37
  - type: CartridgeAmmo
    proto: MCBulletDMR37

- type: Tag
  id: MCCartridgeDMR37

- type: entity
  parent: MCBullet
  id: MCBulletDMR37
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 60
  - type: CMArmorPiercing
    amount: 25
    # base 15
    # xeno additional +10
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 1
      falloff: 0.5
    - range: 6
      falloff: 0
    - range: 25
      falloff: 0.5
