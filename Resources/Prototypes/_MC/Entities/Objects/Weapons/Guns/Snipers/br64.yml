- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponSniperBR64
  name: BR-64 SCA battle rifle
  description: The San Cristo Arms BR-64 is the TerraGov Marine Corps main battle rifle. It is known for its consistent ability to perform well at most ranges, and medium range stopping power with bursts. It is mostly used by people who prefer a bigger round than the average. Uses 10x26.5smm caseless caliber.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/br64/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/br64/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/br64/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/br64/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_br64.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    # TODO: AutoBurst
    - Burst
    - FullAuto
    baseFireRate: 3.5
    # Scatter
    scatterWielded: 0
    scatterUnwielded: 26
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 0
    # Modifiers
    modifiers:
      Burst:
        fireDelay: 0.1
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineBR64
        insertSound: /Audio/_MC/Weapons/Guns/Reload/m41a_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/m41a_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleBR64
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: WieldDelay
    baseDelay: 0.9
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 0.9
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          # - TODO: Heavy barrel
      mc-slot-rail:
        startingAttachable: MCAttachmentMiniScope
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          # - TODO: Tactical sensor
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentVerticalGrip
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentGrenadeLauncher
          - MCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.750000, 0.062500
      mc-slot-underbarrel: 0.218750, -0.125000
      mc-slot-rail: 0.250000, 0.156250
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.5
    aimFireModifier: 0.6

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineBR64
  name: BR-64 magazine (10x26.5mm)
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleBR64
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/br64_rifle.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeBR64
    proto: MCCartridgeBR64
    capacity: 36

- type: Tag
  id: MCMagazineRifleBR64

- type: entity
  parent: MCCartridge
  id: MCCartridgeBR64
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeBR64
  - type: CartridgeAmmo
    proto: MCBulletBR64

- type: Tag
  id: MCCartridgeBR64

- type: entity
  parent: MCBullet
  id: MCBulletBR64
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 30
  - type: CMArmorPiercing
    amount: 25
    # base 15
    # xeno additional +10
