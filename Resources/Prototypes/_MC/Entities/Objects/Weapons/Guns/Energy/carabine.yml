- type: entity
  parent:
  - MCWeaponEnergy
  - MCWeaponMagazineVisuals
  id: MCWeaponEnergyCarbine
  name: Terra Experimental laser carbine (TE-C)
  description: "A TerraGov standard issue laser carbine, otherwise known as TE-C for short. It has an integrated charge selector for burst and scatter settings. Uses standard Terra Experimental (abbreviated as TE) power cells. As with all TE Laser weapons, they use a lightweight alloy combined without the need for bullets any longer decreases their weight and aiming speed quite some vs their ballistic counterparts. Has four firing modes: Auto Burst Standard, Spread, Impact, and Cripple."
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Energy/carabine.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Energy/carabine.rsi
  - type: Gun
    shotsPerBurst: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Fire/Laser/carbine_scatter.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    scatterWielded: 10
    scatterUnwielded: 1
    baseFireRate: 6.667 # 1 / 0.15
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.65
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  - type: WieldDelay
    baseDelay: 0.5
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Tactical Sensor
          # - TODO: Build a Sentry
      mc-attachment-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
          - MCAttachmentAngledGrip
          - MCAttachmentVerticalGrip
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentMiniFlamethrower
          - MCAttachmentUnderbarrelShotgun
          # - TODO: Underbarrel Pepper Gun
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 0.500000, 0.031250
      mc-attachment-underbarrel: 0.125000, -0.093750
      mc-attachment-stock: -0.375000, 0.031250
      mc-attachment-rail: 0.125000, 0.187500
  - type: MCWeaponLaser
    startingMode: Auto
    modes:
      Auto:
        shots: 40
        fireRate: 5
        projectileId: MCLaserCarabineAuto
        icon:
          sprite: _MC/Effects/Beams/base.rsi
          state: muzzle_beam
      Impact:
        shots: 12
        fireRate: 5
        projectileId: MCLaserCarabineImpact
        icon:
          sprite: _MC/Effects/Beams/overcharge.rsi
          state: muzzle_beam

- type: entity
  parent: MCLaser
  id: MCLaserCarabineAuto
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/base.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/base.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/base.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 1

- type: entity
  parent: MCLaser
  id: MCLaserCarabineImpact
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 35
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCStunOnHit
    knockback: 3
    knockbackSpeed: 20
    maxDistance: 6
