- type: entity
  parent:
  - MCWeaponEnergy
  - MCWeaponMagazineVisuals
  id: MCWeaponEnergyRifle
  name: Terra Experimental laser rifle (TE-R)
  description: "A Terra Experimental laser rifle, abbreviated as the TE-R. It has an integrated charge selector for normal and high settings. Uses standard Terra Experimental (abbreviated as TE) power cells. As with all TE Laser weapons, they use a lightweight alloy combined without the need for bullets any longer decreases their weight and aiming speed quite some vs their ballistic counterparts. Has four firemodes: Standard, Overcharge, Weakening, and Microwave."
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Energy/rifle.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Energy/rifle.rsi
  # Statistics
  - type: Gun
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Fire/Laser/rifle_standard.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    baseFireRate: 5
    # Scatter
    scatterWielded: 0
    scatterUnwielded: 10
  - type: WieldableSpeedModifiers
    base: 0.4
  - type: WieldDelay
    baseDelay: 0.7
  - type: RMCWeaponAccuracy
    accuracyMultiplierUnwielded: 0.55
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.2
  # Attachable
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Tactical Sensor
          # - TODO: Build a Sentry
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
          - MCAttachmentMiniFlamethrower
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.46875, 0.03125
      rmc-aslot-rail: -0.3125, 0.125
      rmc-aslot-underbarrel: 0.125, -0.125
  # Specials
  - type: MCWeaponLaser
    modes:
      Standard:
        shots: 50
        fireRate: 5
        projectileId: MCLaserRifleStandard
        icon:
          sprite: _MC/Effects/Beams/base.rsi
          state: muzzle_beam
      Overcharge:
        shots: 20
        fireRate: 2.2
        projectileId: MCLaserRifleOvercharge
        icon:
          sprite: _MC/Effects/Beams/overcharge.rsi
          state: muzzle_beam
      Weakening:
        shots: 20
        fireRate: 2.5
        projectileId: MCLaserRifleWeakening
        icon:
          sprite: _MC/Effects/Beams/weakening.rsi
          state: muzzle_beam
      Microwave:
        shots: 25
        fireRate: 2.2
        projectileId: MCLaserRifleMicrowave
        icon:
          sprite: _MC/Effects/Beams/microwave.rsi
          state: muzzle_beam

- type: entity
  parent: MCLaser
  id: MCLaserRifleStandard
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/base.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/base.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/base.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 1.5

- type: entity
  parent: MCLaser
  id: MCLaserRifleOvercharge
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/overcharge.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 40
  - type: CMArmorPiercing
    amount: 20
  - type: MCXenoSunderDamageOnHit
    amount: 2

- type: entity
  parent: MCLaser
  id: MCLaserRifleWeakening
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/weakening.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/weakening.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/weakening.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 5
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCStaminaDamageOnCollide
    damage: 15 # parity 30
  - type: MCXenoPlasmaDamageOnHit
    amount: 25
    multiplier: 0.05
  - type: MCStunOnHit
    slowdownTime: 1
    maxDistance: 6

- type: entity
  parent: MCLaser
  id: MCLaserRifleMicrowave
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/microwave.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/microwave.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/microwave.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 25
  - type: MCProjectileStatusEffectsOnHit
    statusEffects:
    - effectId: MCStatusEffectMicrowaved
      duration: 5
