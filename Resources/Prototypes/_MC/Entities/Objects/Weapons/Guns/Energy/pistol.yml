- type: entity
  parent:
  - MCWeaponEnergyBase
  - MCWeaponMagazineVisuals
  id: MCWeaponEnergyPistol
  name: Terra Experimental laser pistol (TE-P)
  description: The TE-P is a lightweight pistol with utility oriented alternative fire modes. The TE-P has a standard fire mode similar in performance to the P-14, a disabler fire mode for non-lethal takedowns, and a heat fire mode for setting targets on fire.
  components:
  - type: Tag
    tags:
    - MCWeaponSidearm
    - MCWeaponPistol
    - MCWeaponEnergyPistol
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Energy/pistol.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Energy/pistol.rsi
  - type: Gun
    shotsPerBurst: 1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Fire/Laser/pistol_standard.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    scatterWielded: 4
    scatterUnwielded: 2
    baseFireRate: 6.75
  - type: WieldDelay
    baseDelay: 0.4
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
          # - TODO: Pistol Lace
      rmc-aslot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
          - MCAttachmentMiniFlamethrower
  - type: AttachableHolderVisuals # I dont wanna do that :(
    offsets:
      rmc-aslot-barrel: 0.46875, 0.03125
      rmc-aslot-rail: -0.3125, 0.125
      rmc-aslot-underbarrel: 0.125, -0.125
  - type: MCWeaponLaser
    modes:
      Standard:
        shots: 30
        fireRate: 6.75
        projectileId: MCLaserPistolStandard
        icon:
          sprite: _MC/Effects/Beams/base.rsi
          state: muzzle_beam
      Heat:
        shots: 5
        fireRate: 2
        projectileId: MCLaserPistolHeat
        icon:
          sprite: _MC/Effects/Beams/heat.rsi
          state: muzzle_beam

- type: Tag
  id: MCWeaponEnergyPistol

- type: entity
  parent: MCLaser
  id: MCLaserPistolStandard
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/base.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/base.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/base.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 5
  - type: MCXenoSunderDamageOnHit
    amount: 1

- type: entity
  parent: MCLaser
  id: MCLaserPistolHeat
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/heat.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/heat.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/heat.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 0.5
  - type: IgniteOnProjectileHit
    intensity: 10
    duration: 10
