- type: entity
  parent:
  - MCWeaponEnergy
  - MCWeaponMagazineVisuals
  id: MCWeaponEnergyPistol
  name: Terra Experimental laser pistol (TE-P)
  description: The TE-P is a lightweight pistol with utility oriented alternative fire modes. The TE-P has a standard fire mode similar in performance to the P-14, a disabler fire mode for non-lethal takedowns, and a heat fire mode for setting targets on fire.
  components:
  - type: Tag
    tags:
    - MCWeaponSidearm
    - MCWeaponPistol
    - MCWeaponEnergyPistol
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Energy/pistol.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Energy/pistol.rsi
  - type: Gun
    shotsPerBurst: 1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Fire/Laser/pistol_standard.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    scatterWielded: 4
    scatterUnwielded: 2
    baseFireRate: 6.75
  - type: WieldDelay
    baseDelay: 0.4
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
          # - TODO: Pistol Lace
      mc-attachment-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
          - MCAttachmentMiniFlamethrower
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 0.312500, 0.125000
      mc-attachment-underbarrel: 0.250000, -0.218750
      mc-attachment-stock: -0.562500, 0.125000
      mc-attachment-rail: 0.031250, 0.218750
  - type: MCWeaponLaser
    modes:
      Standard:
        shots: 30
        fireRate: 6.75
        projectileId: MCLaserPistolStandard
        icon:
          sprite: _MC/Effects/Beams/base.rsi
          state: muzzle_beam
      Heat:
        shots: 5
        fireRate: 2
        projectileId: MCLaserPistolHeat
        icon:
          sprite: _MC/Effects/Beams/heat.rsi
          state: muzzle_beam

- type: Tag
  id: MCWeaponEnergyPistol

- type: entity
  parent: MCLaser
  id: MCLaserPistolStandard
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/base.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/base.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/base.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 5
  - type: MCXenoSunderDamageOnHit
    amount: 1

- type: entity
  parent: MCLaser
  id: MCLaserPistolHeat
  components:
  - type: MCLine
    tail:
      sprite: _MC/Effects/Beams/heat.rsi
      state: impact_beam
    body:
      sprite: _MC/Effects/Beams/heat.rsi
      state: beam
    head:
      sprite: _MC/Effects/Beams/heat.rsi
      state: muzzle_beam
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 0.5
  - type: IgniteOnProjectileHit
    intensity: 10
    duration: 10
