- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponRifleSFR7
  name: steel-force rifle
  description: A mosin nagant rifle, even just looking at it you can feel the cosmoline already. Commonly known by its slang, \"Moist Nugget\", by downbrained colonists and outlaws.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/sfr7/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/sfr7/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/sfr7/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_mosin.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/sniper_empty.ogg
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: RMCSelectiveFire
    selectedMode: SemiAuto
    baseFireModes:
    - SemiAuto
    baseFireRate: 0.8
    # Scatter
    scatterWielded: -1
    scatterUnwielded: 12
    # Recoil
    recoilWielded: 0
    recoilUnwielded: 4
  - type: BallisticAmmoProvider
    capacity: 5
    soundInsert:
      path: /Audio/_MC/Weapons/Guns/Reload/mosin_reload.ogg
    whitelist:
      tags:
      - MCCartridgeRifleSFR7
  - type: ShootUseDelay
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: WieldDelay
    baseDelay: 1.4
  # Attachable
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 1.0, 0.03
      mc-attachment-rail: 0.1, 0.0
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.8
    aimFireModifier: 0.7
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/working_the_bolt.ogg

# Cartridge
- type: stack
  id: MCCartridgeRifleSFR7
  name: stack-MCCartridgeRifleSFR7
  # handful of Steel Force high-velocity sniper cartridges (5.9x44mm SF-HV/SC)
  icon:
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/mosin.rsi
    state: base-1
  spawn: MCCartridgeRifleSFR7
  maxCount: 5

- type: entity
  parent: CMShellShotgunBase
  id: MCCartridgeRifleSFR7
  name: 5.9x44mm SF-HV/SC penetrator sniper cartridge
  description: A 5.9x44mm sniper cartridge with a partially telescoped design (SF-HV/SC type). Each round combines a dense tungsten-alloy core and a brittle reactive element; on impact, the element shatters, causing micro-cracks in armor and temporarily reducing its protective properties.
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeRifleSFR7
    - MCHandful
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/mosin.rsi
    layers:
    - state: base
      map: [ "base" ]
  - type: CartridgeAmmo
    proto: MCBulletRifleSFR7
  - type: Stack
    count: 5
    stackType: MCCartridgeRifleSFR7
    baseLayer: base
    layerStates:
    - base-1
    - base-1
    - base-2
    - base-3
    - base-4
    - base-5

- type: Tag
  id: MCCartridgeRifleSFR7

# Bullet
- type: entity
  parent: MCBullet
  id: MCBulletRifleSFR7
  name: 5.9mm SF-HV/SC penetrator bullet
  description: A heavy 5.9mm SF-HV/SC bullet with a reactive core. Its high-velocity dense core penetrates armor, while the shattered core causes micro-fractures that reduce armor effectiveness for a short time.
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 70
  - type: CMArmorPiercing
    amount: 50
    # base 35
    # xeno additional +15
  - type: MCXenoSunderDamageOnHit
    amount: 1
  - type: MCProjectileStatusEffectsOnHit
    statusEffects:
    - effectId: MCStatusEffectShatter
      duration: 8
