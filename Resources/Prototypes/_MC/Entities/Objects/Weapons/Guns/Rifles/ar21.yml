- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponRifleAR21
  name: AR-21 Kauser skirmish rifle
  description: The Kauser AR-21 is a versatile rifle is developed to bridge a gap between higher caliber weaponry and a normal rifle. It fires a strong 10x25mm round, which has decent stopping power. It however suffers in magazine size and movement capability compared to smaller peers.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar21/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar21/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar21/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar21/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_ar21.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    baseFireRate: 4
    # Scatter and recoil
    recoilWielded: 1
    recoilUnwielded: 0.6
    scatterWielded: 7
    scatterUnwielded: 20
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineRifleAR21
        insertSound: /Audio/_MC/Weapons/Guns/Reload/t21_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/t21_unload.ogg
        whitelist:
          tags:
          - MCMagazineRifleAR21
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: WieldDelay
    baseDelay: 0.8
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Tactical Sensor
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentAngledGrip
          - MCAttachmentBipod
          - MCAttachmentLaserSight
          - MCAttachmentVerticalGrip
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentMiniFlamethrower
          - MCAttachmentUnderbarrelShotgun
          - MCAttachmentGrenadeLauncher
          # - TODO: Mini Pepperball Gun
          # - TODO: PepperBall mini
          # - TODO: PP-7 Plasma Pistol
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.750000, 0.062500
      mc-slot-underbarrel: 0.375000, -0.062500
      mc-slot-rail: 0.093750, 0.156250
  # Specials
  - type: MCAimedShoot
    aimSpeedModifier: 0.95
    aimFireModifier: 0.625
    delay: 0.15

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineRifleAR21
  name: AR-21 skirmish rifle magazine
  description: A magazine filled with 10x25mm rifle rounds for the AR-21.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleAR21
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/ar21.rsi
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeRifleAR21
    proto: MCCartridgeRifleAR21
    capacity: 30

- type: Tag
  id: MCMagazineRifleAR21

- type: entity
  parent: CMBaseCartridgeRifle
  id: MCCartridgeRifleAR21
  name: патрон (10x25mm)
  description: Винтовочный патрон 10x25mm
  components:
  - type: Tag
    tags:
    - MCCartridgeRifleAR21
  - type: CartridgeAmmo
    proto: MCBulletRifleAR21

- type: Tag
  id: MCCartridgeRifleAR21

- type: entity
  parent: MCBullet
  id: MCBulletRifleAR21
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 30
  - type: CMArmorPiercing
    amount: 10
  - type: MCXenoSunderDamageOnHit
    amount: 1.25
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 7
      falloff: 5
    - range: 20
      falloff: 9999
      ignoreModifiers: true
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 8
      falloff: 10
