- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponRifleVGR
  name: vanguard rifle
  description: A lever action with room for a single round of .557/440 ball. Perfect for any kind of hunt, be it elephant or xeno with how quick to the draw it is.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/vgr/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/vgr/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/vgr/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_martinihenry.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/sniper_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    baseFireRate: 0.8
    # Scatter
    scatterWielded: -25
    scatterUnwielded: 20
    # Recoil
    recoilWielded: 2
    recoilUnwielded: 4
  - type: BallisticAmmoProvider
    capacity: 1
    soundInsert:
      path: /Audio/_MC/Weapons/Guns/Reload/martini_reload.ogg
    whitelist:
      tags:
      - MCCartridgeRifleVGR
  - type: ShootUseDelay
  - type: WieldableSpeedModifiers
    base: 1
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 1.2
  # Attachable
  - type: AttachableHolder
    slots:
      mc-attachment-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-attachment-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Build a sentry kit
          # - TODO: Tactical sensor
  - type: AttachableHolderVisuals
    offsets:
      mc-attachment-barrel: 0.937500, 0.125000
      mc-attachment-underbarrel: 0.343750, -0.062500
      mc-attachment-stock: -0.656250, -0.031250
      mc-attachment-rail: 0.187500, 0.156250
  # Specials
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/martini_cocked.ogg

# Box
- type: entity
  parent: MCStorageItem
  id: MCBoxRoundsRifleVGR
  name: box of Vanguard heavy sniper cartridges (8.4x49mm VG-HE)
  description: A box filled with Vanguard heavy sniper cartridges (8.4x49mm VG-HE).
  categories: [ MCContent ]
  components:
  - type: Tag
    tags:
    - MCBoxRoundsRifleVGR
  - type: Appearance
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Boxes/martini.rsi
    layers:
    - state: base-empty
    - state: base-full
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: base-full }
          False: { state: base-empty }
  - type: Item
    size: Small
  - type: RMCStorageEjectHand
    state: Last
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,7,1 # 4 slots
    whitelist:
      tags:
      - MCCartridgeRifleVGR
  - type: StorageFill
    contents:
    - id: MCCartridgeRifleVGR
      amount: 4
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: MCBoxRoundsRifleVGR
  id: MCBoxRoundsRifleVGRWhite
  name: box of Vanguard white-tipped heavy sniper cartridges (8.4x49mm VG-HE)
  description: A box filled with Vanguard white-tipped heavy sniper cartridges (8.4x49mm VG-HE).
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Boxes/martini_white.rsi
  - type: StorageFill
    contents:
    - id: MCCartridgeRifleVGRWhite
      amount: 4

- type: Tag
  id: MCBoxRoundsRifleVGR

# Cartridge
- type: stack
  id: MCCartridgeRifleVGR
  name: stack-MCCartridgeRifleVGR
  # handful of Vanguard heavy sniper cartridges (8.4x49mm VG-HE)
  icon:
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini.rsi
    state: base-1
  spawn: MCCartridgeRifleVGR
  maxCount: 5

- type: entity
  parent: CMShellShotgunBase
  id: MCCartridgeRifleVGR
  name: heavy 8.4x49mm VG-HE sniper cartridge
  description: An 8.4x49mm VG-HE sniper cartridge with a partially telescoped design. Each round combines a dense tungsten-alloy core and a high-energy charge, giving a single shot crushing power.
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeRifleVGR
    - MCHandful
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini.rsi
    layers:
    - state: base
      map: [ "base" ]
  - type: CartridgeAmmo
    proto: MCBulletRifleVGR
  - type: Stack
    count: 5
    stackType: MCCartridgeRifleVGR
    baseLayer: base
    layerStates:
    - base-1
    - base-1
    - base-2
    - base-3
    - base-4
    - base-5

- type: stack
  id: MCCartridgeRifleVGRWhite
  name: stack-MCCartridgeRifleVGRWhite
  # handful of Vanguard white-tipped heavy sniper cartridges (8.4x49mm VG-HE)
  icon:
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini_white.rsi
    state: base-1
  spawn: MCCartridgeRifleVGRWhite
  maxCount: 5

- type: entity
  parent: MCCartridgeRifleVGR
  id: MCCartridgeRifleVGRWhite
  name: heavy 8.4x49mm VG-HE white-tipped sniper cartridge
  description: A white-tipped 8.4x49mm VG-HE sniper cartridge with a heavy bullet. Each round contains a crushing core that fragments on impact; the cartridge is designed to disable armored targets.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/martini_white.rsi
  - type: CartridgeAmmo
    proto: MCBulletRifleVGRWhite
  - type: Stack
    stackType: MCCartridgeRifleVGRWhite

- type: Tag
  id: MCCartridgeRifleVGR

# Bullet
- type: entity
  parent: MCBullet
  id: MCBulletRifleVGR
  name: 8.4mm VG-HE heavy bullet
  description: A heavy 8.4mm bullet fired from a VG-HE cartridge. Its high-energy charge and dense core provide severe stopping power.
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 100
  - type: CMArmorPiercing
    amount: 50
    # base 20
    # xeno additional +30
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCStunOnHit
    maxDistance: 12
    paralyzeTime: 0.5
    slowdownTime: 0.5
    staggerTime: 1
    knockback: 2

- type: entity
  parent: MCBullet
  id: MCBulletRifleVGRWhite
  name: 8.4mm VG-HE white-tipped fragmenting bullet
  description: A heavy white-tipped 8.4mm bullet with an explosive filler, fired from a VG-HE cartridge. Its destructive charge fragments on impact, damaging armored targets.
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 100
  - type: CMArmorPiercing
    amount: 50
    # base 20
    # xeno additional +30
  - type: MCXenoSunderDamageOnHit
    amount: 0
  - type: MCProjectileStatusEffectsOnHit
    statusEffects:
    - effectId: MCStatusEffectShatter
      duration: 8
