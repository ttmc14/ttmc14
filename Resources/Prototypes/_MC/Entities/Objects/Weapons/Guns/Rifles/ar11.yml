- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponRifleAR11
  name: AR-11 K&H combat rifle
  description: The Keckler and Hoch AR-11 is the former standard issue rifle of the TGMC. Most of them have been mothballed into storage long ago, but some still pop up in marine or mercenary hands. It is known for its large magazine size and great burst fire, but rather awkward to use, especially during combat. It uses 4.92×34mm caseless HV ammunition.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar11/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar11/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar11/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar11/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_ar11.ogg
  - type: RMCSelectiveFire
    selectedMode: FullAuto
    baseFireModes:
    - FullAuto
    - Burst
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 4
    burstFireRateMultiplier: 6
    burstScatterMult: -2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_MC/Weapons/Guns/Reload/t42_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/t42_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleAR11
  - type: WieldableSpeedModifiers
    base: 0.625
  - type: WieldDelay
    baseDelay: 0.6
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-barrel:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          # - TODO: Tactical Sensor
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-barrel: 0.46875, 0.03125
      mc-slot-rail: -0.3125, 0.125
      mc-slot-underbarrel: 0.125, -0.125

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineRifleAR11
  name: AR-11 combat rifle magazine
  description: A magazine filled with 4.92x34mm rifle rounds for the AR-11.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleAR11
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/ar11.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeRifleAR11
    proto: MCCartridgeRifleAR11
    capacity: 70

- type: Tag
  id: MCMagazineRifleAR11

- type: entity
  parent: MCCartridge
  id: MCCartridgeRifleAR11
  components:
  - type: Tag
    tags:
    - MCCartridge
    - MCCartridgeRifleAR11
  - type: CartridgeAmmo
    proto: MCBulletRifleAR11

- type: Tag
  id: MCCartridgeRifleAR11

- type: entity
  parent: MCBullet
  id: MCBulletRifleAR11
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 20
  - type: CMArmorPiercing
    amount: 20
  - type: MCXenoSunderDamageOnHit
    amount: 1.25
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 24
      falloff: 9999
      ignoreModifiers: true
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 16
      falloff: 10
