  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleBR8
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/br8.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeRifleBR8
    proto: MCCartridgeRifleBR8
    capacity: 25

