- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponRifleBR8
  name: BR-8 scout rifle
  description: The BR-8 is a light specialized scout rifle, mostly used by light infantry and scouts. It's designed to be useable at all ranges by being very adaptable to different situations due to the ability to use different ammo types. Has IFF.  Takes specialized overpressured 10x28mm rounds.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/br8/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/br8/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/br8/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/br8/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_br64.ogg
  - type: GunIFF
    enabled: true
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    baseFireRate: 2.5
    # Scatter and recoil
    recoilWielded: 1
    recoilUnwielded: 0.6
    scatterWielded: 6
    scatterUnwielded: 24
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineRifleBR8
        insertSound: /Audio/_MC/Weapons/Guns/Reload/m4ra_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/m4ra_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleBR8
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 16
  - type: WieldableSpeedModifiers
    base: 0.95
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          # - TODO: M22
          # - TODO: Heavy Barrel
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          # - TODO: BuildSentryKit
          # - TODO: MotionDetector
          # - TODO: ShoulderGun
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGrenadeLauncher
          - MCAttachmentMiniFlamethrower
          - MCAttachmentLaserSight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentVerticalGrip
          - MCAttachmentAngledGrip
          - MCAttachmentBurstFireAssembly
          # - TODO: Attached TX-7
          # - TODO: PepperBall mini
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.718750, 0.125000
      mc-slot-underbarrel: 0.375000, 0.000000
      mc-slot-rail: 0.000000, 0.312500

