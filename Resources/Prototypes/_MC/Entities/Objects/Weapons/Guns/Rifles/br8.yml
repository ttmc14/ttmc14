- type: entity
  parent: [ MCWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: MCWeaponRifleBR8
  name: BR-8 scout rifle
  description: The BR-8 is a light specialized scout rifle, mostly used by light infantry and scouts. It's designed to be useable at all ranges by being very adaptable to different situations due to the ability to use different ammo types. Has IFF.  Takes specialized overpressured 10x28mm rounds.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/br8.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifle/br8.rsi
  - type: GunIFF
    enabled: true
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_br64.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    scatterWielded: 0
    scatterUnwielded: 20
    recoilWielded: 0
    recoilUnwielded: 0
    modifiers:
      FullAuto:
        maxScatterModifier: 10
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 7
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 1
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  - type: WieldDelay
    baseDelay: 0.7
  - type: GunRequiresWield
  - type: WieldableSpeedModifiers
    base: 0.875
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineRifleBR8
        insertSound: /Audio/_MC/Weapons/Guns/Reload/m4ra_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/m4ra_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleBR8
          - MCMagazineRifleBR8AP
          - MCMagazineRifleBR8Incendiary
          - MCMagazineRifleBR8Impact
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          # - TODO: M22
          # - TODO: Heavy Barrel
      rmc-aslot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          # - TODO: BuildSentryKit
          # - TODO: MotionDetector
          # - TODO: ShoulderGun
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGrenadeLauncher
          - MCAttachmentMiniFlamethrower
          - MCAttachmentLaserSight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentVerticalGrip
          - MCAttachmentAngledGrip
          - MCAttachmentBurstFireAssembly
          # - TODO: Attached TX-7
          # - TODO: PepperBall mini
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.4375, 0.03125
      rmc-aslot-rail: -0.28125, 0.25
      rmc-aslot-underbarrel: -0.09375, -0.125

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineRifleBR8
  name: high velocity magazine (10x28mm)
  description: A magazine of overpressured high velocity rounds for use in the BR-8 battle rifle. The BR-8 battle rifle is the only gun that can chamber these rounds.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleBR8
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - MCCartridgeRifleBR8
    proto: MCCartridgeRifleBR8AP
    capacity: 25
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/br8.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Appearance

