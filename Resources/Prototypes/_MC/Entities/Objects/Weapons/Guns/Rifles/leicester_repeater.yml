- type: entity
  parent: MCWeaponShotgun
  id: MCWeaponShotgunLeicesterRepeater
  name: Leicester Repeater
  description: The gun that won the west or so they say. But space is a very different kind of frontier all together, chambered for .45-70 Governemnt.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/leicrep/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/leicrep/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/leicrep/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_repeater.ogg
  - type: RMCSelectiveFire
    recoilWielded: 3
    recoilUnwielded: 5
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 1
    burstScatterMult: 5
  - type: BallisticAmmoProvider
    capacity: 14
    soundInsert:
      path: /Audio/_MC/Weapons/Guns/Reload/mosin_reload.ogg
    whitelist:
      tags:
      - MCCartridgeGovernmentRounds
  - type: PumpAction
    sound:
      path: /Audio/_MC/Weapons/Guns/Pump/ak47_cocked.ogg
  - type: ShootUseDelay
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.8
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentBayonet
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Tactical Sensor
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentVerticalGrip
          - MCAttachmentAngledGrip
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.812500, 0.156250
      mc-slot-underbarrel: 0.250000, -0.062500
      mc-slot-rail: 0.468750, 0.187500

- type: entity
  parent: MCBullet
  id: MCBulletGovernmentRounds
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        MCBrute: 70
  - type: CMArmorPiercing
    amount: 20
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 1
  - type: RMCProjectileAccuracy
    accuracy: 90
    thresholds:
    - range: 14
      falloff: 10
  - type: MCStunOnHit
    staggerTime: 1
    slowdownTime: 2
    maxDistance: 3

- type: entity
  parent: RMCBoxShotgunBase
  id: MCBoxGovernmentRounds
  name: packet of .45-70
  description: A packet containing 50 rounds of .45-70 Government.
  categories: [ MCContent ]
  components:
  - type: Tag
    tags:
    - MCBoxGovernmentRounds
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Boxes/leicerep.rsi
    layers:
    - state: leicerep_full
      map: [ "full" ]
    - state: leicerep_empty
      map: [ "empty" ]
  - type: Item
    size: Small
  - type: RMCStorageEjectHand
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,11,1 # 6 slots
    whitelist:
      tags:
      - MCCartridgeGovernmentRounds
  - type: StorageFill
    contents:
    - id: MCCartridgeGovernmentRounds
      amount: 6

- type: Tag
  id: MCBoxGovernmentRounds

- type: entity
  parent: CMShellShotgunBase
  id: MCCartridgeGovernmentRounds
  name: handful of heavy impact rifle bullet (.45-70 Government)
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/leicerep.rsi
    layers:
    - state: base
      map: [ "base" ]
  - type: CartridgeAmmo
    proto: MCBulletGovernmentRounds
  - type: Stack
    count: 8
    stackType: MCCartridgeGovernmentRounds
    baseLayer: base
    layerStates:
    - base-1
    - base-1
    - base-2
    - base-3
    - base-4
    - base-5
    - base-6
    - base-7
    - base-8
  - type: Tag
    tags:
    - MCHandful
    - MCCartridge
    - MCCartridgeGovernmentRounds

- type: Tag
  id: MCCartridgeGovernmentRounds

- type: stack
  id: MCCartridgeGovernmentRounds
  name: handful of heavy impact rifle bullet (.45-70 Government)
  icon:
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Handful/leicerep.rsi
    state: base-1
  spawn: MCCartridgeGovernmentRounds
  maxCount: 8
