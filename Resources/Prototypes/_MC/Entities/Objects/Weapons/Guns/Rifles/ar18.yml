- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponRifleAR18
  name: AR-18 Kauser carbine
  description: The Keckler and Hoch AR-18 carbine is one of the standard rifles used by the TerraGov Marine Corps. It's commonly used by people who prefer greater mobility in combat, like scouts and other light infantry. Uses 10x24mm caseless ammunition.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar18/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar18/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar18/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar18/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 4
    soundGunshot:
      path: /Audio/_MC/Weapons/Guns/Gunshots/gun_ar18.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    - Burst
    baseFireRate: 5
    # Scatter
    scatterWielded: 0
    # Modifiers
    modifiers:
      Burst:
        fireDelay: 0.1
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MCMagazineRifleAR18
        insertSound: /Audio/_MC/Weapons/Guns/Reload/t18_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/t18_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleAR18
  - type: WieldableSpeedModifiers
    base: 0.95
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.05
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.9
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-muzzle:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          - MCAttachmentMuzzleCharger
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          - MCAttachmentT47RailScope
          # - TODO: Tactical Sensor
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGrenadeLauncher
          - MCAttachmentMiniFlamethrower
          - MCAttachmentLaserSight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentVerticalGrip
          - MCAttachmentAngledGrip
          - MCAttachmentBurstFireAssembly
          - MCAttachmentUnderbarrelShotgun
          # - TODO: PP-7 Plasma Pistol
          # - TODO: PepperBall mini
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-muzzle: 0.687500, 0.062500
      mc-slot-underbarrel: 0.375000, -0.031250
      mc-slot-rail: -0.156250, 0.156250

- type: entity
  parent: MCMagazineRifle
  id: MCMagazineRifleAR18
  name: AR-18 magazine (10x24mm)
  description: A 10mm carbine magazine.
  components:
  - type: Tag
    tags:
    - MCMagazineRifle
    - MCMagazineRifleAR18
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/ar18.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeRifleAR12
    proto: MCCartridgeRifleAR12
    capacity: 36

- type: Tag
  id: MCMagazineRifleAR18

- type: entity
  parent: MCMagazineRifleAR18
  id: MCMagazineRifleAR18AP
  name: AR-18 AP magazine (10x24mm)
  description: A 10mm assault carbine magazine, loaded with light armor piercing rounds.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Ammunition/Magazines/ar18_AP.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - MCCartridgeRifleAR12AP
    proto: MCCartridgeRifleAR12AP
    capacity: 36
