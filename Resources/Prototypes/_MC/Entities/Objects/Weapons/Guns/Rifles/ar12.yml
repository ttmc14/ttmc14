- type: entity
  parent:
  - MCWeaponRifle
  - MCWeaponMagazineVisuals
  id: MCWeaponRifleAR12
  name: AR-12 K&H assault rifle
  description: The Keckler and Hoch AR-12 assault rifle used to be the TerraGov Marine Corps standard issue rifle before the AR-18 carbine replaced it. It is, however, still used widely despite that. The gun itself is very good at being used in most situations however it suffers in engagements at close quarters and is relatively hard to shoulder than some others. It uses 10x24mm caseless ammunition.
  components:
  # Visuals
  - type: Sprite
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar12/inhands.rsi
    layers:
    - state: base
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar12/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _MC/Objects/Weapons/Guns/Rifles/ar12/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _MC/Objects/Weapons/Guns/Rifles/ar12/inhands.rsi
  # Statistics
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      collection: MCAR12Shoot
  - type: RMCSelectiveFire
    selectedMode: FullAuto
    baseFireModes:
    - FullAuto
    - Burst
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 5
    burstFireRateMultiplier: 6
    burstScatterMult: -2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_MC/Weapons/Guns/Reload/t18_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/t18_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCMagazineRifleAR12
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: WieldDelay
    baseDelay: 0.7
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0.5
  # Attachable
  - type: AttachableHolder
    slots:
      mc-slot-barrel:
        whitelist:
          tags:
          - MCAttachmentExtendedMuzzle
          - MCAttachmentSuppressor
          - MCAttachmentBayonet
          - MCAttachmentRecoilCompensator
          # - TODO: M22
          # - TODO: Heavy Barrel
      mc-slot-rail:
        whitelist:
          tags:
          - MCAttachmentMagneticHarness
          - MCAttachmentRailFlashlight
          - MCAttachmentMiniScope
          - MCAttachmentRedDotSight
          # - TODO: BuildSentryKit
          # - TODO: MotionDetector
          # - TODO: ShoulderGun
      mc-slot-underbarrel:
        whitelist:
          tags:
          - MCAttachmentUnderbarrelFlashlight
          - MCAttachmentGrenadeLauncher
          - MCAttachmentMiniFlamethrower
          - MCAttachmentLaserSight
          - MCAttachmentGyroscopicStabilizer
          - MCAttachmentBipod
          - MCAttachmentVerticalGrip
          - MCAttachmentAngledGrip
          - MCAttachmentBurstFireAssembly
          - MCAttachmentUnderbarrelShotgun
          # - TODO: Attached TX-7
          # - TODO: PepperBall mini
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-barrel: 0.4375, 0.03125
      mc-slot-rail: -0.28125, 0.25
      mc-slot-underbarrel: -0.09375, -0.125

- type: entity
