- type: entity
  parent: MCGrenadePremade
  id: MCRazorburnGrenade
  name: razorburn grenade
  description: An emergency tool used for patching hull breaches with special quick-set metal foam. Almost as good as real floors!
  components:
  - type: Tag
    tags:
    - MCGrenade
    - MCGrenadeRazorburn
  - type: Sprite
    sprite: _MC/Objects/Weapons/Grenades/rg.rsi
  - type: OnUseTimerTrigger
    delay: 5
  - type: SpawnOnTerminate
    spawn: MCSmokeRazorburn
    projectileAdjust: false
  - type: DeleteOnTrigger
  - type: SoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/Smoke-grenade.ogg

- type: Tag
  id: MCGrenadeRazorburn

- type: entity
  parent: MCRazorburnGrenade
  id: MCRazorburnGrenadeLarge
  name: razorburn canister
  description: An emergency tool used for patching hull breaches with special quick-set metal foam. Almost as good as real floors!
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Grenades/rgl.rsi
  - type: SpawnOnTerminate
    spawn: MCSmokeRazorburnLarge
