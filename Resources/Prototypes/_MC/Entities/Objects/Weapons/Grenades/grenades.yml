    delay: 2
  - type: Sprite
    sprite: _MC/Objects/Weapons/Grenades/pgas.rsi
  - type: SpawnOnTerminate
    spawn: MCSmokeTanglefoot
    projectileAdjust: false
  - type: SoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
  - type: DeleteOnTrigger
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/Smoke-grenade.ogg
  - type: Tag
    tags:
    - MCGrenade
    - MCGrenadePGas
  - type: Ammo

- type: Tag
  id: MCGrenadePGas

# Case's
- type: entity
  parent: MCCase
  id: MCCaseGrenade
  abstract: true
  components:
  - type: Sprite
    sprite: _MC/Objects/Items/case.rsi
    layers:
    - map: [ "full" ]
      state: grenade_case
    - map: [ "empty" ]
      state: empty_case
      visible: false
  - type: Icon
    sprite: _MC/Objects/Items/case.rsi
    state: grenade_case
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,11,1
    whitelist:
      tags:
      - MCGrenade
  - type: FixedItemSizeStorage

- type: entity
  parent: MCCaseGrenade
  id: MCCaseGrenadeHedp
  name: HEDP grenade case
  description: A secure box holding 25 M40 HEDP grenades. High explosive, don't store near the flamer fuel.
  components:
  - type: StorageFill
    contents:
    - id: MCGrenadeHedp
      amount: 25

- type: entity
