# hidp
- type: entity
  parent: MCGrenade
  id: MCGrenadeHidp
  name: M40 HIDP incendiary grenade
  description: The M40 HIDP is a small, but deceptively strong incendiary grenade. It is set to detonate in 4 seconds.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/Grenades/hidp.rsi
  - type: OnUseTimerTrigger
    beepSound: null
  - type: CMVocalizeTrigger
  - type: TileFireOnTrigger
    range: 2
    diagonalRange: 1
    spawn: MCFireHidp
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg
  - type: Tag
    tags:
    - MCGrenade
    - MCGrenadeHidp

- type: Tag
  id: MCGrenadeHidp

- type: entity
  parent: MCGrenade
  id: MCGrenadePGas
  name: M40-T smoke grenade
  description: The M40-T is a small, but powerful Tanglefoot grenade, designed to remove plasma with minimal side effects. Based off the same platform as the M40 HEDP. It is set to detonate in 6 seconds.
