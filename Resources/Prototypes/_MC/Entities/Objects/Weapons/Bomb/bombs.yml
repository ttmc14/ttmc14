- type: entity
  parent: BaseItem
  id: MCBaseHardBomb
  description: Just keep talking and nobody will explode.
  name: hardbomb
  components:
    - type: Appearance
    - type: WiresVisuals
    - type: InteractionOutline
    - type: UserInterface
      interfaces:
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
        enum.MCBombPasswordUi.Key:
          type: MCBombPasswordBui
    - type: Wires
      layoutId: Defusable
      alwaysRandomize: true
    - type: Defusable
    - type: Rotatable
    - type: Explosive
      explosionType: MC
      totalIntensity: 20.0
      intensitySlope: 5
      maxIntensity: 4
#    - type: Sticky
#      stickDelay: 5
#      unstickDelay: 5
    - type: ExplodeOnTrigger
    - type: MCOnUseTimerTrigger
      delay: 240
      delayOptions: [40, 120, 240, 300, 600]
#      startOnStick: true
      initialBeepDelay: 0
      beepSound: /Audio/Machines/timer.ogg
    - type: Anchorable
      delay: 5
    - type: WiresPanel
    - type: MCBombPassword

- type: entity
  parent: MCBaseHardBomb
  id: MCC4Bomb
  name: C-4 bomb
  description: A block of C-4 plastic explosive, commonly used by military and special forces for demolition purposes. Highly stable and safe to handle, it requires a detonator to explode.
  components:
    - type: Item
      size: Large
    - type: Sprite
      sprite: _MC/Objects/Weapons/Bomb/c4_bomb.rsi
      layers:
        - state: icon
        - state: active
          visible: false
          map: [ "primed" ]
        - state: wires
          visible: false
          map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - type: GenericVisualizer
      visuals:
        enum.DefusableVisuals.Active:
          primed:
            True: { visible: true }
            False: { visible: false }
        enum.WiresVisualLayers.MaintenancePanel:
          enum.WiresVisualLayers.MaintenancePanel:
            True: { visible: true }
            False: { visible: false }
    - type: PointLight
      color: "#C7001B"
      radius: 1.1
      softness: 1
    - type: FlashOnTrigger
      range: 50
    - type: Explosive
      explosionType: MCHardBomb
      totalIntensity: 15000.0
      intensitySlope: 5
      maxIntensity: 400
    - type: TileFireOnTrigger
      range: 10
      spawn: MCFire
      sound:
        path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg
        volume: 5

- type: entity
  parent: MCC4Bomb
  id: MCC4BombDebug
  suffix: DEBUG
  description: A block of C-4 plastic explosive, commonly used by military and special forces for demolition purposes. Highly stable and safe to handle, it requires a detonator to explode.
  components:
    - type: Defusable
      disposable: true
    - type: MCOnUseTimerTrigger
      delay: 10
      delayOptions: [10, 20, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300]

- type: entity
  parent: BasePlasticExplosive
  id: MCC4ExplosionPackage
  name: C-4 explosion package
  description: An explosive device used to break into areas while protecting the user from the blast as well as deploying deadly shrapnel on the other side.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/plastic_explosives.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: Sticky
    stickDelay: 3
    unstickDelay: 3
    stickPopupStart: comp-sticky-start-stick-bomb
    stickPopupSuccess: comp-sticky-success-stick-bomb
    unstickPopupStart: comp-sticky-start-unstick-bomb
    unstickPopupSuccess: comp-sticky-success-unstick-bomb
    blacklist:
      components:
      - Item
  - type: MCOnUseTimerTrigger
    delay: 10
    delayOptions: [1, 5, 10, 15]
    initialBeepDelay: 5
    beepSound: /Audio/Machines/timer.ogg
    startOnStick: true
    canToggleStartOnStick: true
  - type: TimerStartOnSignal
  - type: DeviceLinkSink
    ports:
    - Timer
  - type: Explosive
    explosionType: MC
    totalIntensity: 150
    intensitySlope: 5
    maxIntensity: 50
    canCreateVacuum: false
  - type: RMCExplosiveDelete # фикс
    delay: 10
    whitelist:
      components:
      - XenoTunnel
      - RMCWallExplosionDeletable
  - type: ExplodeOnTrigger
  - type: StickyVisualizer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        base:
          Primed: { state: active }
          Unprimed: { state: icon }
  - type: Tag
    tags:
    - MCC4ExplosionPackage

- type: Tag
  id: MCC4ExplosionPackage
