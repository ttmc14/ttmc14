- type: entity
  parent: MCXenoProjectile
  id: MCXenoProjectileGlob
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: boiler_gas
      shader: unshaded
  - type: CMArmorPiercing
    amount: 40
  - type: XenoProjectile
    deleteOnFriendlyXeno: false
  - type: ProjectileMaxRange
    max: 30
  - type: MCXenoProjectileTargetingTurf
  - type: XenoSlowingSpitProjectile
    paralyze: 1
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        - BarricadeImpassable
        - XenoProjectileImpassable

- type: entity
  parent: MCXenoProjectileGlob
  id: MCXenoProjectileGlobAcid
  name: glob of acid
  components:
  - type: Sprite
    layers:
    - state: boiler_gas
      shader: unshaded
  - type: Projectile
    damage:
      types:
        MCBurn: 50
  - type: MCXenoSpawnAcidSprayOnTerminating
    spawn: MCSmokeXenoAcid

- type: entity
  parent: MCXenoProjectile
  id: MCXenoProjectileGlobNeurotoxin
  name: glob of neurotoxin
  components:
  - type: Sprite
    layers:
    - state: boiler_gas2
      shader: unshaded
  - type: Projectile
    damage:
      types: null
  - type: MCStaminaDamageOnCollide
    damage: 50
  - type: MCProjectileInject
    reagents:
    - ReagentId: MCNeurotoxin
      Quantity: 30
  - type: MCXenoSpawnAcidSprayOnTerminating
    spawn: MCSmokeXenoNeurotoxinBoiler

