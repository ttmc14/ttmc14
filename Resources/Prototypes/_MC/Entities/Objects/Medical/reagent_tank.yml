- type: entity
  parent: [ StorageTank, StructureWheeled ]
  id: MCTankReagentEmpty
  name: reagent tank
  description: A reagent tank, typically used to store large quantities of chemicals.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/reagent_tank.rsi
    layers:
    - state: tank_normal
    - state: tn_color-1
    - state: tn_color-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: t_inactive
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 155
        mask:
        - MachineMask
        - HighImpassable
        layer:
        - HighImpassable
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: tn_color-
  - type: DetailedExaminableSolution
    solution: tank
  - type: RMCToggleableSolutionTransfer
    solution: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1200
  - type: Corrodible
    timeToApply: 4
    structure: true
  - type: Tag
    tags:
    - RMCTankReagent
    - Structure
  - type: RMCMesonsNonviewable

- type: entity
  parent: MCTankReagentEmpty
  id: MCTankReagentFuel
  name: fuel tank
  description: A fuel tank, normally used to hold welding fuel. It's painted red with explosive warning labels.
  suffix: MCFuel
  components:
  - type: Sprite
    layers:
    - state: weldtank
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1000
  - type: Explosive
    explosionType: MC
    totalIntensity: 60
  - type: ReagentTank
    tankType: Fuel
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:SpawnEntitiesBehavior
        spawn:
          MCFire: { min: 100, max: 100 }
        offset: 4.4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 100
  - type: Label
    currentLabel: reagent-name-welding-fuel
  - type: Tag
    tags:
    - MCTankFuel
    - MCTankReagent

