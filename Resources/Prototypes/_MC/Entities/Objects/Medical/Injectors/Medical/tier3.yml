- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorQuickClotPlus
  name: quick-clot plus auto-injector
  description: An auto-injector loaded with 3 uses of quick-clot plus, a chemical designed to remove internal bleeding. Use with antitoxin. !DO NOT USE IN ACTIVE COMBAT!
  components:
  - type: Hypospray
    transferAmount: 5
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: MCQuickClotPlus
          Quantity: 15
  - type: IconLabel
    labelTextLocId: mc-quickclotplus-container-label-text

- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorRussianRed
  name: russian red autoinjector
  description: An autoinjector loaded with 3 doses of Russian Red. Restores a significant amount of stamina and heals a large amount of damage, but causes slight permanent damage.
  components:
  - type: Hypospray
    transferAmount: 10
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: MCRussianRed
          Quantity: 30
  - type: IconLabel
    labelTextLocId: mc-russian-red-container-label-text
