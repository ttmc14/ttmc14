- type: entity
  parent: MCPillCanister
  id: MCPillCanisterMeralyne
  name: meralyne pill bottle
  description: Contains pills that heal cuts and bruises, but cause slight pain. Take two to heal faster, but have slightly more pain.
  components:
  - type: Item
    heldPrefix: 8
  - type: Sprite
    layers:
    - state: pill_canister8
      map: [ "bottleSurfaceLayer" ]
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: StorageFill
    contents:
    - id: MCPillMeralyne
      amount: 16
  - type: IconLabel
    labelTextLocId: mc-meralyne-container-label-text

