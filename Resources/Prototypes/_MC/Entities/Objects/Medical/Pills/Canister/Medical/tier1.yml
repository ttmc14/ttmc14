- type: entity
  parent: MCPillCanister
  id: MCPillCanisterBicaridine
  name: bicaridine pill bottle
  description: Contains pills that heal cuts and bruises, but cause slight pain. Take two to heal faster, but have slightly more pain.
  components:
  - type: Item
    heldPrefix: 11
  - type: Sprite
    layers:
    - state: pill_canister11
      map: [ "bottleSurfaceLayer" ]
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: StorageFill
    contents:
    - id: MCPillBicaridine
      amount: 16
  - type: IconLabel
    labelTextLocId: mc-bicaridine-container-label-text

