- type: entity
  parent: MCPillCanister
  id: MCPillCanisterCombatMix
  name: combat mix pill bottle
  description: ...
  suffix: 16
  components:
  - type: Item
    heldPrefix: 2
  - type: Sprite
    layers:
    - state: pill_canister0
      map: [ "bottleSurfaceLayer" ]
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: StorageFill
    contents:
    - id: MCPillCombatMix
      amount: 16
  - type: IconLabel
    labelTextLocId: mc-combat-mix-container-label-text

