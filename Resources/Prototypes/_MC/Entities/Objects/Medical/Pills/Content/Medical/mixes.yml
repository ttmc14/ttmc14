    solutions:
      food:
        maxVol: 7.5
        reagents:
        - ReagentId: MCMeralyne
          Quantity: 3.75
        - ReagentId: MCDermaline
          Quantity: 3.75
  - type: Sprite
    layers:
    - state: pill20
      map: [ "enum.DamageStateVisualLayers.Base" ]
