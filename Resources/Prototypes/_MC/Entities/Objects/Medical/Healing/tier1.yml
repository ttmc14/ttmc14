- type: entity
  parent: MCHealing
  id: MCHealingSplint
  name: medical splints
  description: Used to stabilize broken bones.
  components:
  - type: Tag
    tags:
    - MCHealing
    - MCHealingSplint
  - type: Sprite
    state: splint
  - type: Item
    heldPrefix: splint
  - type: Stack
    stackType: MCHealingSplint
    count: 5
  - type: WoundTreater
    wound: Brute
    treats: true
    group: Brute
    consumable: true
    damage: -40
    unskilledDamage: -30
    canUseUnskilled: true
    skills:
      MCSkillMedical: 2
    treatBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    treatEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
    userPopup: cm-trauma-kit-user-popup
    targetPopup: cm-trauma-kit-target-popup
    othersPopup: cm-trauma-kit-others-popup
    noneSelfPopup: cm-trauma-kit-none-self-popup
    noneOtherPopup: cm-trauma-kit-none-other-popup
    noWoundsOnUserPopup: cm-wounds-already-treated-self-popup
    noWoundsOnTargetPopup: cm-wounds-already-treated-target-popup
  - type: MedicallyUnskilledDoAfter
    min: 1
    skilledDelay: 5
    doAfter: 5

- type: stack
  id: MCHealingSplint
