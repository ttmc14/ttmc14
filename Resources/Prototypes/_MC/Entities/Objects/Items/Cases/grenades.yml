- type: entity
  parent: MCStorageCase
  id: MCStorageCaseGrenade
  abstract: true
  components:
  - type: Sprite
    sprite: _MC/Objects/Items/Cases/box.rsi
    state: base-grenades
  - type: Icon
    sprite: _MC/Objects/Items/Cases/box.rsi
    state: base-grenades
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,13,7 # 25 slots
    whitelist:
      tags:
      - MCGrenade
  - type: FixedItemSizeStorage

- type: entity
  parent: MCStorageCaseGrenade
  id: MCStorageCaseGrenadeHedp
  name: hedp grenade case
  description: A secure box holding 25 M40 HEDP grenades. High explosive, don't store near the flamer fuel.
  components:
  - type: StorageFill
    contents:
