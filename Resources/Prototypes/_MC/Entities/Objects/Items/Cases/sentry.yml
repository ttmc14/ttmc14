- type: entity
  parent: MCStorageCase
  id: MCStorageCaseSentry
  abstract: true
  components:
  - type: Sprite
    sprite: _MC/Objects/Items/Cases/box.rsi
    state: base-sentry
  - type: Icon
    sprite: _MC/Objects/Items/Cases/box.rsi
    state: base-sentry
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,1 # 2 slots
    whitelist:
      tags:
      - MCSentry
      - MCMagazineSentry
  - type: FixedItemSizeStorage
  - type: LimitedStorage
    limits:
    - popup: mc-storage-limit-one-sentry
      count: 1
      whitelist:
        components:
        - MCSentry
    - popup: mc-storage-limit-magazines
      count: 1
      whitelist:
        tags:
        - MCMagazineSentry

- type: entity
  parent: MCStorageCaseSentry
  id: MCStorageCaseSentryFilledBase
  name: ST-571 sentry case
  description: A large case containing all you need to set up an automated sentry.
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: MCSentryBig
    - id: MCMagazineSentryBig

