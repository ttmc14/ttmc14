- type: entity
  parent: MCArmorModule
  id: MCArmorModuleHelmetAntenna
  name: HM-9 antenna helmet module
  description: Designed for mounting on a modular Helmet. This module is able to provide a readout of the user's coordinates and connect to the shipside supply console and shield against the interference of caves, allowing for normal messaging in shallow caves, and only minor interference when deep.
  components:
  - type: Tag
    tags:
    - MCArmorModule
    - MCArmorModuleHead
  - type: Sprite
    state: antenna_head
  - type: MCArmorModule
    visuals:
      sprite: _MC/Clothing/modular.rsi
      state: antenna_head_a

