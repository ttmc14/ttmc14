- type: entity
  parent: MCArmorModule
  id: MCArmorModuleMark1TyrArmor
  name: tyr Mk.1 armor reinforcement system
  description: Designed for mounting on modular armor. A substantial amount of additional armor plating designed to grant the user extra protection against threats, ranging from xeno slashes to friendly fire incidents. This older version has worse protection. Will greatly impact mobility.
  components:
  - type: Tag
    tags:
    - MCArmorModule
    - MCArmorModuleBody
  - type: Sprite
    state: mod_armor_lower
  - type: MCArmorModule
    visuals:
      sprite: _MC/Clothing/modular.rsi
      state: mod_armor_lower_a
  - type: MCArmor
    soft:
      melee: 10
      bullet: 10
      laser: 10
      energy: 10
      bomb: 10
      bio: 10
      fire: 10
      acid: 10
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85

- type: entity
  parent: MCArmorModule
  id: MCArmorModuleMark1TyrArmorHelmet
  name: tyr Mk.1 armor reinforcement system helmet module
