- type: Tag
  id: MCPowerCell

- type: entity
  parent: MCItem
  id: MCPowerCell
  name: power cell
  description: A rechargeable electrochemical power cell.
  suffix: charged
  components:
  - type: Tag
    tags:
    - MCPowerCell
  - type: Appearance
  - type: Sprite
    sprite: _MC/Objects/Power/Cells/base.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: base
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: charge-5
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: PowerCell
    powerCellVisualsLevels: 5
  - type: PowerCellVisuals
    chargePrefix: charge-
  - type: Riggable

- type: entity
  parent: MCPowerCell
  id: MCPowerCellNoPower
  suffix: no power
  components:
  - type: Battery
    maxCharge: 1000
    startingCharge: 0
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: base
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: charge-1
      shader: unshaded
