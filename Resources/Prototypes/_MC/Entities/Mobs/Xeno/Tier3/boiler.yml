- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentBoilerGlob
  - MCXenoComponentTier3
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoBoiler
  name: boiler
  description: Gross!
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-boiler
  - type: GhostRole
    name: mc-job-name-xeno-boiler
  - type: RMCActionOrder
    id: MCXenoBoiler
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/boiler.rsi
    offset: 0, 0.35
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: boiler
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/boiler_rouny.rsi
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoBoiler
    actionIds:
    # Base
    - MCActionXenoHiveStatus
    - MCActionXenoRest
    - MCActionXenoPsydrain
    # Construction
    - MCActionXenoPlaceAcidWell
    # Abilities
    - MCActionXenoSelectReagent
    - MCActionXenoSprayAcidBoiler
    - MCActionXenoBoilerLongRange
    - MCActionXenoCreateGlob
    - MCActionXenoBombard
    - MCActionXenoAcidShroud
    # Utilities
    - MCActionXenoAcidStrong
    - MCActionXenoPlaceTrap
    hudOffset: -0.15, 0.25
  # Evolution
  - type: XenoEvolution
    actionId: MCActionXenoEvolve
    strains:
    - MCXenoBoilerSmoker
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      325: Critical
      425: Dead
  - type: XenoPlasma
    plasma: 1000
    maxPlasma: 1000
    plasmaRegenOnWeeds: 50
  - type: MCArmor
    soft:
      melee: 45
      bullet: 45
      laser: 45
      energy: 45
      bomb: 0
      bio: 35
      fire: 45
      acid: 35
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.25
  - type: RMCSize
    size: Big
  - type: AcidBloodSplash
    damage:
      types:
        MCBurn: 30
    minimalTriggerDamage: 5
    baseHitProbability: 100
    baseSplashTriggerProbability: 40
    splashCooldown: 0.05
  # Utilities
  - type: MCXenoPlaceStructure
  - type: AcidTrap # TODO: Make MC component
    trapLevel: 3
    spray: XenoAcidSprayTrapStrong # TODO: Acid gas boiler trap
  # Abilities
  - type: MCXenoZoom
    zoom: 1.5, 1.5
    offsetLength: 5
    doAfter: 1
  - type: XenoAcid # TODO: Make MC component
  - type: XenoSprayAcid # TODO: Make MC component
    acid: MCXenoAcidSprayBoiler
    range: 7
    doAfter: 0.5
    barricadeDamage:
      types:
        MCBurn: 45
  - type: MCXenoBombard
  - type: MCXenoAcidShroud

# Strains
- type: entity
  parent:
  - MCXenoComponentBoilerGlobExtended
  - MCXenoBoiler
  id: MCXenoBoilerSmoker
  name: smoker
  description: I can't breath!
  components:
  - type: XenoHidden
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-boiler-smoker
  - type: GhostRole
    name: mc-job-name-xeno-boiler-smoker
  - type: RMCActionOrder
    id: MCXenoRavagerSmoker
  # Evolution
  - type: XenoEvolution
    strains: []
  # Statistics
  - type: RMCSize
    size: Xeno
  # Abilities
  - type: MCXenoGlob
    countMax: 7

# Components
- type: entity
  id: MCXenoComponentBoilerGlob
  abstract: true
  components:
  - type: MCXenoReagentSelector
    entries:
      Neurotoxin:
        name: Neurotoxin
        sprite:
          sprite: _MC/Interface/Actions/Xeno/boiler.rsi
          state: neuro_glob
      Acid:
        name: Acid
        sprite:
          sprite: _MC/Interface/Actions/Xeno/boiler.rsi
          state: acid_glob
  - type: MCXenoGlob
    entries:
      Neurotoxin:
        globId: MCXenoProjectileGlobNeurotoxin
        shroudGlobId: MCSmokeXenoNeurotoxinBoiler
      Acid:
        globId: MCXenoProjectileGlobAcid
        shroudGlobId: MCSmokeXenoAcidBoiler

- type: entity
  id: MCXenoComponentBoilerGlobExtended
  abstract: true
  components:
  - type: MCXenoReagentSelector
    entries:
      Hemodile:
        name: Hemodile
        sprite:
          sprite: _MC/Interface/Xeno/toxins.rsi
          state: hemodile
        reagentId: MCHemodile
        smokeEntityId: MCSmokeXenoHemodile
      Ozelomelyn:
        name: Ozelomelyn
        sprite:
          sprite: _MC/Interface/Xeno/toxins.rsi
          state: ozelomelyn
        reagentId: MCOzelomelyn
        smokeEntityId: MCSmokeXenoOzelomelyn
      Transvitox:
        name: Transvitox
        sprite:
          sprite: _MC/Interface/Xeno/toxins.rsi
          state: transvitox
        reagentId: MCTransvitox
        smokeEntityId: MCSmokeXenoTransvitox
      Sanguinal:
        name: Sanguinal
        sprite:
          sprite: _MC/Interface/Xeno/toxins.rsi
          state: sanguinal
        reagentId: MCSanguinal
        smokeEntityId: MCSmokeXenoSanguinal
  - type: MCXenoGlob
    entries:
      Hemodile:
        globId: MCXenoProjectileGlobHemodile
        shroudGlobId: MCSmokeXenoHemodileBoiler
      Ozelomelyn:
        globId: MCXenoProjectileGlobOzelomelyn
        shroudGlobId: MCSmokeXenoOzelomelynBoiler
      Transvitox:
        globId: MCXenoProjectileGlobTransvitox
        shroudGlobId: MCSmokeXenoTransvitoxBoiler
      Sanguinal:
        globId: MCXenoProjectileGlobSanguinal
        shroudGlobId: MCSmokeXenoSanguinalBoiler
