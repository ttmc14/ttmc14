- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentBoilerGlob
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoBoiler
  name: boiler
  description: Gross!
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-boiler
  - type: GhostRole
    name: mc-job-name-xeno-boiler
  - type: RMCActionOrder
    id: MCXenoBoiler
  # Evolution
  - type: XenoEvolution
    strains:
    - MCXenoBoilerSizzler
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/boiler.rsi
    offset: 0, 0.35
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: boiler
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoBoiler
    actionIds:
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Abilities
    - MCActionXenoSelectReagent
    - MCActionXenoSprayAcidBoiler
    - MCActionXenoBoilerLongRange
    - MCActionXenoCreateGlob
    - MCActionXenoBombard
    - MCActionXenoAcidShroud
    # Utilities
    - MCActionXenoAcidStrong
    - MCActionXenoPlaceTrap
    hudOffset: -0.15, 0.25
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      325: Critical
      425: Dead
  - type: XenoPlasma
    plasma: 1000
    maxPlasma: 1000
    plasmaRegenOnWeeds: 50
  - type: MCArmor
    soft:
      melee: 45
      bullet: 45
      laser: 45
      energy: 45
      bomb: 0
      bio: 35
      fire: 45
      acid: 35
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.439
    baseSprintSpeed: 3.225
  - type: RMCSize
    size: Big
  - type: AcidBloodSplash
    damage:
      types:
        MCBurn: 30
    minimalTriggerDamage: 5
    baseHitProbability: 100
    baseSplashTriggerProbability: 40
    splashCooldown: 0.1
  # Utilities
  - type: AcidTrap # TODO: Make MC component
    trapLevel: 3
    spray: XenoAcidSprayTrapStrong # TODO: Acid gas boiler trap
  # Abilities
  - type: MCXenoZoom
    zoom: 1.5, 1.5
    offsetLength: 5
    doAfter: 1
  - type: XenoAcid # TODO: Make MC component
  - type: XenoSprayAcid # TODO: Make MC component
    acid: MCXenoAcidSprayBoiler
    range: 7
    doAfter: 0.5
    barricadeDamage:
      types:
        MCBurn: 45
  - type: MCXenoBombard
  - type: MCXenoAcidShroud

  # Strain: Sizzler 
- type: entity
  parent:
  # MC
  - MCXenoBoiler
  - MCXenoComponentReagentSelector
  id: MCXenoBoilerSizzler
  name: sizzler
  description: Gross!
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-boiler-sizzler
  - type: GhostRole
    name: mc-job-name-xeno-boiler-sizzler
  - type: RMCActionOrder
    id: MCXenoBoiler
  # Evolution
  - type: XenoEvolution
    strains:
    - []
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/boiler_sizzler.rsi
    offset: 0, 0.35
  - type: Xeno
    tier: 3
    role: MCXenoBoiler
    actionIds:
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Abilities
    - MCActionXenoEmitNeurogas
    - MCActionXenoCreateGlob
    - MCActionXenoAcidShroud
    - MCActionXenoPounce
    # Utilities
    - MCActionXenoAcidStrong
    - MCActionXenoPlaceTrap
    hudOffset: -0.15, 0.25
    # Statistic
  - type: MCArmor
    soft:
      melee: 40
      bullet: 25
      laser: 20
      energy: 20
      bomb: 0
      bio: 35
      fire: 20
      acid: 20
      fall: 100
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.777
      baseSprintSpeed: 4
    # Abilities
  - type: MCXenoPounce
    maxDistance: 7
    strength: 50
    hitSelfParalyzeTime: 0
    hitKnockdownTime: 0
    stopOnHit: false
    hitDamage: 0
  - type: MCXenoAcidShroud
  - type: MCXenoEmitNeurogas
    
# Components
- type: entity
  id: MCXenoComponentBoilerGlob
  abstract: true
  components:
  - type: MCXenoReagentSelector
    entries:
      Neurotoxin:
        name: Neurotoxin
        sprite:
          sprite: _MC/Interface/Actions/Xeno/boiler.rsi
          state: neuro_glob
      Acid:
        name: Acid
        sprite:
          sprite: _MC/Interface/Actions/Xeno/boiler.rsi
          state: acid_glob
  - type: MCXenoGlob
    entries:
      Neurotoxin:
        globId: MCXenoProjectileGlobNeurotoxin
        shroudGlobId: MCSmokeXenoNeurotoxinBoiler
      Acid:
        globId: MCXenoProjectileGlobAcid
        shroudGlobId: MCSmokeXenoAcidBoiler
