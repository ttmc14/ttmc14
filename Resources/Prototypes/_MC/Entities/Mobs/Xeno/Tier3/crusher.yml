- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentCharge
  - MCXenoComponentTier3
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoCrusher
  name: crusher
  description: A huge tanky xenomorph.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-crusher
  - type: GhostRole
    name: mc-job-name-xeno-crusher
  - type: RMCActionOrder
    id: MCXenoCrusher
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/crusher.rsi
    offset: 0, 0.35
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: crusher
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/crusher_rouny.rsi
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoCrusher
    actionIds:
    # Base
    - MCActionXenoHiveStatus
    - MCActionXenoRest
    - MCActionXenoPsydrain
    # Main
    - MCActionXenoCrestToss
    - MCActionXenoStomp
    - MCActionXenoCrusherForwardCharge
    # Utilities
    - MCActionXenoZoom
    hudOffset: -0.15, 0.25
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
  - type: XenoPlasma
    plasma: 400
    maxPlasma: 400
    plasmaRegenOnWeeds: 30
  - type: MCArmor
    soft:
      melee: 50
      bullet: 80
      laser: 65
      energy: 75
      bomb: 130
      bio: 100
      fire: 10
      acid: 100
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 25
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: RMCSize
    size: Big
  # Abilities
  - type: MCXenoZoom
    zoom: 1.5, 1.5
    offsetLength: 11
    doAfter: 1
  - type: MCXenoCrestToss
    damage:
      types:
        MCBrute: 36 # distance * 6 (36)
    speed: 10
  - type: MCXenoStomp
    distance: 1.75
    extraAffectDistance: 1.25
    damage:
      types:
        MCBrute: 60
    throwEntry:
      distance: 2
  # Passive
  - type: MCXenoSunder
    multiplier: 0.5
  # Pounce (Dash)
  - type: MCXenoPounce
    delay: 1
    maxDistance: 7
    strength: 45
    hitSelfParalyzeTime: 0
    hitKnockdownTime: 1
    stopOnHit: false
    hitSound: /Audio/_MC/Effects/alien_bite2.ogg
    hitDamage:
      types:
        MCBrute: 60
  - type: MCXenoPounceKnockback
    entry:
      distance: 2
      speed: 5
  # It's need?
  - type: MCXenoPounceHeal
    adjustPlasma: 45
    adjustHealth: 0
