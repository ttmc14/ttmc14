- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentTier3
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoGorger
  name: gorger
  description: A frightening looking, bulky alien creature that drips with a familiar red fluid.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-gorger
  - type: GhostRole
    name: mc-job-name-xeno-gorger
  - type: RMCActionOrder
    id: MCXenoGorger
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/gorger.rsi
    offset: 0, 0.2
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: gorger
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/gorger_rouny.rsi
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoGorger
    actionIds:
    # Base
    - MCActionXenoHiveStatus
    - MCActionXenoRest
    - MCActionXenoPsydrainFree
    # Abilities
    - MCActionXenoPsychicLink
    - MCActionXenoDrain
    - MCActionXenoTransfusion
    - MCActionXenoCarnage
    - MCActionXenoFeast
    - MCActionXenoDevour
    hudOffset: -0.1, 0.1
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
  - type: XenoPlasma
    alert: MCXenoBlood
    plasma: 100
    maxPlasma: 400
    plasmaRegenLimit: 40
    plasmaRegenOnWeeds: 5
  - type: MCArmor
    soft:
      melee: 20
      bullet: 15
      laser: 15
      energy: 20
      bomb: 10
      bio: 20
      fire: 10
      acid: 20
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8
    baseSprintSpeed: 3.8
  - type: RMCSize
    size: Big
  - type: MCXenoPlasma
    showBloodHud: true
    canBeGivenPlasma: false
    immuneToPlasmaDrain: true
  - type: MCXenoOverheal
    maximum: 275
  # Abilities
  - type: MCXenoPsychicLink
  - type: MCXenoDrain
  - type: MCXenoTransfusion
  - type: MCXenoCarnage
  - type: MCXenoFeast
  - type: MCXenoDevour

- type: entity
  parent: MCXenoGorger
  id: MCXenoGorgerPrimordial
  name: primordial gorger
  components:
  - type: XenoHidden
  - type: FixedIdentity
    name: mc-job-name-xeno-gorger-primordial
  - type: GhostRole
    name: mc-job-name-xeno-gorger-primordial
  - type: Xeno
    actionIds:
    - MCActionXenoHiveStatus
    - MCActionXenoRest
    - MCActionXenoPsydrainFree
    - MCActionXenoPsychicLink
    - MCActionXenoDrain
    - MCActionXenoTransfusion
    - MCActionXenoCarnage
    - MCActionXenoFeast
    - MCActionXenoDevour
    - MCActionXenoRejuvenate
    - MCActionXenoOppose
  - type: MCXenoRejuvenate
  - type: MCXenoOppose
