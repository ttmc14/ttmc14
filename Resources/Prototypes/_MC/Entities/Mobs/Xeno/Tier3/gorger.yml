- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentTier3
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoGorger
  name: gorger
  description: A frightening looking, bulky alien creature that drips with a familiar red fluid.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-gorger
  - type: GhostRole
    name: mc-job-name-xeno-gorger
  - type: RMCActionOrder
    id: MCXenoGorger
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/gorger.rsi
    offset: 0, 0.2
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: gorger
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/gorger_rouny.rsi
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoGorger
    actionIds:
    # Base
    - MCActionXenoHiveStatus
    - MCActionXenoRest
    - MCActionXenoPsydrain
    hudOffset: -0.1, 0.1
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
  - type: XenoPlasma
    plasma: 400
    maxPlasma: 400
    plasmaRegenLimit: 40
    plasmaRegenOnWeeds: 5
  - type: MCArmor
    soft:
      melee: 20
      bullet: 15
      laser: 15
      energy: 20
      bomb: 10
      bio: 20
      fire: 10
      acid: 20
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8
    baseSprintSpeed: 3.8
  - type: RMCSize
    size: Big
