- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentCharge
  - MCXenoComponentTier3
  - MCXenoComponentEvolutionTier3
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoBehemoth
  name: behemoth
  description: Behemoths are known to like rocks. Perhaps we should give them one!
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-behemot
  - type: GhostRole
    name: mc-job-name-xeno-behemot
  - type: RMCActionOrder
    id: MCXenoBehemoth
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/behemot.rsi
    offset: 0, 1
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: behemoth
  # Skins
  - type: MCXenoSkin
    skins: {}
  #    rouny: _MC/Mobs/Xenos/behemot_rouny.rsi
  # Actions
  - type: Xeno
    tier: 3
    role: MCXenoCrusher
    actionIds:
    # Visuals
    - MCActionXenoSkin
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoToggleChargingCrusher
    hudOffset: -0.15, 0.25
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      750: Critical
      850: Dead
  - type: XenoPlasma
    plasma: 200
    maxPlasma: 200
    plasmaRegenOnWeeds: 20
  - type: MCArmor
    soft:
      melee: 20
      bullet: 40
      laser: 40
      energy: 20
      bomb: 50
      bio: 50
      fire: 20
      acid: 50
    hard:
      melee: 0
      bullet: 12
      laser: 6
      energy: 10
      bomb: 0
      bio: 0
      fire: 0
      acid: 0
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 26
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.85
    baseSprintSpeed: 4
  - type: RMCSize
    size: Big
  # Abilities
  # Passive
  - type: MCXenoSunder
    multiplier: 0.5
