- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentFixtureRunner
  - MCXenoComponentTier2
  - MCXenoComponentEvolutionTier2
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoWraith
  name: wraith
  description: A strange xeno that utilizes its psychic powers to move out of phase with reality.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-wraith
  - type: GhostRole
    name: mc-job-name-xeno-wraith
  - type: RMCActionOrder
    id: MCXenoWraith
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/wraith.rsi
    offset: 0, 0.35
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: wraith
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/wraith_rouny.rsi
  # Actions
  - type: Xeno
    tier: 2
    role: MCXenoWraith
    actionIds:
    # Visuals
    - MCActionXenoSkin
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoRewind
    - MCActionXenoBlink
    - MCActionXenoPortalPlacer
    - MCActionXenoBanish
    - MCActionXenoRecall
    # Utilities
    - MCActionXenoTransferPlasmaUnbound
    hudOffset: -0.1, 0.1
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Critical
      450: Dead
  - type: XenoPlasma
    plasma: 500
    maxPlasma: 500
    plasmaRegenOnWeeds: 50
  - type: MCArmor
    soft:
      melee: 40
      bullet: 40
      laser: 40
      energy: 40
      bomb: 0
      bio: 20
      fire: 30
      acid: 20
  - type: MeleeWeapon
    attackRate: 1.7
    damage:
      types:
        MCBrute: 25
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6.25
  # Abilities
  - type: MCXenoTransferPlasma
    amount: 200
    delay: 0.5
    range: 7
  - type: MCXenoPortalPlacer
    portalFirst:
      id: MCXenoPortalOrange
      icon:
        sprite: _MC/Effects/portals.rsi
        state: orange
    portalSecond:
      id: MCXenoPortalBlue
      icon:
        sprite: _MC/Effects/portals.rsi
        state: blue
  - type: MCXenoBlink
    range: 2.5
  - type: MCXenoRewind
  - type: MCXenoBanish
- type: Tag
  id: MCXenoIgnoreBanish
