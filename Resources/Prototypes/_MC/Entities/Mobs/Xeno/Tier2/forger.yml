- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentTier2
  - MCXenoComponentEvolutionTier2
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoForger
  name: forger
  description: A skittish alien, it burns with fury.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-forger
  - type: GhostRole
    name: mc-job-name-xeno-forger
  - type: RMCActionOrder
    id: MCXenoForger
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/forger.rsi
    offset: 0, 0.35
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: forger
  # Skins
  - type: MCXenoSkin
    skins:
  #    rouny: _MC/Mobs/Xenos/forger_rouny.rsi
      cow: _MC/Mobs/Xenos/cowger.rsi
  # Actions
  - type: Xeno
    tier: 2
    role: MCXenoForger
    actionIds:
    # Visuals
    - MCActionXenoSkin
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoInferno
    - MCActionXenoFireball
    - MCActionXenoFirecharge
    - MCActionXenoWhirlwind
    hudOffset: -0.15, 0.25
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      275: Critical
      325: Dead
  - type: XenoPlasma
    plasma: 380
    maxPlasma: 380
    plasmaRegenOnWeeds: 18
  - type: MCArmor
    soft:
      melee: 40
      bullet: 40
      laser: 40
      energy: 40
      bomb: 0
      bio: 30
      fire: 200
      acid: 30
  - type: MeleeWeapon
    damage:
      types:
        MCBurn: 22
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.225
    baseSprintSpeed: 4.761
  # Abilities
  - type: MCXenoInferno
    damage:
      types:
        MCBurn: 30
  - type: MCXenoFireball
  - type: MCXenoWhirlwind
    fire: MCTileFireXenoAcid
    range: 7
    doAfter: 0.6
    delay: 0.3
    barricadeDamage:
      types:
        MCBurn: 5
  # Pounce (FireCharge)
  - type: MCXenoPounceEmote
    emote: XenoRoar
  - type: MCXenoPounceFireCharge
    damagePerFireStack:
      types:
        MCBurn: 5
  - type: MCXenoPounce
    maxDistance: 3
    strength: 30
    hitSelfParalyzeTime: 0
    hitKnockdownTime: 0
    stopOnHit: false
    hitDamage:
      types:
        MCBurn: 10
  # Passive abilities
  - type: RMCImmuneToIgnition
  - type: RMCImmuneToFireTileDamage
  - type: PointLight
    color: "#069420"
