- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentFixtureDefender
  - MCXenoComponentEvolutionTier1
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoDefender
  name: defender
  description: An alien with an armored crest.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-defender
  - type: GhostRole
    name: mc-job-name-xeno-defender
  - type: RMCActionOrder
    id: MCXenoDefender
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/defender.rsi
    offset: 0, 0.2
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: defender
  # Evolution
  - type: XenoEvolution
    strains:
    - MCXenoDefenderSteelCrest
  # Actions
  - type: Xeno
    tier: 1
    role: MCXenoDefender
    actionIds:
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoCrestDefense
    - MCActionXenoFortify
    - MCActionXenoTailSweep
    - MCActionXenoForwardCharge
    # Utilities
    - MCActionXenoRegenerateSkin
    hudOffset: -0.1, 0.2
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      420: Critical
      520: Dead
  - type: XenoPlasma
    plasma: 200
    maxPlasma: 200
    plasmaRegenOnWeeds: 20
  - type: MCArmor
    soft:
      melee: 45
      bullet: 45
      laser: 45
      energy: 45
      bomb: 30
      bio: 30
      fire: 40
      acid: 30
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 22
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.941
    baseSprintSpeed: 4.166
  # Abilities
  - type: XenoCrest # TODO: Make MC component
  - type: XenoFortify # TODO: Make MC component
  - type: XenoTailSweep # TODO: Make MC component
    damage:
      types:
        MCBrute: 30
  - type: MCXenoRegenerateSkin
  # Pounce (Forward Charge)
  - type: MCXenoPounce
    maxDistance: 5
    strength: 50
    hitSelfParalyzeTime: 0
    hitKnockdownTime: 4
    stopOnHit: false
    hitDamage:
      types:
        MCBrute: 11

- type: entity
  parent:
  # MC
  - MCXenoDefender
  id: MCXenoDefenderSteelCrest
  name: steel crest defender
  description: An alien with an armored crest.
  components:
  - type: XenoHidden
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-defender-steelcrest
  - type: GhostRole
    name: mc-job-name-xeno-defender-steelcrest
  - type: RMCActionOrder
    id: MCXenoDefenderSteelCrest
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/defendersteelcrest.rsi
    offset: 0, 0.2
    # Actions
  - type: Xeno
    tier: 1
    role: MCXenoDefender
    actionIds:
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoCrestDefense
    - MCActionXenoFortify
    - ActionXenoHeadbutt # - TODO: Make MC component
    # Utilities
    - ActionXenoSoak # - TODO: Make MC component
  # Evolution
  - type: XenoEvolution
    strains: []
    # Statistics
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3528
    baseSprintSpeed: 3.3328
    # Abilities
  - type: XenoFortify # TODO: Make MC component
    armor: 25 # - TODO: Make MC armor
    frontalArmor: 0
    changeExplosionWeakness: false
    canHeadbuttFortified: true
    canMoveFortified: true
    damageAddedFortified:
      groups:
        MCBrute: -10
  - type: XenoHeadbutt # - TODO: Make MC component
    damage:
      types:
        MCBrute: 37.5
  - type: XenoSoak # - TODO: Make MC component / IDK how this is work, but it work

# Components (Separated for ease of editing/reading)
- type: entity
  id: MCXenoComponentFixtureDefender
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 185
        mask:
        - MobMask
        - BarbedBarricade
        layer:
        - MobLayer
      fix2:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 185
        layer:
        - BulletImpassable
