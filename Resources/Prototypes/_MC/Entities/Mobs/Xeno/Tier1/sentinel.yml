- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentSpiting
  - MCXenoComponentEvolutionTier1
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoSentinel
  name: sentinel
  description: A weak ranged combat alien.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-sentinel
  - type: GhostRole
    name: mc-job-name-xeno-sentinel
  - type: RMCActionOrder
    id: MCXenoSentinel
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/sentinel.rsi
    offset: -0.1, 0.2
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: sentinel
  # Evolution
  - type: XenoEvolution
    strains:
    - MCXenoSentinelRetrograde
  # Actions
  - type: Xeno
    tier: 1
    role: MCXenoSentinel
    actionIds:
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoToggleSpitToxic
    - MCActionXenoToxicSlash
    - MCActionXenoDrainSting
    # Utilities
    - MCActionXenoAcidWeak
    - MCActionXenoPlaceTrap
    hudOffset: -0.2, 0.07
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      370: Critical
      470: Dead
  - type: XenoPlasma
    plasma: 600
    maxPlasma: 600
    plasmaRegenOnWeeds: 20
  - type: MCArmor
    soft:
      melee: 30
      bullet: 30
      laser: 30
      energy: 30
      bomb: 10
      bio: 30
      fire: 30
      acid: 30
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 20
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.225
    baseSprintSpeed: 4.761
  # Abilities
  - type: MCXenoToxicSlash
  - type: MCXenoDrainSting
  - type: XenoAcid # TODO: Make MC component
  - type: AcidTrap # TODO: Make MC component
    trapLevel: 1
    cost: 70
    spray: XenoAcidSprayTrapWeak
  - type: VentCrawler
    ventCrawlIcon: drone

- type: entity
  parent: MCXenoSentinel
  id: MCXenoSentinelRetrograde
  name: retrograde sentinel
  description: A weak ranged combat alien. This one seems to have a different kind of spit.
  components:
  - type: XenoHidden
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-sentinel-retrograde
  - type: GhostRole
    name: mc-job-name-xeno-sentinel-retrograde
  - type: RMCActionOrder
    id: MCXenoSentinelRetrograde
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/sentinel_retrograde.rsi
    offset: -0.1, 0.2
  # Evolution
  - type: XenoEvolution
    strains: []
  # Actions
  - type: Xeno
    tier: 1
    role: MCXenoSentinelRetrograde
    actionIds:
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoToggleSpitPassthrough
    - MCActionXenoToggleSpitToxin
    - MCActionXenoNeurotoxinSting
    # Utilities
    - MCActionXenoAcidWeak
    - MCActionXenoPlaceTrap
  # Abilities
  - type: MCXenoNeurotoxinSting
    reagents:
    - ReagentId: MCNeurotoxin
      Quantity: 5
