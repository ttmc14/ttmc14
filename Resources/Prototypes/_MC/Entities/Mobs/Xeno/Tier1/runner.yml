- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentFixtureRunner
  - MCXenoComponentLayersRunner
  - MCXenoComponentTier1
  - MCXenoComponentEvolutionTier1
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoRunner
  name: runner
  description: A fast, four-legged terror. Weak in sustained combat.
  components:
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-runner
  - type: GhostRole
    name: mc-job-name-xeno-runner
  - type: RMCActionOrder
    id: MCXenoRunner
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/runner.rsi
    offset: 0, 0.65
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: runner
  # Skins
  - type: MCXenoSkin
    skins:
      rouny: _MC/Mobs/Xenos/runner_rouny.rsi
  # Evolution
  - type: XenoEvolution
    strains:
    - MCXenoRunnerMelter
  # Actions
  - type: MCXenoEvolutionIgnoreRulerRequirement
  - type: Xeno
    tier: 1
    role: MCXenoRunner
    actionIds:
    # Visuals
    - MCActionXenoSkin
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoEvasion
    - MCActionXenoPounce
    # Utilities
    - MCActionXenoHide
    hudOffset: -0.2, 0.3
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      350: Dead
  - type: XenoPlasma
    plasma: 200
    maxPlasma: 200
    plasmaRegenOnWeeds: 11
  - type: MCArmor
    soft:
      melee: 30
      bullet: 30
      laser: 30
      energy: 30
      bomb: 0
      bio: 5
      fire: 20
      acid: 5
  - type: MeleeWeapon
    attackRate: 1.7
    damage:
      types:
        MCBrute: 20
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6.25
  # Abilities
  - type: MCXenoPounce
    hitSound: /Audio/_RMC14/Xeno/alien_pounce.ogg
    hitDamage:
      types:
        MCBrute: 25
  - type: MCXenoEvasion
  - type: XenoHide # TODO: Make MC component
  - type: VentCrawler
    ventCrawlIcon: drone

- type: entity
  parent:
  - MCXenoRunner
  id: MCXenoRunnerMelter
  name: melter
  description: A fast, four-legged terror. It got acid covered all over it.
  components:
  - type: XenoHidden
  # Name
  - type: FixedIdentity
    name: mc-job-name-xeno-runner-melter
  - type: GhostRole
    name: mc-job-name-xeno-runner-melter
  - type: RMCActionOrder
    id: MCXenoRunnerMelter
  # Visuals
  - type: Sprite
    sprite: _MC/Mobs/Xenos/runner_melter.rsi
    offset: 0, 0.65
  # Evolution
  - type: XenoEvolution
    strains: []
  # Actions
  - type: Xeno
    tier: 1
    role: MCXenoRunnerMelter
    actionIds:
    # Base
    - MCActionXenoRest
    - MCActionXenoPsydrain
    - MCActionXenoDevolve
    # Main
    - MCActionXenoMelterShroud
    - MCActionXenoMelterPounce
    - MCActionXenoMelterAcid
    # Utilities
    - MCActionXenoHide
    hudOffset: -0.2, 0.3
  # Statistics
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Critical
      400: Dead
  - type: XenoPlasma
    plasma: 200
    maxPlasma: 200
    plasmaRegenOnWeeds: 11
  - type: MCArmor
    soft:
      melee: 35
      bullet: 35
      laser: 35
      energy: 35
      bomb: 5
      bio: 10
      fire: 25
      acid: 10
  - type: MeleeWeapon
    attackRate: 1.7
    damage:
      types:
        MCBrute: 5
        MCBurn: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.25
    baseSprintSpeed: 5.9
  - type: AcidBloodSplash
    damage:
      types:
        MCBurn: 20
    minimalTriggerDamage: 5
    baseHitProbability: 100
    baseSplashTriggerProbability: 25
    splashCooldown: 0.05
  # Abilities
  - type: MCXenoPounceEmote
    emote: XenoRoar
  - type: MCXenoPounce
    maxDistance: 7
    strength: 45
    stopOnHit: false
    hitDamage:
      types:
        MCBurn: 10
  - type: MCXenoPounceTrail
    trailId: MCXenoAcidSprayMelter
  - type: XenoHide # TODO: Make MC component
  - type: XenoAcid # TODO: Make MC component
  - type: AcidTrap # TODO: Make MC component
    trapLevel: 1
    cost: 70
    spray: XenoAcidSprayTrapWeak
  - type: MCXenoMelterShroud
    shroudId: MCSmokeXenoAcidMelter

- type: entity
  parent:
  - MCXenoRunner
  - MCAIXenoRunner
  id: MCXenoRunnerAI
  suffix: AI

# Components (Separated for ease of editing/reading)
- type: entity
  id: MCXenoComponentLayersRunner
  abstract: true
  components:
  - type: Sprite
    layers:
    - map: [ "enum.XenoVisualLayers.Base" ]
      state: alive
    - map: [ "enum.RMCDamageVisualLayers.Base" ]
      visible: false
    - map: [ "enum.XenoInhandVisualLayers.Left" ]
      visible: false
    - map: [ "enum.XenoInhandVisualLayers.Right" ]
      visible: false
    - map: [ "enum.EvasionLayer.Base" ]
      sprite: _MC/Interface/Hud/timer.rsi
      state: "1"
      offset: 0.5, -0.5
      visible: false
    - map: [ "focused" ]
      sprite: _RMC14/Interface/xeno_hud.rsi
      state: hudeye
      visible: false

- type: entity
  id: MCXenoComponentFixtureRunner
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 85
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape: !type:PhysShapeCircle
          radius: 0.40
        density: 85
        layer:
        - BulletImpassable
