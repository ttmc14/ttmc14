- type: entity
  parent:
  # MC
  - MCXenoBase
  - MCXenoComponentPickup
  - MCXenoComponentPlantingWeeds
  - MCXenoComponentCharge
  - MCXenoComponentSpiting
  - MCXenoComponentBlessings
  # RMC
  - CMXenoDeveloped
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: MCXenoQueen
  name: Queen
  description: The biggest and baddest xeno. The Queen controls the hive.
  components:
  - type: Sprite
    sprite: _MC/Mobs/Xenos/queen.rsi
    offset: 0,0.2
  - type: GhostRole
    name: mc-job-name-xeno-defiller
  - type: FixedIdentity
    name: mc-job-name-xeno-defiller
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
  - type: XenoAnnounceDeath
    message: mc-xeno-hive-ruler-dead
    color: "#921992"
  - type: XenoPlasma
    plasma: 1200
    maxPlasma: 1200
    plasmaRegenOnWeeds: 90
  - type: Xeno
    tier: 0 # 4
    role: MCXenoQueen
    actionIds:
    - MCActionXenoRest
    - MCActionXenoPsydrain
    # Construction
    - MCActionXenoChooseStructure
    - MCActionXenoSecreteStructure
    - MCActionXenoLayEgg
    - MCActionXenoBlessings
    # Weeds
    - MCActionXenoSelectWeeds
    - MCActionXenoPlantWeeds
    # Main
    - MCActionXenoZoom
    - MCActionXenoAcidicSalve # TODO: remove
    - MCActionXenoPheromones
    - MCActionXenoToggleXenoSpitStickyResin
    - MCActionXenoAcidStrong
    # Utilities
    - MCActionXenoOzelomelynSting
    # Primo
    - MCActionXenoToggleChargingQueen
    hudOffset: -0.1,0.1
  - type: XenoEvolutionCapped
    id: MCXenoQueen
    max: 1
  - type: MCArmor
    soft:
      melee: 65
      bullet: 70
      laser: 70
      energy: 65
      bomb: 100
      bio: 60
      fire: 100
      acid: 60
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 30
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.702
    baseSprintSpeed: 3.703
  - type: XenoPheromones
    pheromonesMultiplier: 5
    pheroSuffix: queen
  - type: TunnelRenamer
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: queen
  - type: XenoInhands
    prefix: queen
  - type: MCXenoHiveLeader
  - type: RMCSize
    size: Big
  - type: XenoAcid
  # - type: MCXenoLayEgg
  - type: DropshipHijacker
  - type: TacticalMapUser
    canDraw: true
  # Abilities
  - type: MCXenoAcidicSalve
  - type: MCXenoZoom
    zoom: 1.5,1.5
    doAfter: 1
  - type: XenoConstruction
    buildDelay: 2
  - type: MCXenoNeurotoxinSting
    reagents:
    - ReagentId: MCOzelomelyn
      Quantity: 5
