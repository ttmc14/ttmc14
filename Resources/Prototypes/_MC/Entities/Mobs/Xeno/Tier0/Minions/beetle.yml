- type: entity
  parent: MCXenoMinion
  id: MCXenoMinionBeetle
  name: beetle
  description: An alien.
  components:
  - type: Sprite
    sprite: _MC/Mobs/Xenos/beetle.rsi
    offset: 0,0.5
  - type: GhostRole
    name: mc-job-name-xeno-beetle
  - type: FixedIdentity
    name: mc-job-name-xeno-beetle
  - type: Xeno
    tier: -1
    role: MCXenoMinionBeetle
    actionIds:
    - MCActionXenoRest
  # Abilities
    - MCActionXenoForwardCharge
    - MCActionXenoCrestDefense
    hudOffset: -0.2,0.3
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      350: Dead
  - type: XenoPlasma
    plasma: 320
    maxPlasma: 320
    plasmaRegenOnWeeds: 10
  - type: MeleeWeapon
    damage:
      types:
        MCBrute: 17
  - type: MCArmor
    soft:
      melee: 25
      bullet: 25
      laser: 25
      energy: 25
      bomb: 25
      bio: 25
      fire: 25
      acid: 25
# Abilities
  - type: XenoCrest # TODO: Make MC component
  # Pounce (Forward Charge)
  - type: MCXenoPounce
    maxDistance: 5
    strength: 50
    hitSelfParalyzeTime: 0
    hitKnockdownTime: 4
    stopOnHit: false
    hitDamage:
      types:
        MCBrute: 11
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.333
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_MC/Interface/MapIcons/Xeno/xeno.rsi
      state: minion
