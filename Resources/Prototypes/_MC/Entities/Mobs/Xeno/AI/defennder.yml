- type: entity
  id: MCAIXenoDefender
  components:
  - type: InputMover
  - type: MCAIAgent
    # Goals
    goals:

    - desiredState:
        Barricade: false
      preconditions:
        Barricade: true
      priority: 9

    - desiredState:
        EnemyDead: true
      preconditions:
        Enemy: true
      priority: 10

    - desiredState:
        Explore: true
      priority: 1
    # Sensors
    sensors:

    - !type:MCAISensorNearestHostile
      conditionKey: Enemy
      outputTargetKey: hostile

    - !type:MCAISensorTargetDead
      conditionKey: EnemyDead
      targetKey: hostile

    - !type:MCAISensorNearestBarricade
      conditionKey: Barricade
      outputTargetKey: barricade

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRange
      targetKey: hostile
      range: 1.3

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRangeClose
      targetKey: hostile
      range: 0.95

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRangeFar
      targetKey: hostile
      range: 3

    - !type:MCAISensorRangeToTarget
      conditionKey: BarricadeInRange
      targetKey: barricade
      range: 1.3

    - !type:MCAISensorCheckHealthLevel
      conditionKey: LowHealth
      threshold: 0.5

    - !type:MCAISensorCheckPlasmaLevel
      conditionKey: LowPlasma
      threshold: 0.25

    - !type:MCAISensorCheckPlasmaLevel
      conditionKey: HightPlasma
      threshold: 0.95

    # Actions
    actions:

    - !type:MCAIActionUse
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRange: true
      effects:
        EnemyDead: true
      cost: 0.5
      actionPrototype: MCActionXenoTailSweep

    - !type:MCAIActionUse
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRangeFar: true
      effects:
        EnemyDead: true
      cost: 0.5
      actionPrototype: MCActionXenoForwardCharge

    - !type:MCAIActionMoveToTarget
      targetKey: hostile
      preconditions:
        Enemy: true
      effects:
        EnemyInRange: true

    - !type:MCAIActionMeleeAttack
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRange: true
      effects:
        EnemyDead: true

    - !type:MCAIActionMoveToTarget
      targetKey: barricade
      preconditions:
        Barricade: true
      effects:
        BarricadeInRange: true

    - !type:MCAIActionMeleeAttack
      targetKey: barricade
      preconditions:
        Barricade: true
        BarricadeInRange: true
      effects:
        Barricade: false
    - !type:MCAIActionFindExplorePoint
      outputTargetKey: ExplorePoint
      effects:
        FoundExplorePoint: true

    - !type:MCAIActionMoveToTarget
      targetKey: ExplorePoint
      preconditions:
        FoundExplorePoint: true
      effects:
        Explore: true
