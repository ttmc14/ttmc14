- type: entity
  id: MCAIXenoDefender
  components:
  - type: MCAIAgent
    # Goals
    goals:

    - desiredState:
        BarricadeDestroyed: true
      preconditions:
        Barricade: true
      priority: 11

    - desiredState:
        EnemyDead: true
      preconditions:
        Enemy: true
      priority: 10

    - desiredState:
        Explore: true
      priority: 1
    # Sensors
    sensors:

    - !type:MCAISensorNearestHostile
      conditionKey: Enemy
      outputTargetKey: hostile

    - !type:MCAISensorNearestBarricade
      conditionKey: Barricade
      outputTargetKey: barricade

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRange
      targetKey: hostile
      range: 1.5

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRangeClose
      targetKey: hostile
      range: 0.95

    - !type:MCAISensorRangeToTarget
      conditionKey: EnemyInRangeFar
      targetKey: hostile
      range: 4.75

    - !type:MCAISensorRangeToTarget
      conditionKey: BarricadeInRange
      targetKey: barricade
      range: 1.5

    - !type:MCAISensorCheckHealthLevel
      conditionKey: LowHealth
      threshold: 0.5

    - !type:MCAISensorCheckPlasmaLevel
      conditionKey: LowPlasma
      threshold: 0.25

    - !type:MCAISensorCheckPlasmaLevel
      conditionKey: HightPlasma
      threshold: 0.95
    # Actions
    actions:

    - !type:MCAIActionUse
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRange: true
      effects:
        EnemyDead: true
      cost: 0.5
      actionPrototype: MCActionXenoTailSweep

    - !type:MCAIActionUse
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRangeFar: true
      effects:
        EnemyDead: true
      cost: 0.5
      actionPrototype: MCActionXenoForwardCharge

    - !type:MCAIActionMoveToTarget
      targetKey: hostile
      preconditions:
        Enemy: true
      effects:
        EnemyInRange: true

    - !type:MCAIActionMeleeAttack
      targetKey: hostile
      preconditions:
        Enemy: true
        EnemyInRange: true
      effects:
        EnemyDead: true

    - !type:MCAIActionMoveToTarget
      targetKey: barricade
      preconditions:
        Barricade: true
      effects:
        BarricadeInRange: true

    - !type:MCAIActionMeleeAttack
      targetKey: barricade
      preconditions:
        Barricade: true
        BarricadeInRange: true
      effects:
        BarricadeDestroyed: true

    - !type:MCAIActionFindExplorePoint
      outputTargetKey: ExplorePoint
      effects:
        FoundExplorePoint: true

    - !type:MCAIActionMoveToTarget
      targetKey: ExplorePoint
      preconditions:
        FoundExplorePoint: true
      effects:
        Explore: true
