- type: entity
  parent: MarkerBase
  id: MCSpawnerRandomTools
  name: random tools spawner
  description: This is a random tool.
  categories: [ MCContent ]
  suffix: MC 100%
  components:
    - type: Sprite
      layers:
        - sprite: _RMC14/Markers/landmarks.rsi
          state: random_tool
    - type: RandomSpawner
      prototypes:
        - CMScrewdriver
        - CMWirecutter
        - CMWelder
        - CMCrowbar
        - CMWrench
        - RMCFlashlight
      chance: 1
      offset: 0

