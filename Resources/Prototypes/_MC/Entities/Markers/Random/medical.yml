# Medical Clotch spawners
- type: entity
  parent: MarkerBase
  id: MCSpawnerRandomMedbelt
  name: Random medical belt spawner
  description: This is a random medical belt spawner.
  categories: [ MCContent ]
  suffix: MC 100%
  components:
    - type: Sprite
      layers:
        - sprite: _MC/Markers/medical.rsi
          state: random_medbelt
    - type: RandomSpawner
      prototypes:
        - MCBeltMedical
        - MCBeltMedical
        - MCBeltMedicBag
        - MCSpawnerRandomPillBottles
      chance: 0.95
      rarePrototypes:
        - MCBeltMedicBagFull
      rareChance: 0.05
      offset: 0

