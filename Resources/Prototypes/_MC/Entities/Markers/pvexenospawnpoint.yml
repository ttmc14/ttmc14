- type: entity
  name: PVE Xeno Spawn Point
  id: MCPVEXenoSpawnPointMarker
  parent: MarkerBase
  suffix: MC
  components:
  - type: Sprite
    sprite: _MC/Markers/landmarks.rsi
    state: ai_node
  - type: MCPVEXenoSpawnPoint
