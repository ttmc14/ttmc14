- type: entity
  parent: ActionXenoBase
  id: MCActionXenoSprayAcidBoiler
  name: Spray Acid (250)
  description: Spray a line of dangerous acid at your target.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: spray_acid_line
    useDelay: 9
  - type: TargetAction
    range: 15
  - type: WorldTargetAction
    event: !type:XenoSprayAcidActionEvent
  - type: XenoActionPlasma
    cost: 250
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoCreateGlob
  name: Create bomb (200)
  description: Creates a Boiler Bombard.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: create_bomb_count_0
    useDelay: 1.5
  - type: InstantAction
    event: !type:MCXenoCreateGlobActionEvent
      statePrefix: create_bomb_count_
  - type: XenoActionPlasma
    cost: 200

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoBombard
  name: Bombard
  description: Launch a glob of acid
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: bombard
    useDelay: 27
  - type: TargetAction
    targetingIndicator: true
    checkCanAccess: false
    repeat: true
    range: 30
  - type: EntityTargetAction
  - type: WorldTargetAction
    event: !type:MCXenoBombardLaunchActionEvent
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoBoilerLongRange
  name: Toggle Long Range Sight
  description: Activates your weapon sight in the direction you are facing. Must remain stationary to use.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: toggle_long_range
  - type: InstantAction
    event: !type:MCXenoZoomActionEvent
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoAcidShroud
  name: Acid Shroud (200)
  description: Create a smokescreen of gas, setting your Bombard on a longer cooldown. Does not require or consume a reserved globule.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: acid_shroud
    useDelay: 30
  - type: InstantAction
    event: !type:MCXenoAcidShroudActionEvent
  - type: XenoActionPlasma
    cost: 200
