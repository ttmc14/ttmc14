# Acid spit
- type: entity
  parent: ActionXenoBase
  id: MCActionXenoSpitPraetorianAcid
  name: acid splash
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spits.rsi
      state: shift_spit_xeno_acid
    useDelay: 0.1
  - type: InstantAction
    event: !type:MCXenoSpitToggleActionEvent
      projectileId: MCXenoSpitPraetorianAcid
      plasmaCost: 70
      delay: 1
      speed: 40

- type: entity
  parent: MCXenoProjectile
  id: MCXenoSpitPraetorianAcid
  components:
  - type: Sprite
    layers:
    - state: xeno_acid_strong
      shader: unshaded
  - type: Projectile
    damage:
      types:
        MCBurn: 40
  - type: XenoProjectile
    deleteOnFriendlyXeno: true
  - type: ProjectileMaxRange
    max: 8
  - type: MCXenoSpawnAcidSprayOnTerminating
    spawn: MCXenoAcidSprayScatterSpitSpitter
  - type: MCXenoProjectileTargetingTurf

# Toxin spit
- type: entity
  parent: ActionXenoBase
  id: MCActionXenoSpitPraetorianToxin
  name: toxin splash
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spits.rsi
      state: shift_spit_neurotoxin
    useDelay: 0.1
  - type: InstantAction
    event: !type:MCXenoSpitToggleActionEvent
      projectileId: MCXenoSpitPraetorianToxin
      plasmaCost: 100
      delay: 1
      speed: 40

- type: entity
  parent: MCXenoProjectile
  id: MCXenoSpitPraetorianToxin
  components:
  - type: Sprite
    layers:
    - state: neurotoxin
      shader: unshaded
  - type: Projectile
    damage:
      types: null
  - type: XenoProjectile
    deleteOnFriendlyXeno: false
  - type: MCStaminaDamageOnCollide
    damage: 10 # 40 to large?
  - type: ProjectileMaxRange
    max: 10
  - type: MCProjectileInject
    reagents:
    - ReagentId: MCNeurotoxin
      Quantity: 10
  - type: MCXenoSpawnAcidSprayOnTerminating
    spawn: MCSmokeXenoPraetorianNeurotoxin
  - type: MCXenoProjectileTargetingTurf

- type: entity
  parent: MCSmokeTile
  id: MCSmokeXenoPraetorianNeurotoxin
  name: smoke xeno neurotoxin lite
  components:
  - type: Sprite
    color: "#ffbf583c"
  # - type: MCSmokeReagent
  #   reagents:
  #   - ReagentId: MCNeurotoxin
  #     Quantity: 10
  - type: TimedDespawn
    lifetime: 1
  - type: MCTimedDespawnDisappearanceVisuals
    lifetime: 1

# Other
- type: entity
  parent: MCActionXenoStaggerable
  id: MCActionXenoDash
  name: Dash (100)
  description: Instantly dash to the selected tile.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/runner.rsi
      state: pounce
    useDelay: 10
  - type: TargetAction
    range: 100
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MCXenoPounceActionEvent
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoToggleXenoSpitToxLossRetrogradePraetorian
  name: toxin splash retrograde
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spits.rsi
      state: shift_spit_neurotoxin
    useDelay: 0.1
  - type: InstantAction
    event: !type:MCXenoSpitToggleActionEvent
      projectileId: MCXenoProjectileHeavyToxLoss
      plasmaCost: 180
      delay: 1
      speed: 40

- type: entity
  parent: MCActionXenoStaggerable
  id: MCActionXenoSprayAcidPraetorian
  name: Spray Acid (100)
  description: Spray a short line of dangerous acid at your target.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: spray_acid
    useDelay: 10
  - type: TargetAction
    range: 15
  - type: WorldTargetAction
    event: !type:XenoSprayAcidActionEvent
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting

- type: entity
  parent: MCActionXenoStaggerable
  id: MCActionXenoScatterSpitPraetorian
  name: Scatter Spit (280)
  description: Spits a spread of acid projectiles that splatter on the ground.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spitter.rsi
      state: scatter_spit
    useDelay: 1
  - type: TargetAction
    repeat: true
    checkCanAccess: false
    range: 15
  - type: EntityTargetAction
  - type: WorldTargetAction
    event: !type:MCXenoScatterSpitActionEvent
  - type: XenoActionPlasma
    cost: 280
  - type: ActionBlockIfResting

- type: entity
  parent: MCXenoProjectile
  id: MCXenoProjectileHeavyToxLoss
  name: toxin splash
  components:
  - type: Sprite
    layers:
    - state: neurotoxin
      shader: unshaded
  - type: Projectile
    damage:
      types: null
  - type: XenoProjectile
    deleteOnFriendlyXeno: false
  - type: ProjectileMaxRange
