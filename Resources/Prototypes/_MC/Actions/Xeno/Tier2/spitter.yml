# Spits
- type: entity
  parent: ActionXenoBase
  id: MCActionXenoSpitSpitter
  name: xeno Spit
  description: Spit neurotoxin or acid at your target up to 7 tiles away.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spits.rsi
      state: shift_spit_xeno_acid
    useDelay: 0.1
  - type: InstantAction
    event: !type:MCXenoSpitToggleActionEvent
      projectileId: MCXenoSpitSpitter
      plasmaCost: 50
      delay: 1
      speed: 30

- type: entity
  parent: MCXenoProjectile
  id: MCXenoSpitSpitter
  components:
  - type: Sprite
    layers:
    - state: xeno_acid
      shader: unshaded
  - type: Projectile
    damage:
      types:
        MCBurn: 35
  - type: XenoProjectile
    deleteOnFriendlyXeno: true
  - type: ProjectileMaxRange
    max: 8

# Scatter spit
- type: entity
  parent: MCActionXenoStaggerable
  id: MCActionXenoScatterSpit
  name: Scatter Spit (280)
  description: Spits a spread of acid projectiles that splatter on the ground.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/spitter.rsi
      state: scatter_spit
    useDelay: 5
  - type: TargetAction
    repeat: true
    checkCanAccess: false
    range: 15
  - type: EntityTargetAction
  - type: WorldTargetAction
    event: !type:MCXenoScatterSpitActionEvent
  - type: XenoActionPlasma
    cost: 280
  - type: ActionBlockIfResting

- type: entity
  parent: MCXenoProjectile
  id: MCActionXenoScatterSpitSpitter
  components:
  - type: Sprite
    layers:
    - state: xeno_acid_normal
      shader: unshaded
  - type: Projectile
    damage:
      types:
        MCBurn: 20
  - type: XenoProjectile
    deleteOnFriendlyXeno: false
  - type: ProjectileMaxRange
    max: 8
  - type: MCXenoSpawnAcidSprayOnTerminating
    spawn: MCXenoAcidSprayScatterSpitSpitter
  - type: MCXenoProjectileTargetingTurf

- type: entity
  parent: MCXenoAcidSpray
  id: MCXenoAcidSprayScatterSpitSpitter
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: DamageOnCollide
    damage:
      types:
        MCBurn: 14

# Other
- type: entity
  parent: MCActionXenoStaggerable
  id: MCActionXenoSprayAcid
  name: Spray Acid (250)
  description: Spray a line of dangerous acid at your target.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/boiler.rsi
      state: spray_acid
    useDelay: 30
  - type: TargetAction
    range: 15
  - type: WorldTargetAction
    event: !type:XenoSprayAcidActionEvent
  - type: XenoActionPlasma
    cost: 250
  - type: ActionBlockIfResting

