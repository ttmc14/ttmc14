- type: entity
  parent: ActionXenoBase
  id: MCActionXenoInferno
  name: Inferno (50)
  description: After a short cast time, release a burst of fire in a 5x5 radius. All tiles are set on fire. Humans are set on fire and burnt.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/forger.rsi
      state: inferno
    useDelay: 18
  - type: InstantAction
    event: !type:MCXenoInfernoActionEvent
  - type: XenoActionPlasma
    cost: 50
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoFireball
  name: Fireball (50)
  description: Release a fireball that explodes on contact.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/forger.rsi
      state: fireball
    useDelay: 15
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:MCXenoFireballActionEvent
  - type: XenoActionPlasma
    cost: 50
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoFirecharge
  name: Fire Charge (30)
  description: Charge up to 3 tiles, attacking any organic you come across. Extinguishes the target if they were set on fire, but deals extra damage depending on how many fire stacks they have.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/forger.rsi
      state: fireslash
    useDelay: 12
  - type: TargetAction
    range: 100
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MCXenoPounceActionEvent
  - type: XenoActionPlasma
    cost: 30
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: MCActionXenoWhirlwind
  name: Fire Storm (50)
  description: Aim in a direction to send a fiery whirlwind 8 meters or until it hits an obstacle. It burns marines on contact and leaves melting fire along its path and on random nearby patches of floor.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Interface/Actions/Xeno/forger.rsi
      state: whirlwind
    useDelay: 12
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MCXenoWhirlwindActionEvent
  - type: XenoActionPlasma
    cost: 50
  - type: ActionBlockIfResting
