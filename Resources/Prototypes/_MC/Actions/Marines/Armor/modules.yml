- type: entity
  parent: ActionMarineBase
  id: MCActionModuleValiBoost
  name: Power Vali Chemical Enhancement
  components:
  - type: Action
    itemIconStyle: BigAction
    iconOn:
      sprite: _MC/Actions/actions.rsi
      state: cboost_on
