- type: entity
  parent: ActionMarineBase
  id: MCActionModuleToggleWelding
  name: Toggle the welding visor
  description: Change the positions of the welding visor on your forehead.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _MC/Clothing/modular.rsi
      state: welding_head
    backgroundOn:
      sprite: _MC/Actions/actions.rsi
      state: selected_frame
  - type: InstantAction
    event: !type:MCModuleEyeProtectionActionEvent

- type: entity
  parent: ActionMarineBase
  id: MCActionModuleToggleBinocular
  name: Toggle the binocular visor
  description: Change the positions of the binocular visor on your forehead.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _MC/Clothing/modular.rsi
      state: binocular_head
    backgroundOn:
      sprite: _MC/Actions/actions.rsi
      state: selected_frame
  - type: InstantAction
    event: !type:MCModuleBinocularActionEvent

# Pluto & Vali
- type: entity
  parent: ActionMarineBase
  id: MCActionModuleMedicalScan
  name: User Medical Scan
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _MC/Actions/actions.rsi
      state: suit_scan
    backgroundOn:
      sprite: _MC/Actions/actions.rsi
      state: active
  - type: InstantAction
    event: !type:MCModuleHealthScanActionEvent

# Vali
- type: entity
  parent: ActionMarineBase
  id: MCActionModuleValiSettings
  name: Configure Vali Chemical Enhancement
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _MC/Actions/actions.rsi
      state: cboost_configure
    backgroundOn:
      sprite: _MC/Actions/actions.rsi
      state: active
  - type: InstantAction
    event: !type:MCModuleBinocularActionEvent

- type: entity
  parent: ActionMarineBase
  id: MCActionModuleValiConnect
  name: Connect Weapon
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _MC/Actions/actions.rsi
      state: vali_weapon_connect
    backgroundOn:
      sprite: _MC/Actions/actions.rsi
      state: active
  - type: InstantAction
